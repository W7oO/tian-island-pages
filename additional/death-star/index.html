  <script>
(()=>{'use strict';
/* ==========================================================================
   死星遗迹 · Abandoned Planet
   一颗曾孕育现代文明、而后被彻底透支的星球：
   灰黑色的地表、覆满灰土与碎石、工业废墟、被砍伐的森林、死火山、
   废弃都市、死水湖泊、山体，以及一条贯穿星球的穿梭隧道（《地球大炮》式）。
   ========================================================================== */

// ---------- 色板：灰 / 黑 / 锈 / 尘 ----------
const C={
  dust:0x63605a,dustDark:0x403e3a,dustPale:0x8b8880,
  stone:0x565659,stoneDark:0x35353a,
  soot:0x1b1d1f,ash:0x2b2a28,
  rust:0x6d3b21,rustDark:0x402d1c,
  steel:0x55585c,steelDark:0x2e3134,
  concrete:0x6b6963,concreteDark:0x474642,
  water:0x0e1618,panel:0x27303c,
  ember:0x8e2b12,warm:0xffc07a,cold:0xa8dcff
};

// ======================= 1. 场景 / 相机 / 光照 =======================
const planetRadius=20,worldScale=3,surfacePropScale=.75;
const scene=new THREE.Scene(),world=new THREE.Group();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,900);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.72;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);scene.add(world);world.scale.setScalar(worldScale);
// 轨道层单独成组：每帧同步 world 的旋转，这样拖动星球时月球 / 空间站 / 沙尘 / 碎片都会跟着一起转
const space=new THREE.Group();scene.add(space);
scene.background=new THREE.Color(0x06070a);
scene.fog=new THREE.FogExp2(0x181410,.00125);
const hemi=new THREE.HemisphereLight(0x8d9296,0x151312,.33);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xcfc6b6,1.02);
sun.position.set(74,88,60);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
// 太阳的方位：在星系尺度上把它当成"固定方向"（远处的点光源 ≈ 平行光）。
// 昼夜不靠太阳绕圈，而是靠死星自转 —— 地表自己转进光里、再转出去（见 14c）。
const SUN_POS=new THREE.Vector3(74,88,60);
const sunCam=sun.shadow.camera;sunCam.left=-72;sunCam.right=72;sunCam.top=72;sunCam.bottom=-72;sunCam.near=1;sunCam.far=300;
sun.shadow.bias=-.0005;sun.shadow.normalBias=.05;scene.add(sun);
const fill=new THREE.DirectionalLight(0x45536a,.18);fill.position.set(-62,14,-54);scene.add(fill);
const rim=new THREE.DirectionalLight(0x6b6f74,.12);rim.position.set(-20,54,-84);scene.add(rim);
// three.js r149 默认不做色彩管理，十六进制会被当作线性值 → 实际观感比色值亮得多，统一压暗
const TONE=.7;
const material=(color,extra={})=>{
  const m=new THREE.MeshStandardMaterial({color,roughness:.92,metalness:0,flatShading:true,...extra});
  m.color.setHex(extra.color!==undefined?extra.color:color).multiplyScalar(TONE);
  return m;
};
const basic=(color,extra={})=>new THREE.MeshBasicMaterial({color,...extra});

// ======================= 2. 随机数 / 地理模型 =======================
let seed=90211;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const D2R=THREE.MathUtils.degToRad,R2D=THREE.MathUtils.radToDeg;
function wrappedLonDelta(a,b){let d=a-b;while(d>180)d-=360;while(d<-180)d+=360;return d}
function clamp01(v){return v<0?0:v>1?1:v}

// 八块大陆，每块被指定为一种"废墟地貌"
const landRegions=[
  {lat:18,lon:80,a:33.6,b:63,biome:'city'},           // 中部主陆：废弃都市 + 穿梭隧道井口
  {lat:7,lon:38,a:18,b:27,biome:'deadforest'},        // 南陆：被砍伐的森林
  {lat:-16,lon:116,a:29.4,b:46.2,biome:'ash'},        // 湖畔荒原
  {lat:44,lon:143,a:25.2,b:37.8,biome:'mountain'},    // 北方山脉
  {lat:-28,lon:-58,a:31.9,b:54.6,biome:'industrial'}, // 工业大陆（隧道出口）
  {lat:5,lon:-150,a:26.9,b:46.2,biome:'volcano'},     // 死火山与灰土荒漠
  {lat:58,lon:-8,a:16.8,b:29.4,biome:'deadforest'},   // 北方枯林
  {lat:-55,lon:35,a:21,b:35.3,biome:'mountain'}       // 南境山系
];
function landScore(lat,lon){
  let score=-9;
  for(const r of landRegions){const x=wrappedLonDelta(lon,r.lon)/r.b,y=(lat-r.lat)/r.a;score=Math.max(score,1-x*x-y*y)}
  const lonRad=D2R(lon),latRad=D2R(lat);
  const coastNoise=.11*Math.sin(lonRad*3+latRad*2)+.07*Math.sin(lonRad*7-latRad*3)+.04*Math.cos(lonRad*11+latRad*4);
  return score+coastNoise;
}
function isLand(lat,lon,margin=.08){return landScore(lat,lon)>margin}
function biomeAt(lat,lon){
  let best=landRegions[0],bestScore=-99;
  for(const r of landRegions){const x=wrappedLonDelta(lon,r.lon)/r.b,y=(lat-r.lat)/r.a,score=1-x*x-y*y;if(score>bestScore){bestScore=score;best=r}}
  return best.biome;
}
function latLonToDir(lat,lon){
  const p=D2R(90-lat),t=D2R(lon);
  return new THREE.Vector3(Math.sin(p)*Math.cos(t),Math.cos(p),Math.sin(p)*Math.sin(t));
}
// ---- 切向方位工具：让路、管道、沙丘脊、倒木能按"地理方位角"对齐 ----
// place()/surfaceItems() 用 setFromUnitVectors 对齐法线，其局部 X 轴指向与经纬度无关，
// 所以要用数值反解出"想把局部 X 轴转到某个切向方向"所需的 yaw。
function tangentNorth(lat,lon){
  return latLonToDir(Math.min(89.9,lat+1),lon).sub(latLonToDir(lat,lon)).normalize();
}
function tangentEast(lat,lon){
  return latLonToDir(lat,lon+1).sub(latLonToDir(lat,lon)).normalize();
}
function faceYaw(lat,lon,wantDir){
  const n=latLonToDir(lat,lon).normalize();
  const q=new THREE.Quaternion().setFromUnitVectors(_UP, n);
  const bx=new THREE.Vector3(1,0,0).applyQuaternion(q),bz=new THREE.Vector3(0,0,1).applyQuaternion(q);
  return Math.atan2(-wantDir.dot(bz),wantDir.dot(bx));
}
function geoYaw(lat,lon,angleDeg){        // 0° = 朝北，90° = 朝东
  const a=D2R(angleDeg);
  return faceYaw(lat,lon,tangentNorth(lat,lon).multiplyScalar(Math.cos(a)).addScaledVector(tangentEast(lat,lon),Math.sin(a)));
}
function stepGeo(lat,lon,angleDeg,distLocal){   // 沿地理方位角走 distLocal（局部单位），返回新的 [lat,lon]
  const d=R2D(distLocal/planetRadius),a=D2R(angleDeg);
  return [lat+Math.cos(a)*d,lon+Math.sin(a)*d/Math.max(.2,Math.cos(D2R(lat)))];
}
// 贯穿星球的穿梭隧道：两个对跖井口
const HOLE_R=2.7;
const CANNON={lat:18,lon:80};
const HOLES=[
  {lat:CANNON.lat,lon:CANNON.lon,dir:latLonToDir(CANNON.lat,CANNON.lon)},
  {lat:-CANNON.lat,lon:CANNON.lon+180,dir:latLonToDir(-CANNON.lat,CANNON.lon+180)}
];
function angDistDeg(a1,o1,a2,o2){
  const p1=D2R(a1),p2=D2R(a2),dl=D2R(wrappedLonDelta(o1,o2));
  const c=Math.sin(p1)*Math.sin(p2)+Math.cos(p1)*Math.cos(p2)*Math.cos(dl);
  return R2D(Math.acos(Math.max(-1,Math.min(1,c))));
}
function holeDistance(lat,lon){
  let m=1e9;
  for(const h of HOLES)m=Math.min(m,D2R(angDistDeg(lat,lon,h.lat,h.lon))*planetRadius);
  return m;
}
// 火山是"地貌"不是"道具"：把锥体本身并进地形高度。
// 否则那 55° 的外坡在碰撞栅格里就是一圈 1.9 高的墙，人走到山脚就被挡住，
// 永远上不去 —— 而"站在火山口里被岩浆冲走"正是要能走上去才成立的。
// 山体上的装饰（熔岩沟壑 / 寄生火山口）由 field 的排除区负责不当碰撞（见 14b）。
const VOLC_T=[];
function volcanoLift(lat,lon){
  let add=0;
  for(let i=0;i<VOLC_T.length;i++){
    const v=VOLC_T[i];
    const dr=D2R(angDistDeg(lat,lon,v.lat,v.lon))*planetRadius;
    if(dr>=v.baseR)continue;
    // 外坡：从 craterR 处的"口沿高度"线性落到 baseR 处的 0；口内是火山口底
    const lift=(dr<=v.craterR)?v.floorY:(v.h*clamp01((v.baseR-dr)/(v.baseR-v.craterR)));
    if(lift>add)add=lift;
  }
  return add;
}
function terrainHeight(lat,lon){
  const a=D2R(lon),b=D2R(lat);
  const detail=.5*Math.sin(a*9+b*5)+.28*Math.cos(a*15-b*8)+.18*Math.sin(a*23+b*13);
  const dunes=.16*Math.sin(a*34+b*21)+.11*Math.sin(a*57-b*39)+.07*Math.cos(a*88+b*63);
  const score=landScore(lat,lon);
  const biome=biomeAt(lat,lon);
  const lift=biome==='mountain'?.23:biome==='volcano'?.2:biome==='industrial'?.09:biome==='city'?.07:biome==='deadforest'?.08:.065;
  const landH=lift+.09*detail*Math.min(1,Math.max(0,score)*4)+.075*dunes;
  const seaH=.018*detail+.026*dunes;           // 海底：几乎死平的淤泥面
  const t=clamp01((score+.025)/.115);          // 平滑的海岸过渡带，避免出现"台阶状"海岸线
  let h=seaH*(1-t)+landH*t;
  const d=holeDistance(lat,lon);
  if(d<5.4)h+=.1*(1-d/5.4);                    // 井口外沿掘出的堆积环
  h+=volcanoLift(lat,lon);                     // 火山锥体（地貌，可走上去）
  return Math.max(.006,h);
}
// 预置颜色常量，避免逐顶点反复 new Color（星球有近两万面）
const PALETTE_COL={ash:new THREE.Color(0x4c4c49),deadforest:new THREE.Color(0x34352f),mountain:new THREE.Color(0x5b5f61),industrial:new THREE.Color(0x43413f),city:new THREE.Color(0x4a4a4c),volcano:new THREE.Color(0x2a2725)};
const C_SHALLOW=new THREE.Color(0x131c1e),C_DEEP=new THREE.Color(0x030507);
const C_DUSTLINE=new THREE.Color(0x6f6a5e),C_ASH=new THREE.Color(0x14161a),C_DIM=new THREE.Color(0x1b1e20),C_HOLE=new THREE.Color(0x7d7669);
const _colA=new THREE.Color(),_colB=new THREE.Color(),_colC=new THREE.Color();
function terrainColor(lat,lon){
  const score=landScore(lat,lon),a=D2R(lon),b=D2R(lat);
  const variation=.9+.06*Math.sin(a*13+b*7)+.04*Math.cos(a*21-b*11);
  // 海底：几近死水
  const sea=_colB.copy(C_SHALLOW).lerp(C_DEEP,Math.min(1,Math.max(0,-score)*1.2)).multiplyScalar(.9+.1*Math.sin(b*9));
  if(score<-.05)return sea.multiplyScalar(variation*TONE);
  // 陆地：灰黑渐变 + 焦土斑 + 灰土带
  const base=_colA.copy(PALETTE_COL[biomeAt(lat,lon)]);
  if(score<.09)base.lerp(C_DUSTLINE,clamp01(1-score/.09));            // 岸边灰土带
  base.lerp(C_DUSTLINE,.22*(1-Math.abs(lat)/90));                     // 赤道灰土带 → 极地更黑
  const ashN=.5+.5*Math.sin(a*7.3+b*4.1)*Math.cos(a*3.1-b*6.7);
  base.lerp(C_ASH,.34*ashN);                                          // 黑色焦土斑
  base.lerp(C_DIM,.12);                                                // 整体压暗去色
  base.lerp(C_DUSTLINE,clamp01((terrainHeight(lat,lon)-.05)/.24)*.26); // 高处覆浅灰土
  const d=holeDistance(lat,lon);
  if(d<7.2)base.lerp(C_HOLE,clamp01(1-d/7.2)*.72);                    // 井口掘出的浅灰土
  // 海岸线：海陆颜色在网格尺度上平滑过渡，避免出现锯齿状硬边
  const t=clamp01((score+.05)/.1);
  return _colC.copy(sea).lerp(base,t).multiplyScalar(variation*TONE);
}

// ======================= 3. 星球本体 + 被污染的大气 =======================
// 真的在星球网格上挖出两个洞口（任一顶点落在洞内的三角形都剔除）
function cutHoles(geo,colors){
  const pos=geo.attributes.position.array;
  const n=pos.length/3,inHole=new Uint8Array(n);
  for(let i=0;i<n;i++){
    const x=pos[i*3],y=pos[i*3+1],z=pos[i*3+2],len=Math.hypot(x,y,z);
    const nx=x/len,ny=y/len,nz=z/len;
    for(const h of HOLES){
      const dot=Math.max(-1,Math.min(1,nx*h.dir.x+ny*h.dir.y+nz*h.dir.z));
      if(dot>.9999999||Math.acos(dot)*planetRadius<HOLE_R){inHole[i]=1;break}
    }
  }
  const keep=[],keepCol=[];
  for(let t=0;t<n;t+=3){
    if(inHole[t]||inHole[t+1]||inHole[t+2])continue;   // 任一顶点落在洞口内就剔除，得到干净的圆形井口
    for(let k=0;k<3;k++){
      const v=t+k;
      keep.push(pos[v*3],pos[v*3+1],pos[v*3+2]);
      keepCol.push(colors[v*3],colors[v*3+1],colors[v*3+2]);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(keep,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(keepCol,3));
  g.computeVertexNormals();
  return g;
}
const SMOG_VERT='varying vec3 vN;varying vec3 vP;varying vec3 vW;'+
'void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vP=mv.xyz;vW=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*mv;}';
const SMOG_FRAG='varying vec3 vN;varying vec3 vP;varying vec3 vW;uniform float uS;'+
'float hash(vec3 v){return fract(sin(dot(v,vec3(12.9898,78.233,45.164)))*43758.5453123);}'+
'float noise(vec3 v){vec3 i=floor(v),f=fract(v);f=f*f*(3.-2.*f);'+
' return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),'+
'            mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}'+
'void main(){vec3 d=normalize(vW);'+
' float dens=noise(d*3.)*.62+noise(d*9.)*.28+noise(d*27.)*.16;'+
' float rim=pow(clamp(.82-dot(normalize(vP),vN),0.,1.),3.1);'+
' vec3 col=mix(vec3(.15,.125,.105),vec3(.47,.37,.26),dens);'+

function makeSmog(scale,strength){
  return new THREE.Mesh(new THREE.SphereGeometry(planetRadius*scale,72,44),new THREE.ShaderMaterial({
    uniforms:{uS:{value:strength}},transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:SMOG_VERT,fragmentShader:SMOG_FRAG}));
}
function createPlanet(){
  const src=new THREE.IcosahedronGeometry(planetRadius,36);
  const position=src.attributes.position,colors=[];
  for(let i=0;i<position.count;i++){
    const n=new THREE.Vector3(position.getX(i),position.getY(i),position.getZ(i)).normalize();
    const lat=R2D(Math.asin(n.y)),lon=R2D(Math.atan2(n.z,n.x));
    const radius=planetRadius+terrainHeight(lat,lon),c=terrainColor(lat,lon);
    position.setXYZ(i,n.x*radius,n.y*radius,n.z*radius);
    colors.push(c.r,c.g,c.b);
  }
  const globe=new THREE.Mesh(cutHoles(src,colors),new THREE.MeshStandardMaterial({vertexColors:true,roughness:.96,metalness:0,flatShading:true}));
  globe.receiveShadow=true;world.add(globe);
  world.add(makeSmog(1.03,.8));     // 贴地雾霾
  world.add(makeSmog(1.11,.3));     // 更外层的沙尘罩
}

// ======================= 4. 球面放置 / 实例化工具 =======================
function point(lat,lon,height=0){
  return latLonToDir(lat,lon).multiplyScalar(planetRadius+terrainHeight(lat,lon)+height);
}
function place(object,lat,lon,height=.06,parent=world){
  const p=point(lat,lon,height);
  object.position.copy(p);
  object.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),p.clone().normalize());
  if(parent===world)object.scale.multiplyScalar(surfacePropScale);
  parent.add(object);return object;
}
const _UP=new THREE.Vector3(0,1,0);
function scatter(cLat,cLon,latSpread,lonSpread,count,fn){
  let placed=0,attempts=0;
  while(placed<count&&attempts<count*30){
    attempts++;
    const a=random()*Math.PI*2,r=Math.sqrt(random());
    const lat=cLat+Math.sin(a)*latSpread*r,lon=cLon+Math.cos(a)*lonSpread*r;
    if(!isLand(lat,lon,.1)||holeDistance(lat,lon)<HOLE_R*1.9)continue;
    fn(lat,lon,placed);placed++;
  }
}
function scatterGlobal(count,fn){
  let placed=0,attempts=0;
  while(placed<count&&attempts<count*40){
    attempts++;
    const lat=R2D(Math.asin(random()*2-1)),lon=random()*360-180;
    if(!isLand(lat,lon,.02)||holeDistance(lat,lon)<HOLE_R*1.9)continue;
    fn(lat,lon,placed);placed++;
  }
}
function randomDirInLand(cLat,cLon,latS,lonS){
  for(let i=0;i<80;i++){
    const lat=cLat+(random()*2-1)*latS,lon=cLon+(random()*2-1)*lonS;
    if(isLand(lat,lon,.12)&&holeDistance(lat,lon)>HOLE_R*1.9)return [lat,lon];
  }
  return null;
}
function surfaceItems(list,height=.02){
  return list.map(it=>{
    const p=point(it.lat,it.lon,it.height!==undefined?it.height:height);
    const q=new THREE.Quaternion().setFromUnitVectors(_UP,p.clone().normalize());
    if(it.yaw||it.tiltX)q.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(it.tiltX||0,it.yaw||0,0)));
    const s=(it.scale||1)*surfacePropScale;
    return {p,q,s,sx:it.sx,sy:it.sy,sz:it.sz};
  });
}
function instanceMesh(geo,mat,items,parent,opt={}){
  if(!items||!items.length)return null;
  const mesh=new THREE.InstancedMesh(geo,mat,items.length);
  const m=new THREE.Matrix4(),s=new THREE.Vector3();
  items.forEach((it,i)=>{
    const b=it.s||1;
    s.set(it.sx!==undefined?it.sx:b,it.sy!==undefined?it.sy:b,it.sz!==undefined?it.sz:b);
    m.compose(it.p,it.q,s);mesh.setMatrixAt(i,m);
  });
  mesh.instanceMatrix.needsUpdate=true;
  mesh.castShadow=!!opt.castShadow;mesh.receiveShadow=!!opt.receiveShadow;
  parent.add(mesh);return mesh;
}

// ======================= 6. 被砍伐的森林 =======================
// 真实的采伐迹地：树桩保持着原本林木的株距（互不重叠、不穿模），中间让出一条
// 集材道；倒木、枝桠、木料只出现在集材道上和集材场，而不是满山随机乱丢。
const STUMP_GEO=new THREE.CylinderGeometry(.34,.55,.36,7).translate(0,.18,0);   // 带伐根外扩的树桩
const FLARE_GEO=new THREE.CylinderGeometry(.52,.74,.11,7).translate(0,.045,0);  // 地表鼓起的根部
const CUT_GEO=new THREE.CircleGeometry(.33,7).rotateX(-Math.PI/2);              // 新鲜的锯口
const ROOT_GEO=new THREE.ConeGeometry(.5,1,5).rotateZ(-Math.PI/2).translate(.45,0,0);
const LOG_GEO=new THREE.CylinderGeometry(.5,.5,1,7).rotateZ(Math.PI/2);
function logAt(mat,x,y,g,len,r){const m=new THREE.Mesh(LOG_GEO,mat);m.scale.set(len,r*2,r*2);m.position.set(x,y,0);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}

function distToPath(lat,lon,path){
  let best=1e9;const k=Math.cos(D2R(lat));
  for(let i=0;i<path.length-1;i++){
    const a=path[i],b=path[i+1];
    const ax=(a[1]-lon)*k,ay=a[0]-lat,bx=(b[1]-lon)*k,by=b[0]-lat;
    const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;
    let t=L>1e-9?-(ax*dx+ay*dy)/L:0;t=t<0?0:t>1?1:t;
    best=Math.min(best,Math.hypot(ax+dx*t,ay+dy*t));
  }
  return best;
}
// 按"抖动网格"布点：保住株距（树桩之间留得出空隙），同时允许按条件跳过格子
function gridField(cLat,cLon,latS,lonS,stepDeg,skip,fn){
  const dLon=stepDeg/Math.max(.3,Math.cos(D2R(cLat)));
  const rows=Math.max(2,Math.round(latS*2/stepDeg)),cols=Math.max(2,Math.round(lonS*2/dLon));
  const dLat=latS*2/rows,dLonn=lonS*2/cols;
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
    const lat=cLat-latS+(i+.5+(random()-.5)*.38)*dLat;
    const lon=cLon-lonS+(j+.5+(random()-.5)*.38)*dLonn;
    if(!isLand(lat,lon,.12)||holeDistance(lat,lon)<HOLE_R*1.9)continue;
    if(skip&&skip(lat,lon,i,j))continue;
    fn(lat,lon,i,j);
  }
}
// 从一角蜿蜒到另一角的集材道
function makeTrail(cLat,cLon,latS,lonS,n){
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    pts.push([cLat-latS*.94+2*latS*.94*t+(random()-.5)*latS*.3,
              cLon-lonS*.94+2*lonS*.94*t+(random()-.5)*lonS*.26]);
  }
  return pts;
}
function createDeforestedForest(cLat,cLon,latS,lonS,opt={}){
  const woodMat=material(0x3a3227,{flatShading:true,roughness:.98});
  const sapMat=material(0x6a5738,{flatShading:false,roughness:.88});
  const rootMat=material(0x2c261e,{roughness:1,flatShading:true});
  const trail=makeTrail(cLat,cLon,latS,lonS,10);
  const onTrail=(lat,lon)=>distToPath(lat,lon,trail)<1.35+.3*random();
  const stepDeg=opt.step||2.2;

  // 集材道：压实的灰土路面 + 两道车辙
  surfaceRibbon(trail,.95,material(C.dustDark,{roughness:1,side:THREE.DoubleSide}),.045);
  for(const s of[-1,1]){
    const r=trail.map(p=>[p[0]+s*.05,p[1]+s*.06]);
    surfaceRibbon(r,.17,material(0x2a251d,{roughness:1,side:THREE.DoubleSide}),.05);
  }

  // 树桩：株距网格 + 高低不一的锯口 + 外露的伐根
  // （所有实例缩放都用"局部单位"绝对量，几何基准见上面的 *_GEO 常量）
  const EPS=.005;
  const stumps=[],flares=[],cuts=[],roots=[];
  gridField(cLat,cLon,latS,lonS,stepDeg,(lat,lon)=>onTrail(lat,lon)||random()<.08,(lat,lon)=>{
    const la=lat+(random()-.5)*.06,lo=lon+(random()-.5)*.06;
    const R=.19+random()*.09;                 // 树桩半径（局部单位）
    const H=.10+random()*.32;                 // 留下的高度，高的矮的混杂
    const kx=.92+random()*.16,kz=.92+random()*.16,yaw=random()*6.283;
    stumps.push({lat:la,lon:lo,height:-.02,sx:R/.55*kx,sy:H/.36,sz:R/.55*kz,yaw,tiltX:(random()-.5)*.1});
    flares.push({lat:la,lon:lo,height:-.025,sx:R/.74*1.22*kx,sy:.28+random()*.3,sz:R/.74*1.22*kz,yaw});
    if(random()<.62)cuts.push({lat:la,lon:lo,height:H+EPS,sx:R/.33*kx,sy:H/.36,sz:R/.33*kz,yaw});
    for(let k=0;k<3;k++){                     // 伐根：被伐倒时扯出来的侧根
      if(random()>.6)continue;
      const a=random()*360,d=R*.9+random()*.3,pl=stepGeo(la,lo,a,d),rl=R*(1.6+random()*.9);
      roots.push({lat:pl[0],lon:pl[1],height:-.02,sx:rl,sy:R*.6,sz:R*.6,
        yaw:geoYaw(pl[0],pl[1],a+(random()-.5)*40),tiltX:-.45+random()*.25});
    }
  });
  instanceMesh(FLARE_GEO,rootMat,surfaceItems(flares),world,{receiveShadow:true,castShadow:true});
  instanceMesh(STUMP_GEO,woodMat,surfaceItems(stumps),world,{castShadow:true,receiveShadow:true});
  instanceMesh(ROOT_GEO,rootMat,surfaceItems(roots),world,{castShadow:true});
  instanceMesh(CUT_GEO,sapMat,surfaceItems(cuts),world,{receiveShadow:true});

  // 倒木：大体朝一个方向倒下，根盘那一端翘起
  const fallen=[],plates=[],wind=random()*360;
  gridField(cLat,cLon,latS,lonS,stepDeg*3.2,(lat,lon)=>onTrail(lat,lon)||random()<.7,(lat,lon)=>{
    const len=.9+random()*.9,rad=.06+random()*.045,a=wind+(random()-.5)*46;
    fallen.push({lat,lon,height:rad,sx:len,sy:rad/.5,sz:rad/.5,yaw:geoYaw(lat,lon,a),tiltX:(random()-.5)*.12});
    const end=stepGeo(lat,lon,a+180,len*.45);
    plates.push({lat:end[0],lon:end[1],height:.02,sx:.45+random()*.3,sy:rad*1.5,sz:rad*1.5,
      yaw:geoYaw(end[0],end[1],a),tiltX:1.1+random()*.3});
  });
  instanceMesh(LOG_GEO,woodMat,surfaceItems(fallen),world,{castShadow:true,receiveShadow:true});
  instanceMesh(ROOT_GEO,rootMat,surfaceItems(plates),world,{castShadow:true});

  // 枝桠堆：清林时堆在迹地上的废枝
  const slash=[];
  gridField(cLat,cLon,latS,lonS,stepDeg*2.4,(lat,lon)=>random()<.74,(lat,lon)=>{
    const n=4+Math.floor(random()*7);
    for(let k=0;k<n;k++)slash.push({lat:lat+(random()-.5)*.5,lon:lon+(random()-.5)*.5,
      height:.02,sx:.22+random()*.4,sy:.03+random()*.03,sz:.03+random()*.03,yaw:random()*6.283});
  });
  instanceMesh(LOG_GEO,rootMat,surfaceItems(slash),world,{receiveShadow:true});

  // 集材场：木料码成垛（底层并排、上层压在缝里）
  [.38,.84].forEach(t=>{
    const p=trail[Math.min(trail.length-1,Math.round(t*trail.length))];
    for(let k=0;k<4;k++){
      const lat=p[0]+(random()-.5)*2.4,lon=p[1]+(random()-.5)*3.2;
      if(!isLand(lat,lon,.1)||holeDistance(lat,lon)<HOLE_R*1.5)continue;
      const g=new THREE.Group();
      const n=3+Math.floor(random()*4),rows=1+Math.floor(random()*3),r=.11+random()*.05;
      for(let row=0;row<rows;row++){
        const cnt=Math.max(1,n-row);
        for(let i=0;i<cnt;i++)logAt(woodMat,(i-(cnt-1)/2)*r*2.2,row*r*1.85+r*.9,g,.85+random()*.9,r);
      }
      for(const s of[-1,1])box(material(0x2a241c),.06,r*2*(rows+.6),.06,s*(n*r*1.15),r*2*(rows+.6)/2,.34,g);
      place(g,lat,lon,.03);g.rotateY(random()*6.283);
    }
  });
  // 一台被撂下的伐木机车
  {
    const p=trail[Math.round(trail.length*.6)];
    const g=new THREE.Group();
    box(material(C.rust),1.5,.5,.9,0,.42,0,g);
    box(material(C.rustDark),.8,.5,.86,-.35,.92,0,g);
    box(material(C.soot),.16,.34,.16,.62,.2,.36,g);
    box(material(C.soot),.16,.34,.16,.62,.2,-.36,g);
    const arm=box(material(C.steelDark,{metalness:.5,roughness:.6,flatShading:false}),.14,1.6,.14,-.85,1.1,0,g);arm.rotation.z=.5;
    place(g,p[0]+(random()-.5)*1.4,p[1]+(random()-.5)*1.8,.03);g.rotateY(random()*6.283);
  }
}

function industrialRuin(lat,lon,yaw,size=1){
  const g=new THREE.Group();
  const conc=material(C.concreteDark,{flatShading:false,roughness:.98});
  const dark=material(C.soot,{roughness:.95});
  const steel=material(C.steel,{metalness:.65,roughness:.5,flatShading:false});
  const rust=material(C.rust,{roughness:.85,metalness:.3});
  box(conc,2.7,1.15,1.8,0,0,0,g);                                    // 塌了一半的厂房
  const roof=box(dark,2.5,.1,1.1,-.1,1.15,.34,g);roof.rotation.z=.05;
  for(let i=0;i<5;i++)box(conc,.42,.55,.42,-1.2+i*.62,.02,.86,g);   // 断裂的柱列
  [[-1.15,-.35,.34,2.6],[.95,-.55,.3,3.4],[1.35,.45,.26,2.0]].forEach(v=>{   // 烟囱
    cyl(rust,v[2],v[3],v[0],v[3]/2,v[1],g);
    cyl(dark,v[2]*1.16,.14,v[0],v[3]+.06,v[1],g);
  });
  [-1,1].forEach((s,i)=>{                                            // 储罐
    const t=cyl(steel,.52,1.5,s*1.9,.75,-1.0-i*.2,g);t.rotation.z=s*.02;
    const cap=new THREE.Mesh(G.dome,steel);cap.scale.setScalar(1.06);cap.position.set(s*1.9,1.5,-1.0-i*.2);g.add(cap);
  });
  for(let i=0;i<6;i++){                                              // 钢架残骸
    const b=box(steel,.07,1.9,.07,-2.4+i*.5,.95,-2.0+(i%2)*.3,g);b.rotation.z=(random()-.5)*.5;
    const h=box(steel,.9,.07,.07,-2.4+i*.5,1.7,-2.0+(i%2)*.3,g);h.rotation.z=(random()-.5)*.2;
  }
  for(let i=0;i<7;i++){                                              // 塌陷的烟道
    const seg=cyl(rust,.16,.5,-2.2+i*.42,.72+Math.sin(i*.8)*.22,-1.4+Math.cos(i*.6)*.3,g);
    seg.rotation.z=Math.PI/2-.2+Math.sin(i)*.2;
  }
  for(let i=0;i<5;i++)cyl(steel,.05,.9-(i%2)*.3,2.3,0,.9-i*.4,g);     // 传送带支架
  place(g,lat,lon,.05);g.rotateY(yaw);g.scale.multiplyScalar(size);
  return g;
}

// 贴合球面的带状面（道路 / 灰烬带）
function surfaceRibbon(pts,width,mat,height=.15){
  const samples=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],steps=10;
    for(let j=0;j<steps;j++){const t=j/steps;samples.push(point(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,height))}
  }
  const last=pts[pts.length-1];samples.push(point(last[0],last[1],height));
  const vertices=[],indices=[];
  for(let i=0;i<samples.length;i++){
    const c=samples[i],prev=samples[Math.max(0,i-1)],next=samples[Math.min(samples.length-1,i+1)];
    const tangent=next.clone().sub(prev).normalize(),normal=c.clone().normalize();
    const side=new THREE.Vector3().crossVectors(normal,tangent).normalize().multiplyScalar(width/2);
    vertices.push(c.x+side.x,c.y+side.y,c.z+side.z,c.x-side.x,c.y-side.y,c.z-side.z);
    if(i<samples.length-1){const n=i*2;indices.push(n,n+1,n+2,n+1,n+3,n+2)}
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
  geo.setIndex(indices);geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,mat);mesh.receiveShadow=true;world.add(mesh);return mesh;
}

// 低空翻涌的沙尘暴团（大气污染的可视化）
const smogBanks=[];
function smogBank(lat,lon,s){
  const g=new THREE.Group();

  [[0,0,.5],[.6,.06,.4],[-.52,.03,.36],[.12,.24,.34],[-.24,-.06,.3],[.34,-.1,.28]].forEach(a=>{
    const q=new THREE.Mesh(new THREE.SphereGeometry(a[2]*s,10,7),m);
    q.position.set(a[0]*s,a[1]*s,0);g.add(q);
  });
  place(g,lat,lon,1.5);
  g.scale.setScalar(2.2);
  g.rotateY(random()*6.28);
  smogBanks.push(g);return g;
}

const windowItems=[];
const WINDOW_MAT=()=>material(0x14161a,{emissive:C.warm,emissiveIntensity:1.15,flatShading:false,side:THREE.DoubleSide});
function ruinedCity(cLat,cLon,latS,lonS,count,tall){
  const bodies=[material(0x555356,{roughness:.98}),material(0x3c3b3a,{roughness:.98}),material(0x47454a,{roughness:.98})];
  const slabMat=material(C.concreteDark,{roughness:.98});

const plumes=[];
const volcanoes=[];               // 供 14c 的「火山喷发」用：登记每座火山的位置与尺寸
function deadVolcano(lat,lon,size,withPlume){
  const g=new THREE.Group();
  const craterR=.55*size,baseR=1.5*size,h=1.35*size;
  const coneGeo=new THREE.CylinderGeometry(craterR,baseR,h,34,5,true);
  const pos=coneGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
    const r=Math.hypot(x,z),a=Math.atan2(z,x),t=(y+h/2)/h;
    const rough=.085*size*(1-t*.5)*(Math.sin(a*7+y*5)+.6*Math.sin(a*13-y*7)+.4*Math.cos(a*19+y*11));
    const nr=r+rough;
    pos.setXYZ(i,Math.cos(a)*nr,y+rough*.4,Math.sin(a)*nr);
  }
  coneGeo.computeVertexNormals();
  const flank=new THREE.Mesh(coneGeo,material(0x2f2c29,{side:THREE.DoubleSide,roughness:1}));
  flank.position.y=h/2;flank.castShadow=true;flank.receiveShadow=true;g.add(flank);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(craterR*1.02,28),material(0x1a1512,{side:THREE.DoubleSide}));
  floor.rotation.x=-Math.PI/2;floor.position.y=h*.92;g.add(floor);
  const ember=new THREE.Mesh(new THREE.CircleGeometry(craterR*.55,24),material(0x000000,{emissive:C.ember,emissiveIntensity:.6,transparent:true,opacity:.75}));
  ember.rotation.x=-Math.PI/2;ember.position.y=h*.925;g.add(ember);
  const crackMat=material(0x14110f);
  for(let i=0;i<9;i++){                       // 熔岩沟壑
    const a=i/9*Math.PI*2+.3;
    for(let k=0;k<4;k++){
      const t=k/4,rr=craterR+(baseR-craterR)*t;
      const seg=box(crackMat,.05*size,.05*size,baseR*.3*size,Math.cos(a)*rr,h*(1-t*.72),Math.sin(a)*rr,g);
      seg.rotation.y=-a;seg.rotation.z=.3;
    }
  }
  for(let i=0;i<5;i++){                       // 寄生火山口
    const a=random()*Math.PI*2,rr=baseR*(.75+random()*.5),s=.28+random()*.26;
    cyl(material(0x34302c),s*.5,s*1.6,Math.cos(a)*rr,s*.8,Math.sin(a)*rr,g,G.cone7);
    cyl(material(0x1b1815),s*.2,s*.5,Math.cos(a)*rr,s*1.5,Math.sin(a)*rr,g);
  }
  place(g,lat,lon,.02);
  // 登记给 14c 的火山喷发用。注意 place() 会把整组乘上 surfacePropScale，
  // 所以两套尺寸都要留着：*Raw 是组内局部单位（建粒子用），不带的才是世界局部单位（算距离用）。
  const rec={group:g,lat,lon,size,e:0,plume:null,
    baseR:baseR*surfacePropScale,craterR:craterR*surfacePropScale,h:h*surfacePropScale,
    rawBaseR:baseR,rawCraterR:craterR,rawH:h,
    floorY:h*.92*surfacePropScale};
  volcanoes.push(rec);
  VOLC_T.push({lat,lon,baseR:rec.baseR,craterR:rec.craterR,h:rec.h,floorY:rec.floorY});
  if(withPlume){                              // 残存的灰烬柱
    const pts=[];
    for(let i=0;i<240;i++){
      const t=random(),a=random()*Math.PI*2,r=(craterR*.35+random()*craterR*.7)*(1+t*.6);
      pts.push(Math.cos(a)*r,t*h*2.4+random()*.4,Math.sin(a)*r);
    }
    const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
    const plume=new THREE.Points(pg,new THREE.PointsMaterial({color:0x8e8578,size:.62*size,transparent:true,opacity:.32,sizeAttenuation:true,depthWrite:false}));
    plume.position.y=h*.95;g.add(plume);
    const prec={points:plume,span:h*2.4,erupt:0};
    plumes.push(prec);rec.plume=prec;
  }
  return g;
}

// 贴合球面的圆盘（湖泊 / 平台 / 撞击坑 / 矿坑）
// opt.profile(t,angle) 返回相对地表的高度偏移（t = 0 圆心 → 1 边缘），用来做碗状、阶梯状等轮廓
function curvedSurfaceDisc(lat,lon,radius,height,mat,opt={}){
  const rings=opt.rings||10,segments=opt.segments||64,center=point(lat,lon,0).normalize();
  const profile=opt.profile||null;
  const edgeFn=opt.flat?(()=>1):(a=>1+.075*Math.sin(a*3+.4)+.045*Math.cos(a*5-.7));
  const reference=Math.abs(center.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
  const axisX=new THREE.Vector3().crossVectors(reference,center).normalize();
  const axisZ=new THREE.Vector3().crossVectors(center,axisX).normalize();
  function addVertex(dir,t,angle){
    const d=dir.normalize();
    const sLat=R2D(Math.asin(d.y)),sLon=R2D(Math.atan2(d.z,d.x));
    const R=planetRadius+terrainHeight(sLat,sLon)+height+(profile?profile(t,angle):0);
    addVertex.last=R;
    vertices.push(d.x*R,d.y*R,d.z*R);
  }
  const vertices=[],indices=[];
  addVertex(center.clone(),0,0);
  for(let ring=1;ring<=rings;ring++){
    const ratio=ring/rings;
    for(let s=0;s<segments;s++){
      const angle=s/segments*Math.PI*2;
      const arc=radius*ratio*edgeFn(angle)/planetRadius;
      const tangent=axisX.clone().multiplyScalar(Math.cos(angle)).addScaledVector(axisZ,Math.sin(angle));
      const dir=center.clone().multiplyScalar(Math.cos(arc)).addScaledVector(tangent,Math.sin(arc));
      addVertex(dir,ratio,angle);
    }
  }
  for(let s=0;s<segments;s++){const nn=(s+1)%segments;indices.push(0,1+s,1+nn)}
  for(let ring=2;ring<=rings;ring++){
    const ps=1+(ring-2)*segments,cs=1+(ring-1)*segments;
    for(let s=0;s<segments;s++){
      const nn=(s+1)%segments,a=ps+s,b=ps+nn,c=cs+s,d=cs+nn;
      indices.push(a,c,b,b,c,d);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
  geo.setIndex(indices);geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,mat);mesh.receiveShadow=true;world.add(mesh);return mesh;
}
function deadLake(lat,lon,size){

// ======================= 11. 贯穿星球的穿梭隧道（地球大炮） =======================
const cannonCores=[],cannonGlows=[];
function earthCannon(hole){
  const g=new THREE.Group();
  const conc=material(C.concrete,{roughness:.95,flatShading:false});
  const concDark=material(C.concreteDark,{roughness:.98});
  const steel=material(C.steel,{metalness:.7,roughness:.42,flatShading:false});
  // ---- 井口一圈都留了一个豁口（正对发射导轨那一侧，即局部 +Z）----
  // 有了它探险者才能沿导轨直接走进井里；否则土堤和挡墙会把人拦在外面。
  const DOOR=66,DOOR2=D2R(DOOR);            // 豁口张角
  // 掘出的环状土堤 + 井口平台
  const rim=new THREE.Mesh(new THREE.TorusGeometry(2.35,.36,10,44,Math.PI*2-DOOR2),material(C.dustDark,{roughness:1}));
  // TorusGeometry 的弧从 u=0 起、缺口中心落在 (360-DOOR)/2+180；绕自身轴转一下把缺口对到 +Z
  rim.rotation.set(-Math.PI/2,0,D2R(DOOR/2-90));
  rim.position.y=.05;rim.castShadow=true;rim.receiveShadow=true;g.add(rim);
  const pad=new THREE.Mesh(new THREE.RingGeometry(1.9,2.35,52,1,D2R(270+DOOR/2),D2R(360-DOOR)),conc);
  pad.rotation.x=-Math.PI/2;pad.position.y=.04;pad.receiveShadow=true;g.add(pad);
  // 井口挡墙（开口圆环，不封住井口）
  const collar=new THREE.Mesh(new THREE.CylinderGeometry(1.9,2.05,.42,48,1,true,D2R(DOOR/2),D2R(360-DOOR)),
    material(0xb0aca2,{roughness:.94,flatShading:false,side:THREE.DoubleSide}));
  collar.position.y=.21;collar.castShadow=true;g.add(collar);
  const collarRing=new THREE.Mesh(new THREE.TorusGeometry(1.9,.07,8,48,Math.PI*2-DOOR2),steel);
  collarRing.rotation.set(-Math.PI/2,0,D2R(DOOR/2-90));
  collarRing.position.y=.42;g.add(collarRing);
  // 井筒：向下收束，内壁朝向轴心
  const boreH=7.4;
  const bore=new THREE.Mesh(new THREE.CylinderGeometry(1.92,.26,boreH,44,1,true),
    material(0x08090b,{side:THREE.BackSide,roughness:.92,metalness:.15}));
  bore.position.y=-boreH/2+.24;g.add(bore);
  // 井壁的磁悬浮加速环
  for(let i=0;i<9;i++){
    const t=i/8,r=1.72-1.4*t;
    const m=material(0x6d737a,{metalness:.85,roughness:.34,flatShading:false,emissive:0x2f5d86,emissiveIntensity:.85*(1-t*.45)});
    const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.05,7,32),m);
    ring.rotation.x=-Math.PI/2;ring.position.y=-.55-i*.74;g.add(ring);
    if(i<5)cannonCores.push(m);
  }
  // 井内的环形检修平台：从井口掉下来正好落在这一圈上，可以站着看井底的辉光，
  // 也能从中间那个洞继续往下掉到井底。（尺寸与井筒内壁严丝合缝，见 explorer_module 的 makeShaft）
  const walkMat=material(0x3a3f45,{metalness:.55,roughness:.66,flatShading:false,side:THREE.DoubleSide});
  const walk=new THREE.Mesh(new THREE.RingGeometry(.36,1.249,48,1),walkMat);
  walk.rotation.x=-Math.PI/2;walk.position.y=-2.75;walk.receiveShadow=true;g.add(walk);
  const walkRim=new THREE.Mesh(new THREE.TorusGeometry(.36,.035,6,34),steel);
  walkRim.rotation.x=-Math.PI/2;walkRim.position.y=-2.75;g.add(walkRim);
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2+.4,d=.82;
    box(steel,.05,.62,.05,Math.cos(a)*d,-3.12,Math.sin(a)*d,g);
  }
  // 井底：看不见尽头
  const cap=new THREE.Mesh(new THREE.CircleGeometry(.44,24),material(0x050608,{side:THREE.DoubleSide}));
  cap.rotation.x=-Math.PI/2;cap.position.y=-7.05;g.add(cap);
  const core=new THREE.Mesh(new THREE.CircleGeometry(.3,24),basic(0x9fd8ff,{transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  core.rotation.x=-Math.PI/2;core.position.y=-7.0;g.add(core);
  cannonGlows.push(core);
  const pl=new THREE.PointLight(0x86c8ff,1.8,12,2);pl.position.y=-6.3;g.add(pl);
  // 井口上方尚未散尽的发射辉光
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.95,9,26,1,true),
    basic(0x9ecdff,{transparent:true,opacity:.045,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  beam.position.y=4.5;g.add(beam);
  // 发射塔架与信号灯
  [0,1,2].forEach(i=>{
    const a=i/3*Math.PI*2+.5,d=2.55,bx=Math.cos(a)*d,bz=Math.sin(a)*d,h=2.0+(i%2)*.6;
    box(steel,.16,h,.16,bx,h/2,bz,g);
    box(steel,.16,h*.8,.16,bx*1.13,h/2,bz*1.13,g);
    for(let k=1;k<4;k++)box(steel,.5,.05,.05,bx*1.06,h*k/3.2,bz*1.06,g);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),basic(0xff6a3c,{transparent:true,opacity:.9}));
    lamp.position.set(bx,h+.12,bz);g.add(lamp);
  });
  // 地面加速导轨
  for(let i=0;i<2;i++){
    const x=i?2.5:-2.5;
    box(steel,.1,.07,3.4,x,.16,0,g);
    for(let k=-2;k<=2;k++)box(concDark,.22,.14,.22,x,.08,k*.72,g);
  }
  place(g,hole.lat,hole.lon,0);
  g.scale.setScalar(2);        // 井口尺寸由洞口半径决定，不随地表道具缩放
  return g;
}

const twinkleLights=[];
function tangentOf(d){const t=new THREE.Vector3(0,1,0).cross(d);if(t.lengthSq()<1e-6)t.set(1,0,0);return t.normalize()}
function bitangentOf(d){return new THREE.Vector3().crossVectors(d,tangentOf(d)).normalize()}
function randomUnit(){const u=random()*2-1,a=random()*Math.PI*2,q=Math.sqrt(1-u*u);return new THREE.Vector3(q*Math.cos(a),u,q*Math.sin(a))}
function randomDirInCone(center,maxAngle){
  const t=tangentOf(center),b=bitangentOf(center);
  const a=random()*Math.PI*2,r=Math.sqrt(random())*maxAngle;
  return center.clone().multiplyScalar(Math.cos(r)).addScaledVector(t,Math.sin(r)*Math.cos(a)).addScaledVector(b,Math.sin(r)*Math.sin(a)).normalize();
}
function offsetDir(center,t,b,u,v){return center.clone().addScaledVector(t,u).addScaledVector(b,v).normalize()}
function buildMoon(){
  const R=8,moon=new THREE.Group();
  const geo=new THREE.IcosahedronGeometry(R,22);
  const pos=geo.attributes.position,colors=[];
  const craters=[];
  for(let i=0;i<14;i++)craters.push({dir:randomUnit(),r:R*(.12+random()*.22),d:R*(.045+random()*.045)});
  for(let i=0;i<pos.count;i++){
    const n=new THREE.Vector3(pos.getX(i),pos.getY(i),pos.getZ(i)).normalize();
    let h=0;
    for(const c of craters){
      const ratio=Math.acos(Math.max(-1,Math.min(1,n.dot(c.dir))))*R/c.r;
      if(ratio<1)h-=c.d*(1-ratio*ratio);
      else if(ratio<1.22)h+=c.d*.36*(1.22-ratio)/.22;
    }
    h+=R*.012*(Math.sin(n.x*9+n.y*7)+.6*Math.sin(n.z*13-n.y*5));
    const rr=R+h;
    pos.setXYZ(i,n.x*rr,n.y*rr,n.z*rr);
    const shade=.6+1.5*h/(R*.14)+.1*Math.sin(n.x*6+n.z*4);
    const col=new THREE.Color(0x9a9a97).multiplyScalar(Math.max(.5,Math.min(1.3,shade))*1.15);
    colors.push(col.r,col.g,col.b);
  }
  geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
  geo.computeVertexNormals();
  moon.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.98,metalness:0,flatShading:true})));
  // 月面高度采样：让探险者能真正踩在坑坑洼洼的月面上
  moon.userData.heightAt=n=>{
    let h=R*.012*(Math.sin(n.x*9+n.y*7)+.6*Math.sin(n.z*13-n.y*5));
    for(const c of craters){
      const ratio=Math.acos(Math.max(-1,Math.min(1,n.dot(c.dir))))*R/c.r;
      if(ratio<1)h-=c.d*(1-ratio*ratio);
      else if(ratio<1.22)h+=c.d*.36*(1.22-ratio)/.22;
    }
    return h;
  };

  const devDir=new THREE.Vector3(-.9,.17,.4).normalize();          // 被开发的半球（朝星球那一面）
  moon.userData.devDir=devDir;
  const devT=tangentOf(devDir),devB=bitangentOf(devDir);
  const metal=material(C.steelDark,{metalness:.72,roughness:.45,flatShading:false});
  const panelMat=material(C.panel,{metalness:.3,roughness:.36,emissive:0x1b4a68,emissiveIntensity:.8,flatShading:false,side:THREE.DoubleSide});
  const onMoon=it=>{
    const d=it.dir.clone().normalize();
    const p=d.clone().multiplyScalar(R+it.h);
    const q=new THREE.Quaternion().setFromUnitVectors(_UP,d);
    if(it.yaw)q.multiply(new THREE.Quaternion().setFromAxisAngle(_UP,it.yaw));
    return {p,q,s:it.s};
  };
  // 太阳能板阵列（成排铺开，少数歪斜）
  const panels=[];
  for(let row=0;row<5;row++)for(let col=0;col<7;col++){
    const d=offsetDir(devDir,devT,devB,.115*(row-2)+.02*(col%2),.13*(col-3));

  }
  instanceMesh(new THREE.BoxGeometry(.52,.04,.36).translate(0,.02,0),panelMat,panels.map(onMoon),moon,{castShadow:true});
  instanceMesh(new THREE.BoxGeometry(.06,.42,.06).translate(0,.21,0),metal,panels.map(p=>({dir:p.dir,h:0,s:1})).map(onMoon),moon,{castShadow:true});
  // 半建成的生活穹顶（有的缺一角）
  [[-.24,.3,1.35],[.02,-.02,2],[.3,-.34,2]].forEach(v=>{
    const d=offsetDir(devDir,devT,devB,v[0],v[1]);
    const dome=new THREE.Mesh(new THREE.SphereGeometry(.95,20,12,0,Math.PI*v[2],0,Math.PI/2),

    lamp.position.copy(d.clone().multiplyScalar(R+.3));moon.add(lamp);twinkleLights.push(lamp);
  });
  // 只建了半圈的环形桁架
  const rd=offsetDir(devDir,devT,devB,.46,-.42);
  const ringT=new THREE.Mesh(new THREE.TorusGeometry(1.5,.09,8,44,Math.PI*1.3),metal);
  ringT.position.copy(rd.clone().multiplyScalar(R+.9));
  ringT.quaternion.setFromUnitVectors(_UP,rd);ringT.castShadow=true;moon.add(ringT);
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*1.3;
    const p=new THREE.Vector3(Math.cos(a)*1.5,0,Math.sin(a)*1.5).applyQuaternion(ringT.quaternion).add(ringT.position);
    const st=new THREE.Mesh(new THREE.BoxGeometry(.09,1.5,.09),metal);
    st.position.copy(p.clone().multiplyScalar(.94));st.quaternion.copy(ringT.quaternion);moon.add(st);
  }
  // 着陆坪
  const padDir=offsetDir(devDir,devT,devB,-.44,-.5);
  const pad=new THREE.Mesh(new THREE.CircleGeometry(1.5,32),material(0x6f6d67,{roughness:.95,side:THREE.DoubleSide}));
  pad.position.copy(padDir.clone().multiplyScalar(R+.02));pad.quaternion.setFromUnitVectors(_UP,padDir);moon.add(pad);
  const padRing=new THREE.Mesh(new THREE.RingGeometry(1.24,1.44,40),basic(0xffbe6a,{transparent:true,opacity:.72,side:THREE.DoubleSide}));
  padRing.position.copy(padDir.clone().multiplyScalar(R+.04));padRing.quaternion.setFromUnitVectors(_UP,padDir);moon.add(padRing);
  // 起重机 / 施工器械
  for(let i=0;i<5;i++){
    const d=offsetDir(devDir,devT,devB,(random()-.5)*.6,(random()-.5)*.7);
    const cg=new THREE.Group();
    box(metal,.1,.75,.1,0,.38,0,cg);
    box(metal,.09,.09,.7,0,.78,.3,cg);
    box(metal,.03,.45,.03,0,.58,.62,cg);
    cg.position.copy(d.clone().multiplyScalar(R+.02));
    cg.quaternion.setFromUnitVectors(_UP,d);
    cg.rotateY(random()*6.28);moon.add(cg);
  }
  // 散落的建材废料
  const junk=[];
  for(let i=0;i<80;i++)junk.push({dir:randomDirInCone(devDir,.95),h:0,s:.5+random()*1.2,yaw:random()*6.28});
  instanceMesh(new THREE.DodecahedronGeometry(.11,0).translate(0,.07,0),material(0x584a3b,{roughness:.95}),junk.map(onMoon),moon,{castShadow:true});
  moon.userData.R=R;
  return moon;
}

// ======================= 13. 人造卫星 / 废弃空间站 / 星尘 =======================
function buildSatellite(s){
  const g=new THREE.Group();

  const plate=material(0x8a8d90,{metalness:.3,roughness:.7,flatShading:false});
  const panelMat=material(C.panel,{metalness:.35,roughness:.34,emissive:0x11324a,emissiveIntensity:.65,flatShading:false,side:THREE.DoubleSide});
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.1,.9,1.1),metal);body.castShadow=true;g.add(body);
  [-1,1].forEach(k=>{
    const arm=new THREE.Mesh(new THREE.BoxGeometry(1.0,.1,.1),metal);arm.position.x=k*.95;g.add(arm);
    const p=new THREE.Mesh(new THREE.BoxGeometry(2.5,.05,1.15),panelMat);p.position.x=k*2.5;g.add(p);
    const rib=new THREE.Mesh(new THREE.BoxGeometry(2.5,.06,.06),metal);rib.position.set(k*2.5,0,.56);g.add(rib);
  });
  const dish=new THREE.Mesh(new THREE.SphereGeometry(.5,16,8,0,Math.PI*2,0,Math.PI*.42),plate);
  dish.rotation.x=-Math.PI*.6;dish.position.set(0,.5,.55);g.add(dish);

  const tail=new THREE.Mesh(new THREE.SphereGeometry(.1,8,6),basic(0xff5a3c));tail.position.set(0,.1,-.62);g.add(tail);

function createOrbital(){
  const pivots=[];

  [[{x:.3,z:.1},64,.62],[{x:-.5,z:.34},74,.78],[{x:.6,z:-.3},86,.55],[{x:-.18,z:-.55},70,.7]].forEach(v=>{

  }

  }

  const moteMesh=new THREE.Points(mg,new THREE.PointsMaterial({color:0x9c8a72,size:.7,transparent:true,opacity:.2,sizeAttenuation:true,depthWrite:false}));
  space.add(moteMesh);
  // 近地轨道的废弃碎片带（文明留下的最后一圈垃圾）
  const beltPivot=new THREE.Group();beltPivot.rotation.set(.3,0,.14);space.add(beltPivot);
  const belt=[];
  for(let i=0;i<300;i++){
    const a=random()*Math.PI*2,r=64+random()*10;

      p:new THREE.Vector3(Math.cos(a)*r,(random()-.5)*3,Math.sin(a)*r),
      q:new THREE.Quaternion().setFromEuler(new THREE.Euler(random()*3,random()*3,random()*3)),

  pivots.push({node:beltPivot,speed:.028});
  return {pivots,moon,moonPivot,station,stPivot,stEye,debrisGroup,moteMesh,beltPivot};
}

// ======================= 13b. 死星地表语汇 · 自然地貌 =======================
// 用一批贴合球面的低模生成器把大片空地铺满；同时刻意留出几片旷野与死湖，
// 避免整颗星球被填满。重复件一律走 InstancedMesh，控制 draw call。
const BOULDER_GEO=new THREE.DodecahedronGeometry(.5,0);
const SLAB_GEO=G.box;
const SPIRE_GEO=new THREE.ConeGeometry(.5,1,6).translate(0,.5,0);
const DUNE_GEO=new THREE.SphereGeometry(1,10,6).scale(1,.12,.34).translate(0,-.012,0);
const CRATER_GEO=(()=>{
  const rings=5,segments=18,verts=[],idx=[];
  const prof=t=>{const r=t*1.5;
    if(r<.62)return -.2*(1-(r/.62)*(r/.62));
    if(r<1)return .085*Math.sin((r-.62)/.38*Math.PI);
    return .035*(1-(r-1)/.5)};
  verts.push(0,prof(0),0);
  for(let k=1;k<=rings;k++){const t=k/rings;for(let s=0;s<segments;s++){
    const a=s/segments*Math.PI*2,rr=t*1.5;
    verts.push(Math.sin(a)*rr,prof(t),Math.cos(a)*rr)}}
  for(let s=0;s<segments;s++){const nn=(s+1)%segments;idx.push(0,1+s,1+nn)}
  for(let k=2;k<=rings;k++){const ps=1+(k-2)*segments,cs=1+(k-1)*segments;
    for(let s=0;s<segments;s++){const nn=(s+1)%segments,a=ps+s,b=ps+nn,c=cs+s,d=cs+nn;
      idx.push(a,c,b,b,c,d)}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.setIndex(idx);g.computeVertexNormals();return g;
})();

// ---- 撞击坑：碗底 + 隆起坑缘 + 外侧抛射岩块 ----
function impactCraterAt(lat,lon,size,depth){
  const R=size,rej=1.62;
  const prof=t=>{const r=t*rej;
    if(r<.62)return -depth*(1-(r/.62)*(r/.62));
    if(r<1)  return depth*.42*Math.sin((r-.62)/.38*Math.PI);
    return depth*.18*(1-(r-1)/(rej-1))};
  curvedSurfaceDisc(lat,lon,R*rej,.012,material(0x2a2b2d,{roughness:1,side:THREE.DoubleSide}),
    {rings:8,segments:38,flat:true,profile:prof});
  const ej=[],n=7+Math.floor(R*3.5);
  for(let i=0;i<n;i++){
    const a=random()*360,d=R*(1.06+random()*.55),p=stepGeo(lat,lon,a,d),s=R*(.045+random()*.075);
    ej.push({lat:p[0],lon:p[1],height:-.01,sx:s,sy:s*(.55+random()*.6),sz:s,yaw:random()*6.283,tiltX:(random()-.5)*1.4});
  }
  instanceMesh(BOULDER_GEO,material(0x33343a,{roughness:1}),surfaceItems(ej),world,{castShadow:true,receiveShadow:true});
  return R;
}

// ======================= 13c. 死星地表语汇 · 文明遗存 =======================
// 只沿陆地上的折线铺装（自动跳过海面），所以公路 / 管道 / 电塔不会掉进海里
function landRibbon(pts,width,mat,height){
  const samples=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],n=14;
    for(let j=0;j<n;j++){const t=j/n;samples.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
  }
  samples.push(pts[pts.length-1]);
  let run=[];
  for(const s of samples){
    if(isLand(s[0],s[1],.02)&&holeDistance(s[0],s[1])>HOLE_R*1.9)run.push(s);
    else{if(run.length>1)surfaceRibbon(run,width,mat,height);run=[]}
  }
  if(run.length>1)surfaceRibbon(run,width,mat,height);
}
// ---- 废弃公路网：塌陷开裂的干线 ----

const ROADS=[
  [[2,64],[10,70],[18,80],[26,88],[32,96]],

function roadNetwork(){

// ---- 高压电塔列（部分倒伏）----
function pylonLine(pts,gap){
  const mast=[],arm=[],fallen=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    const dist=Math.hypot(b[0]-a[0],(b[1]-a[1])*Math.cos(D2R(a[0])))*planetRadius*Math.PI/180;
    const n=Math.max(1,Math.round(dist/gap));
    for(let k=0;k<n;k++){
      const t=k/n,lat=a[0]+(b[0]-a[0])*t,lon=a[1]+(b[1]-a[1])*t;
      if(!isLand(lat,lon,.03)||holeDistance(lat,lon)<HOLE_R*1.9)continue;
      const yaw=geoYaw(lat,lon,R2D(Math.atan2((b[1]-a[1])*Math.cos(D2R(lat)),b[0]-a[0])));
      if(random()<.22){fallen.push({lat,lon,height:.06,sx:.1,sy:.7+random()*.5,sz:.1,yaw,tiltX:1.35+random()*.25});continue}
      const H=.58+random()*.5;
      mast.push({lat,lon,height:-.02,sx:.065,sy:H,sz:.065,yaw,tiltX:(random()-.5)*.1});
      arm.push({lat,lon,height:H-.09,sx:.3+random()*.18,sy:.042,sz:.042,yaw:yaw+Math.PI/2,tiltX:(random()-.5)*.1});
    }
  }
  const steel=material(C.steelDark,{metalness:.5,roughness:.62,flatShading:false});
  instanceMesh(SLAB_GEO,steel,surfaceItems(mast),world,{castShadow:true});
  instanceMesh(SLAB_GEO,steel,surfaceItems(arm),world,{castShadow:true});
  instanceMesh(SLAB_GEO,steel,surfaceItems(fallen),world,{castShadow:true});
}
// ---- 露天矿坑：阶梯采掘面 + 螺旋运输道 + 环形排土堆 ----
function openPitMine(lat,lon,size,depth){
  const steps=4;
  const prof=t=>{
    const u=clamp01((t-.13)/.87),sf=u*steps,k=Math.floor(sf),f=sf-k;
    return -depth*(1-(k+f*.5)/steps);
  };
  curvedSurfaceDisc(lat,lon,size,.02,material(0x32312e,{roughness:1,side:THREE.DoubleSide}),
    {rings:16,segments:52,flat:true,profile:prof});
  curvedSurfaceDisc(lat,lon,size*.26,.03,material(0x0b1113,{roughness:.5,side:THREE.DoubleSide}),{rings:6,segments:28});
  const heaps=[];
  for(let i=0;i<30;i++){
    const a=random()*360,d=size*(1.06+random()*.45),p=stepGeo(lat,lon,a,d),s=size*(.06+random()*.1);
    heaps.push({lat:p[0],lon:p[1],height:-.02,sx:s*2.2,sy:s*(.5+random()*.5),sz:s,
      yaw:geoYaw(p[0],p[1],a+90),tiltX:(random()-.5)*.2});
  }
  instanceMesh(DUNE_GEO,material(0x4a463d,{roughness:1}),surfaceItems(heaps),world,{receiveShadow:true,castShadow:true});
  const ramp=[];
  for(let i=0;i<=26;i++){const t=i/26;ramp.push(stepGeo(lat,lon,70+240*t,size*(1.16-t*.86)))}
  surfaceRibbon(ramp,.3,material(0x3a3732,{roughness:1,side:THREE.DoubleSide}),.075);
  for(let i=0;i<4;i++){                       // 撂下的采矿设备
    const p=stepGeo(lat,lon,random()*360,size*(.35+random()*.6)),g=new THREE.Group();
    box(material(C.rust),.5,.18,.32,0,.15,0,g);
    box(material(C.soot),.24,.14,.28,-.12,.3,0,g);
    const arm=box(material(C.steelDark,{metalness:.5,roughness:.6,flatShading:false}),.05,.42,.05,.28,.32,0,g);arm.rotation.z=-.6;
    place(g,p[0],p[1],.05);g.rotateY(random()*6.283);
  }
}

// ---- 锈蚀管道带 ----
function pipeSeg(g,mat,a,b,r){
  const d=b.clone().sub(a),len=d.length();
  const m=new THREE.Mesh(G.cyl,mat);
  m.scale.set(r*2,len,r*2);m.position.copy(a);
  m.quaternion.setFromUnitVectors(_UP,d.normalize());
  m.castShadow=true;g.add(m);
}
function pipelineRun(lat,lon,length,angle,count){
  const mat=material(0x413c35,{metalness:.4,roughness:.75,flatShading:false});
  const legMat=material(C.rustDark,{roughness:.9});
  const g=new THREE.Group();
  const origin=point(lat,lon,0),q0=new THREE.Quaternion().setFromUnitVectors(_UP,origin.clone().normalize());
  const qi=q0.clone().invert();
  const toLocal=w=>w.clone().sub(origin).applyQuaternion(qi);
  let a=D2R(angle),la=lat,lo=lon,prev=toLocal(point(la,lo,.3));
  const step=length/count;
  for(let i=0;i<count;i++){
    a+=(random()-.5)*.5;
    const p=stepGeo(la,lo,R2D(a),step),cur=toLocal(point(p[0],p[1],.3));
    pipeSeg(g,mat,prev,cur,.05+random()*.02);
    if(i%2===0)box(legMat,.06,prev.y,.06,prev.x,0,prev.z,g);
    prev=cur;la=p[0];lo=p[1];
  }
  place(g,lat,lon,0);
}
// ---- 断裂的方尖碑 ----
function brokenMonument(lat,lon,h){
  const g=new THREE.Group();
  const mat=material(0x434240,{roughness:.95,flatShading:false});
  box(mat,.8,.18,.8,0,.09,0,g);
  box(mat,.55,.26,.55,0,.3,0,g);
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.09,.21,h,4),mat);
  shaft.position.y=.44+h/2;shaft.rotation.y=.78;shaft.castShadow=true;g.add(shaft);
  const top=new THREE.Mesh(new THREE.ConeGeometry(.18,.26,4),mat);
  top.position.y=.44+h+.1;top.rotation.y=.78;g.add(top);
  for(let i=0;i<5;i++){                       // 崩落的碑体碎块
    const a=random()*6.283,d=.5+random()*.9;
    box(mat,.2+random()*.3,.16+random()*.16,.2+random()*.28,Math.cos(a)*d,0,Math.sin(a)*d,g);
  }
  place(g,lat,lon,.02);
}
// ---- 坠毁的运载器 ----
function crashedWreck(lat,lon,size,angle){
  const g=new THREE.Group();
  const hull=material(0x4c5054,{metalness:.35,roughness:.7,flatShading:false});
  const dark=material(C.soot,{roughness:.9});
  const body=new THREE.Mesh(new THREE.CylinderGeometry(size*.34,size*.44,size*2.6,12),hull);
  body.rotation.z=Math.PI/2-.28;body.position.y=size*.42;body.castShadow=true;body.receiveShadow=true;g.add(body);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(size*.34,size*.9,12),hull);
  nose.rotation.z=-Math.PI/2;nose.position.set(size*1.7,size*.05,0);g.add(nose);
  [-1,1].forEach(s=>{                          // 折断的翼
    const w=box(hull,size*1.5,.1,size*.9,s*size*.9,size*.3,s*size*.7,g);w.rotation.y=s*.5;w.rotation.z=s*.3;
  });
  for(let i=0;i<9;i++){                        // 抛撒的碎片
    const a=random()*6.283,d=size*(1.4+random()*2.6);
    box(i%2?dark:hull,.2+random()*.6,.15+random()*.35,.2+random()*.5,Math.cos(a)*d,.1,Math.sin(a)*d,g);
  }
  curvedSurfaceDisc(lat,lon,size*2.4,.026,material(0x16171a,{roughness:1,side:THREE.DoubleSide}),{rings:7,segments:40});
  place(g,lat,lon,0);
  g.rotateY(geoYaw(lat,lon,angle));
}
// ---- 停摆的风机群 ----
function deadTurbines(cLat,cLon,latS,lonS,count){
  const tower=material(0x6f7170,{metalness:.25,roughness:.8,flatShading:false});
  const blade=material(0x7d7f7c,{metalness:.2,roughness:.85,flatShading:false});
  const bladeGeo=new THREE.BoxGeometry(.07,1,.16).translate(0,.5,0);
  scatter(cLat,cLon,latS,lonS,count,(lat,lon)=>{
    const H=.5+random()*.42,g=new THREE.Group();
    cyl(tower,.042,H,0,0,0,g);
    box(tower,.2,.13,.15,0,H+.01,0,g);
    const n=random()<.45?1:0;                  // 大部分机组只剩一两支叶片
    for(let i=0;i<=n;i++){
      const b=new THREE.Mesh(bladeGeo,blade);
      b.scale.set(1,.4+random()*.34,1);
      b.rotation.z=.2+i*2.4+(random()-.5)*.5;
      b.position.set(0,H+.08,.11);
      b.castShadow=true;g.add(b);
    }
    place(g,lat,lon,.02);g.rotateY(random()*6.283);
  });
}

        if(r1<tmin)tmin=r1;if(r2<tmin)tmin=r2;

        const cx=(kx0+kx1+kx2)/3,cy=(ky0+ky1+ky2)/3,cz=(kz0+kz1+kz2)/3;
        // 先看三角形中心那一格的地表：整块都贴地（星球本体、道路、贴地贴片）或整块都在
        // 头顶以上（雾霾、光柱）就直接丢掉 —— 星球本体有两万多个三角形，这一步最省
        const cml=Math.hypot(cx,cy,cz)||1e-9;
        const cci=Math.min(ROWS-1,Math.max(0,Math.floor((R2D(Math.asin(cy/cml))+90)/deg)));
        const ccj=Math.min(COLS-1,Math.max(0,Math.floor((R2D(Math.atan2(cz,cx))+180)/deg)));
        const cg=gAt(cci,ccj);
        if(tmax<cg+eps)continue;
        if(tmin>cg+headMax)continue;
        // 井内那套东西（井壁 / 平台 / 井底辉光）不当墙，否则人进不去
        if(excl.length){
          let skip=false;
          for(let e=0;e<excl.length;e++){
            const z=excl[e];
            const along=cx*z.dir.x+cy*z.dir.y+cz*z.dir.z;
            if(along<z.lo||along>z.hi)continue;
            const px=cx-z.dir.x*along,py=cy-z.dir.y*along,pz=cz-z.dir.z*along;
            if(px*px+py*py+pz*pz<z.r*z.r){skip=true;break}
          }
          if(skip)continue;
        }
        // 顶点的格坐标
        const pa0=u0/deg+COLS/2,pa1=u1/deg+COLS/2,pa2=u2/deg+COLS/2;
        const pb0=v0/deg+ROWS/2,pb1=v1/deg+ROWS/2,pb2=v2/deg+ROWS/2;
        const uma=Math.max(pa0,pa1,pa2),umi=Math.min(pa0,pa1,pa2);
        if(uma-umi>COLS*.5)continue;                      // 跨了 ±180° 接缝，放弃
        const vma=Math.max(pb0,pb1,pb2),vmi=Math.min(pb0,pb1,pb2);
        let i0=Math.floor(vmi),i1=Math.ceil(vma),j0=Math.floor(umi),j1=Math.ceil(uma);
        if(i0<0)i0=0;if(i1>ROWS-1)i1=ROWS-1;
        if(j0<0)j0=0;if(j1>COLS-1)j1=COLS-1;
        if(i0>i1||j0>j1)continue;
        if((i1-i0+1)*(j1-j0+1)>cap){nBig++;continue}      // 地形尺度的大三角形，不做
        for(let i=i0;i<=i1;i++){
          const py=i+.5,row=i*COLS;
          for(let j=j0;j<=j1;j++){
            if(!inTri(j+.5,py,pa0,pb0,pa1,pb1,pa2,pb2))continue;
            const gk=gAt(i,j);
            if(tmax<gk+eps)continue;
            if(tmin>gk+headMax)continue;
            const k=row+j;
            if(tmax>hi[k])hi[k]=tmax;
            if(tmin<lo[k])lo[k]=tmin;
          }
        }
      }
    }
  }
  let cells=0;
  for(let k=0;k<N;k++)if(hi[k]>0)cells++;
  // ---------- 悬空通道的连通性检查 ----------
  // 楼顶 / 平台板这类"大平顶"在格子里只留下一张水平面：lo 与 hi 都等于顶面高度，
  // 看上去像一个悬空结构，于是判定就会放人从楼体内部穿过去（这是"穿模"的真正原因）。
  // 真正的悬空通道（天桥、管线、有柱子的雨棚）底下那层空间一定与外面的空地水平连通；
  // 被实心格围死的（楼体内部、实心大平台底下）则不是。所以这里泛洪一次：
  // 只有能连通到空地的悬空格才算通道，其余按实心处理。
  const open=new Uint8Array(N);
  {
    const can=new Uint8Array(N);
    for(let i=0;i<ROWS;i++){
      const row=i*COLS;
      for(let j=0;j<COLS;j++){
        const k=row+j;
        if(hi[k]>0&&lo[k]-gAt(i,j)>=under)can[k]=1;
      }
    }
    const q=new Int32Array(N);let qh=0,qt=0;
    for(let i=0;i<ROWS;i++){
      const row=i*COLS;
      for(let j=0;j<COLS;j++){
        const k=row+j;if(!can[k]||open[k])continue;
        const jl=j>0?j-1:COLS-1,jr=j<COLS-1?j+1:0;
        let touch=hi[row+jl]<=0||hi[row+jr]<=0;
        if(!touch&&i>0)touch=hi[k-COLS]<=0;
        if(!touch&&i<ROWS-1)touch=hi[k+COLS]<=0;
        if(touch){open[k]=1;q[qt++]=k}
      }
    }
    while(qh<qt){
      const k=q[qh++],i=Math.floor(k/COLS),j=k-i*COLS;
      const jl=j>0?j-1:COLS-1,jr=j<COLS-1?j+1:0;
      const n0=i>0?k-COLS:-1,n1=i<ROWS-1?k+COLS:-1,n2=i*COLS+jl,n3=i*COLS+jr;
      if(n0>=0&&can[n0]&&!open[n0]){open[n0]=1;q[qt++]=n0}
      if(n1>=0&&can[n1]&&!open[n1]){open[n1]=1;q[qt++]=n1}
      if(can[n2]&&!open[n2]){open[n2]=1;q[qt++]=n2}
      if(can[n3]&&!open[n3]){open[n3]=1;q[qt++]=n3}
    }
  }
  return {ROWS,COLS,deg,R,cell:D2R(deg)*R,latOf,lonOf,lo,hi,open,
    ms:Date.now()-t0,meshes:nMesh,tris:nTri,kept:nKept,big:nBig,cells};
}
// 横向：这一步能不能走过去。撞上了可传 out，会回传"障碍在哪个方向"（东/北，局部单位），
// 调用方据此把移动方向投影到障碍的切向 —— 就是贴着墙蹭过去，而不是原地顿住。
function fieldBlocked(F,lat,lon,footR,bodyH,bodyR,out){
  const stepH=OB.stepK*bodyH,headR=footR+bodyH;
  const i0=Math.floor((lat+90)/F.deg),j0=Math.floor((lon+180)/F.deg);
  const lim=bodyR+F.cell*OB.marK,cl=Math.cos(lat*DEG)*DEG*F.R;
  let best=1e9,bx=0,by=0;
  for(let di=-1;di<=1;di++){
    const i=i0+di;if(i<0||i>=F.ROWS)continue;
    const dLat=(lat-F.latOf(i))*DEG*F.R;
    for(let dj=-1;dj<=1;dj++){
      let j=j0+dj;if(j<0)j+=F.COLS;else if(j>=F.COLS)j-=F.COLS;
      const k=i*F.COLS+j,top=F.hi[k];
      if(top<=0)continue;
      if(top<=footR+stepH)continue;        // 矮的：迈过去
      if(F.lo[k]>=headR&&F.open&&F.open[k])continue; // 悬空、且底下确实连得通：从下面钻过去
      const dLon=wrappedLonDelta(lon,F.lonOf(j))*cl;
      const d2=dLat*dLat+dLon*dLon;
      if(d2>lim*lim)continue;
      if(out&&d2<best){best=d2;bx=dLon;by=dLat}
      else if(!out)return true;
    }
  }
  if(best>=1e9)return false;
  if(out){out.x=bx;out.y=by}
  return true;
}
// 撞上以后：把"想走的方向"投影到障碍表面的切向（去掉指向障碍的那一维）。
// 回传的 (x,y) 是障碍格心相对人的偏移（东 / 北），取反就是法线。
const _hit={x:0,y:0};
function slideAngle(angDeg,hit){
  const n=Math.hypot(hit.x,hit.y);
  if(n<1e-6)return null;
  const nx=-hit.x/n,ny=-hit.y/n;              // 法线：由障碍指向人
  const a=D2R(angDeg);
  let mx=Math.sin(a),my=Math.cos(a);          // 方位角 → (东, 北)
  const dot=mx*nx+my*ny;
  if(dot>0){                                  // 正在往障碍里钻：把这一维去掉
    mx-=nx*dot;my-=ny*dot;
    const L=Math.hypot(mx,my);
    if(L<1e-3)return null;                    // 正对着撞，没有切向可走
    mx/=L;my/=L;
  }
  return R2D(Math.atan2(mx,my));
}
// 纵向：脚下能踩到的最高顶面（绝对半径，没有就返回 0）
function fieldSupport(F,lat,lon,footR,bodyH,baseR){
  const tol=OB.land*bodyH,minH=OB.minH*bodyH;
  const i0=Math.floor((lat+90)/F.deg),j0=Math.floor((lon+180)/F.deg);
  const lim=OB.bodyK*bodyH+F.cell*OB.marK,cl=Math.cos(lat*DEG)*DEG*F.R;
  let best=0;
  for(let di=-1;di<=1;di++){
    const i=i0+di;if(i<0||i>=F.ROWS)continue;
    const dLat=(lat-F.latOf(i))*DEG*F.R;
    for(let dj=-1;dj<=1;dj++){
      let j=j0+dj;if(j<0)j+=F.COLS;else if(j>=F.COLS)j-=F.COLS;
      const k=i*F.COLS+j,top=F.hi[k];
      if(top<=best)continue;
      if(top>footR+tol)continue;
      if(top<baseR+minH)continue;
      const dLon=wrappedLonDelta(lon,F.lonOf(j))*cl;
      if(dLat*dLat+dLon*dLon>lim*lim)continue;
      best=top;
    }
  }
  return best;
}

// ---------- 贯穿星球的穿梭隧道：井筒内部的"地面" ----------
// 井口是一个向下收束的锥形竖井（earthCannon 里的 bore），整组放大 2 倍后：
//   井口内半径 3.84、高出地表 0.48；井底内半径 0.52、深 14.32。
// 于是井里也有一套"地面"：离井轴越近，脚底越低——走进去就是往下滑，
// 松手会一路落到井底。中间还有一圈环形平台（下面那圈检修走道），可以站着看井底的辉光。
function makeShaft(lat,lon,ground,opt){
  const s=Object.assign({
    lat,lon,
    mouthR:1.92*2,mouthY:.24*2,       // 井口内半径 / 高出地表（整组放大 2 倍后的值）
    tipR:.26*2,tipD:7.16*2,           // 井底内半径 / 井底深度
    holeR:HOLE_R,                     // 地表上真正挖掉的圆半径（洞穴边界）
    catIn:.72,catOut:2.50,catD:5.49,  // 井内环形检修平台（外沿正好落在井壁上）
    capR:.57,capD:14.10               // 井底那点小平地
  },opt||{});
  // 井筒整组是"贴在地表"放下去的，所以深度要相对**井口处的地表高度**来算
  s.originH=ground?ground(lat,lon):0;
  const k=(s.tipD+s.mouthY)/(s.mouthR-s.tipR);
  s.dir=latLonToDir(lat,lon);                 // 井轴（= 该点的球面法线），机位避让用
  s.radial=(d)=>s.tipR+(s.tipD-d)/k;          // 深度 → 该处井筒半径
  s.depth=function(la,lo,R){                  // 返回井内地面高度（相对 R）；井外返回 null
    const r=D2R(angDistDeg(la,lo,s.lat,s.lon))*R;
    if(r>=s.holeR)return null;
    let d;
    if(r<=s.capR)d=s.capD;
    else if(r>=s.catIn&&r<=s.catOut)d=s.catD;
    else d=s.tipD-k*(r-s.tipR);
    return s.originH-d;
  };
  return s;
}
// 脚下的"地表"：纯地形 + 井内剖面（井里是负值）。
// 第四个参数 st 传进来就顺手把井内信息写回去（当前深度 / 该处井筒半径 / 井轴），
// 手电筒那种每帧上百次的采样不传 st，免得把状态冲掉。
function groundAt(o,la,lo,st){
  let g=o.ground?o.ground(la,lo):0;
  const sh=o.shafts;
  if(sh)for(let i=0;i<sh.length;i++){
    const v=sh[i].depth(la,lo,o.R);        // 井内地面高度（相对 R，越深越负）
    if(v===null)continue;
    if(st){const d=sh[i].originH-v;st.shaftD=d;st.shaftR=sh[i].radial(d);
      st.shaftAxis=sh[i].dir;st.shaftIdx=i}

  }

}
function groundRaw(o,la,lo){
  o.shaftD=0;o.shaftR=0;o.shaftAxis=null;
  return groundAt(o,la,lo,o);
}

// ---------- 手电筒：前方一片贴地的扇形亮区 + 一盏真实的聚光灯 ----------
// 光斑不是贴图，而是**每帧重画的一张贴地扇形网格**：顶点按扇形极坐标算出经纬度，
// 再取地形高度把它们按到真实地面上。所以它完全贴合起伏的地形，也能跟着视线转。
// 材质是加法混合 + 顶点色（径向衰减 × 张角边缘柔化），近处亮、远端与两侧淡出。
// 亮度走右上角「手电筒」面板，与灵敏度同一套 ± 按钮；
// 聚光灯负责同时照亮前方的立体物（残骸、树桩），光斑负责地面上的那片扇形。
const TORCH={
  on:true,
  bright:1,                 // 亮度系数（面板步进 ×0.82 / ×1.25，范围 0.08~2.6）
  color:0xffdfab,           // 暖白，像老式卤素手电
  spread:36,                // 扇形半张角（度）
  reach:5.6,                // 扇形半径（局部单位）
  inner:.34,                // 从脚前这个距离开始亮，免得脚下糊成一团
  segS:20,segR:6,           // 角度分段 / 径向分段（顶点数 (segS+1)×(segR+1)）
  lift:.014,                // 抬高一点，避免和地面 z-fighting
  spotK:5.6,                // 聚光灯基础强度
  spotDist:26,              // 聚光灯射程：**这是世界单位**（不随父级缩放），parent 还有 3 倍缩放，

function makeTorch(o){

const _tc=new THREE.Color();
function updateTorch(o,dt){

  const act=(TORCH.on&&o===activeExp);
  T.k+=((act?1:0)-T.k)*ease(7,dt);

  T.spot.visible=T.mesh.visible;

  if(!T.mesh.visible)return;

  const rel=D2R(o.yaw-o.hdg),rc=TORCH.reach,pitch=o.pitch;

    col[k]=_tc.r*a;col[k+1]=_tc.g*a;col[k+2]=_tc.b*a;k+=3};

        // groundRaw 会把"采样点"的井内信息写回玩家对象，于是站在井口附近、
        // 手电往井里一照，玩家就被误判成"人在井里"（飞升 ×2.4、机位缩到肩上）。
        const nd=latLonToDir(p[0],p[1]),h=o.R+groundAt(o,p[0],p[1])+TORCH.lift;

    // 前方铺一片长扇形会顺着弯曲的假高度钻出筒体，所以这里改成在筒面上铺一小片
    // **环形光池**（张角铺满 360°、半径 ≈ 筒径的 1.7 倍），并把 z 钳在筒面里侧，
    // 多的顶点压在筒缘上 —— 看上去就是光顺着筒面淌下去、到边沿被切断。
    const dk=typeof o.deck==='function'?o.deck:()=>o.deck;
    const RP=rc*.21,T0=RP*.16;
    for(let j=0;j<=segR;j++){
      const t=j/segR,rr=T0+(RP-T0)*t,rad=(1-t*t)*.95+.05;
      for(let i=0;i<=segS;i++){
        const u=i/segS*2-1,a=D2R(o.yaw+u*180);
        const x=o.x+Math.sin(a)*rr;
        const z=Math.max(-.695,Math.min(.695,o.z+Math.cos(a)*rr));
        put(x,dk(x,z)+TORCH.lift,z,rad);
      }
    }
  }
  T.geo.attributes.position.needsUpdate=true;
  T.geo.attributes.color.needsUpdate=true;
}
function addExplorer(o){
  o.avatar=createExplorer();
  o.scale=o.scale||1;
  o.avatar.scale.setScalar(o.scale);
  o.parent.add(o.avatar);
  o.heading=o.heading||0;
  o.yawTgt=o.heading;o.yaw=o.heading;o.hdg=o.heading;   // 视线朝向 / 身体朝向
  o.pitch=o.pitch||0;o.pitchTgt=o.pitch;                // 当前俯仰 / 输入累积的俯仰
  o.x=o.x||0;o.z=o.z||0;
  o.speed=0;o.phase=Math.PI/2;o.lean=0;
  o.alt=0;o.fly=0;                              // 离地高度 / 离地程度（驱动飞行姿态过渡）
  // 互动层用的状态（见 14c）：fx/fy = 外力（东 / 北，局部单位每秒，由 14c 每帧写、这里消费掉）；
  // air/launchV = 抛射（被岩浆冲走）；burn = 灼烧剩余秒；locked = 穿梭动画中交出控制权；
  // tk = 穿梭时的机位收紧系数（0~1，updateExplorerCam 读）。
  o.fx=0;o.fy=0;o.air=false;o.launchV=0;o.burn=0;o.locked=false;o.tk=0;o.blast=null;
  o.bodyH=1.0*o.scale;                          // 身高（局部单位）
  o.bodyR=OB.bodyK*o.bodyH;                     // 身体半径（横向碰撞用）
  o.shaftD=0;o.shaftR=0;
  o.gnd=o.mode==='sphere'?groundRaw(o,o.lat,o.lon):0;   // 平滑后的地面高度（相对 R）
  o.footR=o.mode==='sphere'?o.R+o.gnd:0;                // 脚底半径（碰撞 / 着陆判定用）
  o.altMax=o.altMax!==undefined?o.altMax:EXPL.altK*o.scale;
  o.camDist=EXPL.camK*o.scale;o.camDist0=o.camDist;
  o.camMin=EXPL.camZoomMin*o.camDist0;o.camMax=EXPL.camZoomMax*o.camDist0;
  o.camAz=o.yaw;
  o.pivotY=EXPL.pivotK*o.scale;
  o.aimLift=0;
  placeExplorer(o);
  o.torch=makeTorch(o);                    // 手电筒：贴地扇形光斑 + 聚光灯
  updateTorch(o,1);
  explorers.push(o);return o;
}
function placeExplorer(o){
  const ud=o.avatar.userData,az=D2R(o.hdg);
  if(o.mode==='sphere'){
    const n=latLonToDir(o.lat,o.lon);
    o.avatar.position.copy(n).multiplyScalar(o.R+o.gnd+o.alt);
    o.footR=o.R+o.gnd+o.alt;
    const up=n.clone().normalize();
    const fwd=tangentNorth(o.lat,o.lon).multiplyScalar(Math.cos(az))
             .addScaledVector(tangentEast(o.lat,o.lon),Math.sin(az)).normalize();
    const rt=new THREE.Vector3().crossVectors(up,fwd).normalize();
    _M4.makeBasis(rt,up,fwd);o.avatar.quaternion.setFromRotationMatrix(_M4);
  }else{
    o.avatar.position.set(o.x,(typeof o.deck==='function'?o.deck(o.x,o.z):o.deck)+o.alt,o.z);
    const up=new THREE.Vector3(0,1,0),fwd=new THREE.Vector3(Math.sin(az),0,Math.cos(az));
    const rt=new THREE.Vector3().crossVectors(up,fwd).normalize();
    _M4.makeBasis(rt,up,fwd);o.avatar.quaternion.setFromRotationMatrix(_M4);
  }
}
function animateExplorer(o,dt,moving,strafe){
  const ud=o.avatar.userData,a=o.fly;            // a: 0 = 站/走在地面，1 = 悬空
  const amp=moving?Math.min(.82,.16+o.speed*.14):0;
  const sw=Math.sin(o.phase)*amp;
  ud.legL.rotation.x=sw*(1-a)-a*.44;             // 悬空：两腿微收
  ud.legR.rotation.x=-sw*(1-a)-a*.30;
  ud.armL.rotation.x=-sw*.7*(1-a)-a*.62;         // 悬空：手臂张开前举，像在控姿
  ud.armR.rotation.x=sw*.7*(1-a)-a*.62;
  ud.armL.rotation.z=.06+a*.40;
  ud.armR.rotation.z=-.06-a*.40;
  ud.rig.position.y=(moving?Math.abs(Math.sin(o.phase))*.026:Math.sin(tAcc*1.45)*.007)
                   +a*Math.sin(tAcc*1.7)*.022;   // 悬空时轻轻起伏
  ud.rig.rotation.x=-(moving?Math.min(.15,o.speed*.028):0)+a*.13;
  o.lean+=(strafe*-.16-o.lean)*ease(7,dt);
  ud.rig.rotation.z=o.lean;
  // 头随光标俯仰一起抬 / 低（局部 +X 为正 = 低头，所以取负号）
  ud.head.rotation.x=(moving?Math.min(.10,o.speed*.02):0)-o.pitch*.5;
}
function updateExplorer(o,dt){
  // ---- 视野 ← 相对位移：光标锁在画面正中，手指往哪边滑、视野就往哪边转 ----
  if(o===activeExp)updateEdgeLook(dt);                        // 指针顶到屏幕边时的续转
  o.yaw+=shortestDeg(o.yaw,o.yawTgt)*ease(EXPL.lookRate,dt);
  o.pitch+=(o.pitchTgt-o.pitch)*ease(EXPL.pitchRate,dt);
  o.camAz=o.yaw;                                            // 机位立刻跟住视野
  o.hdg+=shortestDeg(o.hdg,o.yaw)*ease(EXPL.bodyRate,dt);    // 身体慢一拍拧过来：看得见转身
  // ---- Z / W 前进（沿当前朝向，也就是朝鼠标光标那一侧），S 后退，A / D 侧移 ----
  let mf=((keyState.z||keyState.w)?1:0)-(keyState.s?1:0);
  let ms=(keyState.d?1:0)-(keyState.a?1:0);
  let len=Math.hypot(mf,ms);
  if(o.locked){len=0;mf=0;ms=0}                             // 穿梭动画中：完全交出控制权
  const want=len>0?(keyState.shift?EXPL.run:EXPL.spd):0;
  o.speed+=(want-o.speed)*ease(EXPL.accel,dt);
  let moving=false,strafe=0;
  const dist=o.speed*dt;
  if(len>0){mf/=len;ms/=len;strafe=ms}      // 斜着走不加速：先归一化再按速度走
  if(o.mode==='sphere'){
    // 整颗星球处处可走：陆地、海岸、灰黑色的低地（海底）都是同一套连续地形，
    // 不再用 isLand 当隐形墙 —— 那会在陆地边缘凭空立起一堵看不见的墙。
    // 真需要禁区的星球，才给它 o.block(lat,lon) 返回 true。
    // 地上那些突起物（树桩 / 残骸 / 楼体 / 石林）则由 OB 那张栅格挡住：
    // 一步太长时切成小段走，免得高速奔跑一步跨过一格从道具里穿过去。
    // 注意：这里**不能**给"已经嵌进道具里"开一条后门。曾经试过"嵌住时就只准往外挪"，
    // 结果最近格心距离这个判据被栅格量化骗过去（往旁边偏半格，最近格心就"变远"了），
    // 人反而顺着后门一路把道具穿了过去。现在改成：横向一律严格判定，嵌住时另走
    // 下面那段"往外挤"（见 unstick），两个方向都不放行穿模。
    const out={x:0,y:0};
    const walk=(la,lo)=>{
      if(o.block&&o.block(la,lo))return false;
      if(!o.field)return true;
      return !fieldBlocked(o.field,la,lo,o.footR,o.bodyH,o.bodyR,out);
    };
    const step=(ang,d)=>{
      const q=stepGeo(o.lat,o.lon,ang,d);
      q[0]=Math.max(-89.5,Math.min(89.5,q[0]));
      if(walk(q[0],q[1])){o.lat=q[0];o.lon=q[1];return true}
      return false;
    };
    // 沿某个方位角走 dist：分段步进 + 贴墙滑动 + 方向扫描。
    // 外力（引力 / 冲走 / 击退）和键盘走的是**同一个** goDist，
    // 所以"被吸过去"一样会贴着道具滑，不会从树桩、楼体里穿过去。
    const goDist=(ang,dist)=>{
      if(!(dist>1e-6))return false;
      const segs=Math.max(1,Math.ceil(dist/(o.field?o.field.cell*.5:.5)));
      const one=dist/segs;
      let got=false,stuck=false;
      for(let s=0;s<segs;s++){if(step(ang,one))got=true;else{stuck=true;break}}
      if(stuck){
        // 贴着障碍蹭过去：先按法线把移动投影成切向（最顺），不行再逐个方向试，最后小步靠近。
        let tg=null;
        if(o.field&&fieldBlocked(o.field,o.lat,o.lon,o.footR,o.bodyH,o.bodyR,_hit))
          tg=slideAngle(ang,_hit);
        if(tg!==null&&step(tg,one))got=true;
        if(!got){
          const offs=[-25,25,-50,50,-75,75,-90,90,-115,115,-140,140,180];
          for(let i=0;i<offs.length;i++)if(step(ang+offs[i],one*.7)){got=true;break}
        }
        if(!got)got=step(ang,one*.3);
      }
      return got;
    };
    if(len>0){
      moving=goDist(o.yaw+R2D(Math.atan2(ms,mf)),o.speed*dt);
    }
    // ---- 外力：由互动层（14c）每帧写进 o.fx / o.fy（东、北，局部单位每秒）----
    // 隧道引力、火山岩浆的冲走、外星动物扑上来的顶撞，全部从这里进。
    // 穿梭动画中不放行（o.locked），免得被自己的引力在井底反复踢。
    if(!o.locked){
      const fd=Math.hypot(o.fx,o.fy);
      if(fd>1e-6&&goDist(R2D(Math.atan2(o.fx,o.fy)),fd*dt))moving=true;
    }
    o.fx=0;o.fy=0;
    // 嵌在道具里的兜底（出生点没对准 / 从空中落进楼里 / 道具是后加的）：
    // 连续几帧都出不来，就在附近一圈圈找最近的一个"空格心"挪过去。
    // 只在真的嵌住时才动手，所以不影响正常行走；挪的距离最多两三格，
    // 而且目标是空地，绝不会顺势把道具穿过去。
    if(o.field&&fieldBlocked(o.field,o.lat,o.lon,o.footR,o.bodyH,o.bodyR,_hit)){
      o.emb=(o.emb||0)+1;
      if(o.emb>=2){
        const F2=o.field;
        const i0=Math.floor((o.lat+90)/F2.deg),j0=Math.floor((o.lon+180)/F2.deg);
        let tgt=null;
        for(let r=0;r<=6&&!tgt;r++){
          for(let di=-r;di<=r&&!tgt;di++){
            const i=i0+di;if(i<0||i>=F2.ROWS)continue;
            for(let dj=-r;dj<=r&&!tgt;dj++){
              if(r>0&&Math.max(Math.abs(di),Math.abs(dj))!==r)continue;
              let j=j0+dj;if(j<0)j+=F2.COLS;else if(j>=F2.COLS)j-=F2.COLS;
              const la=F2.latOf(i),lo=F2.lonOf(j);
              if(walk(la,lo))tgt=[la,lo];
            }
          }
        }
        if(tgt){
          let dla=tgt[0]-o.lat,dlo=tgt[1]-o.lon;
          while(dlo>180)dlo-=360;while(dlo<-180)dlo+=360;
          const n=Math.max(Math.abs(dla),Math.abs(dlo))/F2.deg;     // 目标离这儿几格
          const k=Math.min(1,2.5/Math.max(1,n));                    // 一帧最多挪 2.5 格
          o.lat=Math.max(-89.5,Math.min(89.5,o.lat+dla*k));
          const L=o.lon+dlo*k;o.lon=L-360*Math.floor((L+180)/360);
          moving=true;o.emb=0;
        }
      }
    }else o.emb=0;
  }else{
    const az=D2R(o.yaw);
    const dx=(Math.sin(az)*mf+Math.cos(az)*ms)*dist;
    const dz=(Math.cos(az)*mf-Math.sin(az)*ms)*dist;
    const px=o.x+dx,pz=o.z+dz;
    if(o.free(px,pz)){o.x=px;o.z=pz;moving=true;}
    else if(o.free(px,o.z)){if(Math.abs(dx)>1e-5){o.x=px;moving=true;}}
    else if(o.free(o.x,pz)){if(Math.abs(dz)>1e-5){o.z=pz;moving=true;}}
  }
  // ---- 脚下地面：地形 / 井筒剖面 / 可站立的突起顶面，三者取"当前这口气能踩到的最高处" ----
  // 地面不是瞬间跳变的：往下最多按自由落体速度沉、往上快得多。于是走进井口就是一路滑下去，
  // 从道具顶上走下来也是一段自然的下落，而不会"啪"地弹一下。
  if(o.mode==='sphere'){
    const raw=groundRaw(o,o.lat,o.lon);
    const supp=o.field?fieldSupport(o.field,o.lat,o.lon,o.footR,o.bodyH,o.R+raw):0;
    const tgt=supp>0?supp-o.R:raw;
    const down=EXPL.fall*dt,up=OB.climb*dt;
    o.gnd+=Math.max(-down,Math.min(up,tgt-o.gnd));
  }
  // ---- 空格：缓缓上升；一松手就落回地表（落到脚下的地形上，海底也能踩）----
  // 井里另有加成：上升快得多、下沉减半，免得掉进井底只能干等着飞上来。
  // 被外力抛出去时（岩浆冲走 / 冲击波）走另一套：初速 + 重力，落回地面才算数。
  const inShaft=o.shaftD>0;
  const cap=inShaft?Math.max(o.altMax,o.shaftD+3):o.altMax;
  if(o.air){
    o.alt+=o.launchV*dt;
    o.launchV-=EXPL.airG*dt;
    if(o.alt<=0){o.alt=0;o.launchV=0;o.air=false}
  }else if(keyState.space&&!o.locked){
    o.alt=Math.min(cap,o.alt+EXPL.flyUp*(inShaft?2.4:1)*dt);
  }else{
    o.alt=Math.max(0,o.alt-EXPL.fall*(inShaft?.5:1)*dt);
  }
  const air=o.alt>EXPL.airEps;
  o.fly+=((air?1:0)-o.fly)*ease(6,dt);
  if(moving&&!air)o.phase+=o.speed*(keyState.shift?1.30:1.85)*dt;   // 悬空时不再迈步
  else o.phase+=dt*1.35;
  placeExplorer(o);
  animateExplorer(o,dt,moving&&!air,strafe);
  updateTorch(o,dt);
}
// 第三人称跟拍：机位绕小人环绕，方位角 = 视野朝向，仰角由俯仰决定，镜头注视小人胸口。
// 身体（o.hdg）会慢一拍才拧到视野方向，所以转头时先看见他侧过身，随后再站正。
function updateExplorerCam(o,dt){
  const az=D2R(o.camAz);
  const up=new THREE.Vector3(),fwd=new THREE.Vector3();
  if(o.mode==='sphere'){
    up.copy(latLonToDir(o.lat,o.lon)).normalize();
    fwd.copy(tangentNorth(o.lat,o.lon)).multiplyScalar(Math.cos(az))
       .addScaledVector(tangentEast(o.lat,o.lon),Math.sin(az)).normalize();
  }else{
    up.set(0,1,0);fwd.set(Math.sin(az),0,Math.cos(az));
  }
  const lo=o.thMin!==undefined?o.thMin:EXPL.thMin;
  const hi=o.thMax!==undefined?o.thMax:EXPL.thMax;
  const th=Math.max(lo,Math.min(hi,EXPL.orbit0-o.pitch));   // 环绕仰角
  o.parent.updateWorldMatrix(true,false);      // 父级矩阵刷到当帧，避免相机抖一下
  const pivot=o.avatar.position.clone().addScaledVector(up,o.pivotY);
  // 井里空间又窄又深：机位不能再用"绕着小人转"那套 —— 环绕距离一收就钻进人身体里，
  // 画面上只剩井壁（一片灰）。改成沿井轴退到小人**上方**、再往回带一点，俯视他。
  let camLocal;
  if(o.shaftD>0&&o.shaftAxis){
    // o.tk 是"穿梭动画进行到哪一步"（0~1，由 14c 写）：越到后面镜头收得越紧，
    // 于是画面上井壁由远及近扑面而来，再被全屏的琥珀色隧道接住。
    const tk=o.tk||0;
    const ax=o.shaftAxis;
    camLocal=pivot.clone()
      .addScaledVector(ax,Math.max(o.bodyH*1.15,.85)*(1-.62*tk))   // 沿井轴往上退
      .addScaledVector(fwd,-Math.max(o.bodyH*.42,.30)*(1-.35*tk)); // 再稍微往后一点
  }else{
    camLocal=pivot.clone().addScaledVector(up,Math.sin(th)*o.camDist)
                          .addScaledVector(fwd,-Math.cos(th)*o.camDist);
  }
  if(o.shaftD>0&&o.shaftAxis){
    const ax=o.shaftAxis,along=camLocal.dot(ax);
    const rx=camLocal.x-ax.x*along,ry=camLocal.y-ax.y*along,rz=camLocal.z-ax.z*along;
    const rad=Math.hypot(rx,ry,rz),maxR=Math.max(.22,o.shaftR-.16);
    if(rad>maxR){
      const k=maxR/rad;
      camLocal.set(ax.x*along+rx*k,ax.y*along+ry*k,ax.z*along+rz*k);
    }
  }
  o.parent.localToWorld(camLocal);
  camera.position.copy(camLocal);
  camera.up.copy(up).transformDirection(o.parent.matrixWorld).normalize();
  // 抬头看天：机位被地面卡住（th 触到下限）之后，改由抬高注视点把视线继续往上送
  const free=EXPL.orbit0-lo,extra=o.pitch-free;
  o.aimLift=extra>0?Math.sin(th)*o.camDist+Math.cos(th)*o.camDist*Math.tan(Math.min(1.25,extra))*.60:0;
  const aim=pivot.clone().addScaledVector(up,o.aimLift);
  o.parent.localToWorld(aim);
  camera.lookAt(aim);
}

// ======================= 14c. 星系互动：引力井 / 穿星 / 火山 / 外星动物 / 太阳 =======================
// 这一节把死星从"能走能看"变成"有脾气"：
//   ① 两座穿星隧道（地球大炮）各带一圈引力场 —— 越靠近井心拉力越强，进到锁定半径里
//      连 Shift 冲刺也拉不回来，最后被吸进井里一路滑到井底；
//   ② 落到井底 → 4.2 秒穿梭动画 → 从对跖那一端的井底出来；
//   ③ 走近火山就喷发（岩浆 / 碎石 / 烟柱），走远自己停；站在火山口里会被岩浆灼烧、
//      被向上冲走，灼烧期间视野发亮、身上带火；
//   ④ 地表几只外星动物，探险者靠太近就追 —— 跑得比 Shift 冲刺慢，跑得掉；
//   ⑤ 星系里补一颗真太阳：死星自转，任一地表点 2 分钟一轮昼夜（白天亮、夜里暗）。
//
// 关键：这一节新建的所有网格都打了 userData.noCollide，障碍栅格会跳过它们。
// 否则动物会被烘进碰撞表变成一堵会走路的墙，岩浆会被烘成天上掉下来的隐形平台。
// 还有一件容易踩的事：这一节排在"造探险者"之前（底座 → 探险者模块 → 这一节 → 视角/交互），
// 所以 explorers 这时还是空的 —— 凡是"每个探险者一份"的东西都放到首帧惰性建（见 IX.ready）。
const IX_C01=v=>v<0?0:v>1?1:v;
const IX_CL=(v,a,b)=>v<a?a:v>b?b:v;
const IX_T1=new THREE.Vector3(),IX_T2=new THREE.Vector3(),IX_T3=new THREE.Vector3();
const IX_QM=new THREE.Quaternion(),IX_M4=new THREE.Matrix4();
function ixMark(obj){                       // 标"不是实体"：buildField 见到就跳过
  obj.traverse(ob=>{ob.userData.noCollide=true});
  return obj;
}
// 球面上按经纬度摆放（和 placeExplorer 同一套基：局部 +Y = 法线、+Z = 朝向）
function ixPlace(obj,lat,lon,heading,groundY){
  const g=(groundY===undefined?terrainHeight(lat,lon):groundY);
  const up=IX_T1.copy(latLonToDir(lat,lon));
  obj.position.copy(up).multiplyScalar(planetRadius+g);
  const az=D2R(heading);
  const fwd=IX_T2.copy(tangentNorth(lat,lon)).multiplyScalar(Math.cos(az))
           .addScaledVector(tangentEast(lat,lon),Math.sin(az)).normalize();
  const rt=IX_T3.crossVectors(up,fwd).normalize();
  IX_M4.makeBasis(rt,up,fwd);obj.quaternion.setFromRotationMatrix(IX_M4);
}
// 1 局部单位 ≈ 2 米（小人身高 0.75 局部单位 ≈ 1.5 m），HUD 上按米/公里显示
const IX_M=1.8;
function ixDist(d){return d*IX_M<1000?(d*IX_M).toFixed(0)+' m':(d*IX_M/1000).toFixed(1)+' km'}
const IX_ARROW=['↑','↗','→','↘','↓','↙','←','↖'];
function ixArrow(az){return IX_ARROW[Math.round(((az%360)+360)%360/45)%8]}

// ---------------------------------------------------------------- ⑤ 太阳 / 昼夜
const DAY={rate:Math.PI*2/120,f:1,sun:1,t:0,expo:.72};
const SUN_DIR=SUN_POS.clone().normalize();
(function buildSun(){
  const g=new THREE.Group();
  g.position.copy(SUN_DIR).multiplyScalar(690);
  // 核心 + 两层光晕：纯自发光，并关掉雾（不然 690 单位外的指数雾会把它糊掉）
  g.add(new THREE.Mesh(new THREE.SphereGeometry(21,20,14),
    new THREE.MeshBasicMaterial({color:0xfff6e2,fog:false})));
  const halo=(r,c,o)=>g.add(new THREE.Mesh(new THREE.SphereGeometry(r,18,12),
