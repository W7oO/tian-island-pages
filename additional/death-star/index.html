// 每帧：把"当前看的那个人脚下这一点的日照"算出来。星球在自转、太阳方向固定，
// 所以同一个地方会自己走进白天、再走进夜里。
function updateDayNight(dt){
  DAY.t+=dt;
  // 自转放在这里（而不是主循环里），整个昼夜就是"一处自洽的逻辑"：
  // 拖动星球时暂停自转，免得和手感打架。
  if(!dragging)world.rotation.y+=DAY.rate*dt;
  const o=activeExp;
  if(o&&o.mode==='sphere'&&o.parent){
    o.parent.updateWorldMatrix(true,false);
    const nw=IX_T1.copy(latLonToDir(o.lat,o.lon))
      .applyQuaternion(o.parent.getWorldQuaternion(IX_QM)).normalize();
    DAY.sun=IX_CL(nw.dot(SUN_DIR),-1,1);
    DAY.f+=(IX_C01((DAY.sun+.12)/.34)-DAY.f)*ease(1.6,dt);   // 0=夜 1=昼
  }else DAY.f+=(1-DAY.f)*ease(1.6,dt);
  // 沙尘暴会把天遮暗（DAY.dim 由 ⑦ 每帧写）。这是"同一处自洽的逻辑"的下一层：
  // 昼夜决定底色，沙尘暴在底色上再压一层。
  const dm=DAY.dim===undefined?1:DAY.dim;
  sun.intensity=(1.02+.52*DAY.f)*dm;                         // 白天刺眼、夜里只剩星光
  hemi.intensity=(.10+.25*DAY.f)*(0.45+.55*dm);
  fill.intensity=(.05+.15*DAY.f)*dm;
  rim.intensity=(.04+.10*DAY.f)*dm;
}

// ---------------------------------------------------------------- ① 穿星隧道的引力场
// 拉力随"离井心的球面距离"衰减：v(d) = vmax·(1 − d/reach)^exp。
// 关键数字：走路 2.4、Shift 冲刺 5.6（局部单位/秒）。注意 ① 和 ② 是**两段**：
//   ① 远场 v(d)：d=4.4 → 4.60（冲刺能走掉）；d=8 → 2.00（走路顶得住）；d=11 → 0
//   ② 近场"捕获"（capture/hold）：一进井口圈就额外叠一股只向心的硬拉，
//      横向怎么顶都没用，唯一的结果是被拽过井口、落进竖井。
//
// 为什么必须有②：只有①的话，玩家"按住 W 朝前走"会和引力在 d≈3.3 处达成平衡
// （引力向内 6.19、键盘向外 5.6），人被**钉在井沿上**——既进不去（得正对轴心
// 才掉得下去）、又出不来（冲刺顶不过拉力），正是"无法逃离引力场、一直被困住"。
// 实测过：只按①时，玩家能在井沿 2.7 处僵持 15 秒以上。
const GRAV={reach:11,vmax:10,exp:1.7,lock:4.2,inK:.28,
  capture:4.0,      // 捕获半径。必须**小于护墙内径 3.8 附近**：不可挣脱的边界正好落在井口里侧，
                    // 井外（贴着护墙外表面 4.1~5.4）不会形成"顶不动"的死区。
  hold:7,           // 捕获强度：额外叠加的向心力，按 (1-(d/capture)²) 衰减
  holdMax:14,       // 合成后的向内速度上限：12 的时候 0.3 秒就被拽到轴心，太像瞬移
  holdDoc:12.0,     // 一直叠到快贴井底（capD-2）为止——否则人会在检修平台环上停住
  grace:4.0,        // 余压弹出后这几秒内完全不施力，防止"弹出→又被吸回→再穿梭"死循环
  graceT:0};
function shaftPull(o){                       // → {ang,v,d,sh,i,lock} 或 null
  if(!o.shafts)return null;
  let best=null;
  for(let i=0;i<o.shafts.length;i++){
    const sh=o.shafts[i];
    const d=D2R(angDistDeg(o.lat,o.lon,sh.lat,sh.lon))*o.R;
    if(d>=GRAV.reach)continue;
    const v=GRAV.vmax*Math.pow(IX_C01(1-d/GRAV.reach),GRAV.exp);
    if(!best||v>best.v)best={v,d,sh,i,ang:geoAz(o.lat,o.lon,sh.lat,sh.lon),lock:d<GRAV.lock};
  }
  return best;
}
// 井口那一圈挡墙（collar + 土堤环）只留了一个 66° 的豁口，正对地面加速导轨。
// 豁口在模型里是固定的，但落到经纬度上不好硬算，所以直接拿碰撞场扫出来：
// 从井心朝 72 个方位各推一条射线，看哪条能一路通到门外——那条就是门。
// （延迟到第一次穿梭时才调用：F_EARTH 在 views 段才建，提前调会撞上 TDZ。）
function shaftDoor(sh){
  if(sh._door!==undefined)return sh._door;
  const runOf=a=>{
    let run=0;
    for(let d=1.2;d<=9.0;d+=.3){
      const q=stepGeo(sh.lat,sh.lon,a,d);
      const g=terrainHeight(q[0],q[1]);
      if(fieldBlocked(F_EARTH,q[0],q[1],planetRadius+g,OB.bodyH,OB.bodyR))return 0;
      run=d;
    }
    return run;
  };
  let best=0,bestRun=-1;
  try{
    for(let a=0;a<360;a+=5){const r=runOf(a);if(r>bestRun){bestRun=r;best=a}}
    if(bestRun>0)for(let a=best-5;a<=best+5;a+=1){      // 再按 1° 细扫一遍，把门心找准
      const r=runOf(a);if(r>bestRun){bestRun=r;best=a}
    }
  }catch(e){IX.err=e;bestRun=-1}
  best=((best%360)+360)%360;
  if(bestRun<3.2)best=0;                 // 扫不出来就退回"正北"，反正还有兜底
  sh._door=best;sh._doorRun=bestRun;
  return best;
}
// ---------------------------------------------------------------- ①b 井底余压（穿梭的出口）
// 要求②说"穿梭到另一端的隧道底部"，所以动画的落点仍然是井底。但井底是个四壁陡峭、
// 四周还被护圈挡墙围死（只有 66° 豁口）的漏斗：走路 2.4 顶不住井外 5.2 的拉力，
// 于是"被吸进去 → 穿梭 → 站在对面井底走不出去"就成了一间单向鼠笼。
// 补上这一节：落到井底那一刻，隧道的余压把人从井里顶上井口、顺豁口甩到门外，
// 闭环变成"吸进去 → 穿梭 → 弹出来"。同时兜底保证结束后一定在引力圈外。
const VENT={t:0,dur:3.4,up:17.0,v:8.2,arm:.9,o:null,sh:null,ang:0,safe:0};
function ventDist(o,sh){return D2R(angDistDeg(o.lat,o.lon,sh.lat,sh.lon))*o.R}
function startVent(o){
  const list=o.shafts||[];
  let sh=null;
  if(list.length){
    const idx=(o.shaftIdx!=null&&list[o.shaftIdx])?o.shaftIdx:
      ((TRANSIT.from+1)%list.length+list.length)%list.length;
    sh=list[idx];
  }
  VENT.t=VENT.dur;VENT.o=o;VENT.sh=sh;VENT.safe=0;
  VENT.ang=sh?shaftDoor(sh):0;
  o.locked=false;o.air=true;o.launchV=VENT.up;
  o.blast=null;o.speed=0;o.emb=0;o.fx=0;o.fy=0;
  IX.shake=Math.max(IX.shake,.15);
}
function updateVent(o,dt){
  if(VENT.t<=0)return;
  VENT.t-=dt;
  if(VENT.o!==o){                                // 中途切走了视角：只倒数，别把力写到别人身上
    if(VENT.t<=0){VENT.o=null;VENT.sh=null}
    return;
  }
  const u=IX_C01(VENT.t/VENT.dur);
  // 刚离底时只顾着往上冲，等高过井口（alt 追上井深）才给侧向推力，
  // 否则会在锥形井壁里横顶，一路蹭着墙上去。
  const deep=o.shaftD>.01?o.shaftD:0;
  const out=deep>0?IX_C01((o.alt-(deep-1.2))/VENT.arm):1;
  const w=(.30+.70*u)*out;
  if(w>0){
    o.fx+=Math.sin(D2R(VENT.ang))*VENT.v*w;
    o.fy+=Math.cos(D2R(VENT.ang))*VENT.v*w;
  }
  if(out>0)VENT.safe=1;
  if(VENT.t<=0){
    // 兜底：不管玩家怎么往回顶，落地时必须已经**出引力圈**。
    // 落点直接放到 reach+1.4（拉力为 0），否则站在原地不动二十来秒又会被慢慢拖回去，
    // 变成"弹出→吸回→再穿梭"的循环，玩家还是会觉得"被困住"。
    const sh=VENT.sh;
    if(sh&&o.mode==='sphere'&&o.parent===world){
      const d=ventDist(o,sh);
      if(d<GRAV.reach*0.9){
        const q=stepGeo(sh.lat,sh.lon,VENT.ang,GRAV.reach+1.4);
        o.lat=q[0];o.lon=q[1];
        o.gnd=groundRaw(o,o.lat,o.lon);o.footR=o.R+o.gnd;
        o.air=false;o.launchV=0;o.alt=0;o.fx=0;o.fy=0;
        o.emb=0;o.burn=0;o.blast=null;
        placeExplorer(o);
      }
    }
    VENT.o=null;VENT.sh=null;
    GRAV.graceT=GRAV.grace;      // 给玩家几秒自由时间，别刚弹出又被吸回去
  }
}
// 井口视觉：贴着地形的一圈"被吸进去的尘埃"。引力场本身看不见，就靠这圈尘埃把吸力画出来：
// 越靠内转速越快、越亮，到井口边缘就消失（然后从外圈重生）。位置每帧用 stepGeo 算，
// 所以完全贴合起伏的地表。
const VORTEX=[];
function buildVortex(sh,idx){
  const N=120;
  const pos=new Float32Array(N*3),col=new Float32Array(N*3),st=new Float32Array(N*2);
  for(let i=0;i<N;i++){st[i*2]=2.4+Math.pow(Math.random(),.7)*(GRAV.reach-2.6);
    st[i*2+1]=Math.random()*360}
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:.135,vertexColors:true,transparent:true,
    opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  const pts=new THREE.Points(geo,mat);
  pts.frustumCulled=false;pts.renderOrder=3;

}
function updateVortex(dt){
  const o=activeExp;
  for(let k=0;k<VORTEX.length;k++){
    const V=VORTEX[k],sh=V.sh,st=V.st,pos=V.pos,col=V.col;
    for(let i=0;i<V.N;i++){
      let d=st[i*2],a=st[i*2+1];
      const k2=IX_C01(1-d/GRAV.reach);
      d-=GRAV.vmax*Math.pow(k2,GRAV.exp)*dt*1.05;         // 越近拉得越快
      a+=(90+520*k2*k2)*dt;                               // 越近转得越快
      if(d<2.15){d=GRAV.reach;a=Math.random()*360}        // 被吞掉 → 从外圈重生
      st[i*2]=d;st[i*2+1]=a;
      const p=stepGeo(sh.lat,sh.lon,a,d),dir=latLonToDir(p[0],p[1]);
      const h=planetRadius+terrainHeight(p[0],p[1])+.10+.55*Math.pow(k2,2.2);
      pos[i*3]=dir.x*h;pos[i*3+1]=dir.y*h;pos[i*3+2]=dir.z*h;
      const w=IX_C01(k2*k2*2.6);
      col[i*3]=.30*w;col[i*3+1]=.56*w;col[i*3+2]=1.0*w;   // 冷白偏蓝：和暖黄的手电筒区分开
    }
    V.geo.attributes.position.needsUpdate=true;
    V.geo.attributes.color.needsUpdate=true;
    if(o){
      const dd=D2R(angDistDeg(o.lat,o.lon,sh.lat,sh.lon))*planetRadius;
      V.mat.opacity=.94*IX_C01((GRAV.reach*1.9-dd)/(GRAV.reach*1.1));
    }
  }
}

// ---------------------------------------------------------------- ② 井底 → 对跖井底 穿梭
const TRANSIT={on:false,t:0,dur:4.2,from:0,k:0,cool:0,armed:true,mid:.42,moved:false};
// HUD / 叠加层：整块放在 try 里 —— 无头桩环境里 document 是假的，拿不到真节点就直接放弃

function ixSet(k,v){
  const U=IX_UI;if(!U)return;

}
function startTransit(o,from){
  if(TRANSIT.on||TRANSIT.cool>0)return;
  TRANSIT.on=true;TRANSIT.t=0;TRANSIT.from=from|0;TRANSIT.k=0;
  TRANSIT.moved=false;TRANSIT.cool=1.6;TRANSIT.armed=false;
  o.locked=true;o.fx=0;o.fy=0;o.air=false;o.launchV=0;o.alt=0;o.speed=0;
  o.blast=null;o.burn=0;
  if(IX_UI){IX_UI.tr.style.opacity='0';IX_UI.flash.style.opacity='0'}
}
function updateTransit(o,dt){
  if(TRANSIT.cool>0)TRANSIT.cool=Math.max(0,TRANSIT.cool-dt);
  if(!TRANSIT.on)return;
  TRANSIT.t+=dt;
  const u=TRANSIT.t/TRANSIT.dur;
  if(u<.20){                                   // 沉入井底：镜头收紧
    TRANSIT.k=u/.20;
    if(IX_UI)IX_UI.tr.style.opacity=(u/.20*.22).toFixed(3);
  }else if(u<.72){                             // 全屏穿行
    TRANSIT.k=1;
    const s=(u-.20)/.52;
    if(IX_UI){
      IX_UI.tr.style.opacity='1';
      IX_UI.stk.style.transform='rotate('+(s*s*780).toFixed(1)+'deg) scale('
        +(1.05+.55*Math.sin(s*3.1)).toFixed(3)+')';
    }
    if(!TRANSIT.moved&&s>TRANSIT.mid){         // 中点：把状态挪到对跖井底
      TRANSIT.moved=true;
      const sh=o.shafts[(TRANSIT.from+1)%o.shafts.length];
      o.lat=sh.lat;o.lon=sh.lon;
      o.gnd=groundRaw(o,o.lat,o.lon);o.footR=o.R+o.gnd;
      if(IX_UI)IX_UI.flash.style.opacity='1';
    }
  }else{                                       // 另一端浮出
    const s=(u-.72)/.28;

      IX_UI.flash.style.opacity=(Math.max(0,1-s*3)).toFixed(3);

      if(IX_UI){IX_UI.tr.style.opacity='0';IX_UI.flash.style.opacity='0'}
      startVent(o);                            // 落底 → 余压把人在井里顶出来（见 VENT）
    }

}

function stepEruption(v,dt,near){
  // 靠近就喷、走远就歇（带迟滞，免得站在边界上抖）
  const trig=v.craterR*2.0+3.0;
  const want=(near<trig*VOLC.onK)?1:((near>trig*VOLC.offK)?0:v.e);
  if(want>v.e)v.e=Math.min(want,v.e+VOLC.rise*dt);
  else v.e=Math.max(want,v.e-VOLC.fall*dt);
  const e=v.e;
  v.light.intensity=2.6*e*e;
  v.pool.material.opacity=.72*e;
  v.smat.emissiveIntensity=1.1*e;
  if(v.plume)v.plume.points.material.opacity=.12+.42*e;
  const show=e>.02;
  v.lava.visible=show;
  v.smoke[0].m.visible=show;v.smoke[1].m.visible=show;
  if(!show){
    for(const m of v.stones)m.visible=false;
    return;
  }
  // ---- 岩浆 ----
  const lp=v.lp,lc=v.lc,floor=v.rawH*.92;
  for(let i=0;i<v.pd.length;i++){
    const p=v.pd[i];
    if(p.land>0){                       // 落地：熄成一颗余烬再淡出
      p.land-=dt;
      const k=IX_C01(p.land/2.6)*e;
      if(p.land<=0)v.spawnLava(p);
      lc[i*3]=GLOW_LAVA[0]*k;lc[i*3+1]=GLOW_LAVA[1]*k*k;lc[i*3+2]=GLOW_LAVA[2]*k*k*k;
      continue;
    }
    p.vy-=7.5*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    if(p.y<=floor){p.y=floor;p.land=2.6}
    const k=IX_C01(.35+p.vy*.16);       // 初速大 = 明亮黄白，快落地 = 暗红
    lc[i*3]=GLOW_LAVA[0]*(.45+.55*k);lc[i*3+1]=GLOW_LAVA[1]*k;lc[i*3+2]=GLOW_LAVA[2]*k*k;
    if(p.y>v.rawH*6.5||Math.abs(p.x)>v.rawBaseR*3.2)v.spawnLava(p);
  }
  v.lG.attributes.position.needsUpdate=true;
  v.lG.attributes.color.needsUpdate=true;
  // ---- 碎石 ----
  for(let i=0;i<v.sd.length;i++){
    const p=v.sd[i],m=v.stones[i];
    if(p.land>0){p.land-=dt}
    else{
      p.vy-=6.6*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
      p.ry+=dt*3.4;p.rx+=dt*2.1;
      if(p.y<=floor){p.y=floor;p.land=2.2}
      if(p.y>v.rawH*7||Math.abs(p.x)>v.rawBaseR*3.4)v.spawnStone(p);
    }
    m.position.set(p.x,p.y,p.z);m.rotation.set(p.rx,p.ry,0);
    m.visible=true;
  }
  // ---- 烟 ----
  for(let L=0;L<2;L++){
    const S=v.smoke[L],sp=S.p,sc=S.c;
    for(let i=0;i<S.n;i++){
      const d=S.d[i];
      d.t+=dt;
      if(d.t>d.life){
        const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*v.rawCraterR*.8;
        d.x=Math.cos(a)*r;d.z=Math.sin(a)*r;d.y=v.rawH*(.95+Math.random()*.2);
        d.t=0;d.life=4.5+Math.random()*3.5;
        const b=Math.random()*Math.PI*2;
        d.vx=Math.cos(b)*.35;d.vz=Math.sin(b)*.35;d.vy=.55+Math.random()*1.15;
      }
      const g=dt*(.35+1.5*e);
      d.x+=d.vx*g;d.y+=d.vy*g;d.z+=d.vz*g;
      d.vx*=1-.35*dt;d.vz*=1-.35*dt;d.vy*=1-.12*dt;
      const f=IX_C01(d.t/Math.max(.001,d.life));
      const aa=(.16+.72*e)*(1-f)*(1-f);
      sp[i*3]=d.x;sp[i*3+1]=d.y;sp[i*3+2]=d.z;
      sc[i*3]=GLOW_SMOKE[0]*aa;sc[i*3+1]=GLOW_SMOKE[1]*aa*(1-.12*f);
      sc[i*3+2]=GLOW_SMOKE[2]*aa*(1-.1*f);
    }
    S.g.attributes.position.needsUpdate=true;
    S.g.attributes.color.needsUpdate=true;
    S.m.material.opacity=.55*e;
  }
}
// 站在火山口里 → 灼烧 + 被岩浆冲走
const BURN_T=7.0;
function volcanoTouch(o,dt){
  for(const v of volcanoes){
    if(v.e<.35)continue;
    const d=D2R(angDistDeg(o.lat,o.lon,v.lat,v.lon))*o.R;
    if(d>v.craterR*1.12)continue;
    if(o.alt>1.1)continue;                                   // 飞在火山口上方不算
    o.burn=BURN_T;o.burnFlick=1;
    if(!o.air||o.launchV<2.2){o.air=true;o.launchV=6.6}      // 向上冲走
    o.blast={t:.7,ang:geoAz(v.lat,v.lon,o.lat,o.lon),v:3.4}; // 同时被往外甩
  }
}

// ---------------------------------------------------------------- ④ 外星动物
const ANIMALS=[];

function makeAlien(){

function buildAnimals(){
  for(let i=0;i<ALIEN.spots.length;i++){
    const sp=ALIEN.spots[i],sc=(.92+Math.random()*.26)*surfacePropScale*1.25;
    const g=makeAlien();g.scale.setScalar(sc);ixMark(g);world.add(g);

      phase:Math.random()*6.283,spd:0,g:g,sc:sc,run:ALIEN.run*(.90+Math.random()*.22),
      state:'idle',t:Math.random()*3,lost:0,recoil:0,recoilAng:0,recoilSpd:0,snap:0};
    rec.yaw=rec.hdg;

function animalMove(a,ang,dist){
  const q=stepGeo(a.lat,a.lon,ang,dist);
  q[0]=IX_CL(q[0],-89.5,89.5);
  const g=terrainHeight(q[0],q[1]);
  if(fieldBlocked(F_EARTH,q[0],q[1],planetRadius+g,ALIEN.bodyH*a.sc,
    ALIEN.bodyR*a.sc,null))return false;
  a.lat=q[0];a.lon=q[1];return true;
}
function updateAnimals(dt){
  const o=activeExp;
  const ref=(o&&o.mode==='sphere'&&o.parent===world)?o:null;
  let near=1e9,count=0;
  for(const a of ANIMALS){
    let d=1e9,az=0;
    if(ref){d=D2R(angDistDeg(a.lat,a.lon,ref.lat,ref.lon))*planetRadius;
      az=geoAz(a.lat,a.lon,ref.lat,ref.lon)}
    if(d<ALIEN.lose)count++;
    if(d<near)near=d;
    if(a.recoil>0){                            // 被冲击波震退
      a.recoil-=dt;
      if(!animalMove(a,a.recoilAng,a.recoilSpd*dt))a.recoil*=.4;
    }else if(ref&&d<ALIEN.aggro){
      a.state='hunt';a.lost=0;
    }else if(a.state==='hunt'){
      a.lost+=dt;
      if(a.lost>2.2||d>ALIEN.lose){a.state='idle';a.t=0}
    }
    if(a.recoil<=0){
      let tgt;
      if(a.state==='hunt'&&ref){
        tgt=az;a.spd+=(a.run-a.spd)*ease(3.2,dt);
        if(d<1.5)a.snap=Math.min(1,a.snap+dt*4);else a.snap=Math.max(0,a.snap-dt*3);
      }else{
        a.t-=dt;
        if(a.t<=0){a.t=1.8+Math.random()*3.4;a.hdg+=(Math.random()-.5)*190}
        tgt=a.hdg;a.spd+=(ALIEN.walk-a.spd)*ease(2.4,dt);a.snap=Math.max(0,a.snap-dt*3);
      }
      a.yaw+=shortestDeg(a.yaw,tgt)*ease(a.state==='hunt'?6:2.2,dt);
      const step=a.spd*dt;
      if(!animalMove(a,a.yaw,step)){           // 被道具挡住 → 顺着切向蹭
        if(!animalMove(a,a.yaw+35,step*.6))animalMove(a,a.yaw-35,step*.6);
      }
      a.phase+=a.spd*(a.state==='hunt'?3.5:2.2)*dt;
    }
    ixPlace(a.g,a.lat,a.lon,a.yaw);
    const ud=a.g.userData;
    const amp=Math.min(.95,.25+a.spd*.18);
    ud.legs[0].rotation.x=Math.sin(a.phase)*amp;
    ud.legs[3].rotation.x=Math.sin(a.phase)*amp;
    ud.legs[1].rotation.x=-Math.sin(a.phase)*amp;
    ud.legs[2].rotation.x=-Math.sin(a.phase)*amp;
    const bob=Math.abs(Math.sin(a.phase))*.035*amp;
    ud.body.position.y=.58+bob;ud.hump.position.y=.72+bob;
    ud.head.position.y=.60+bob;ud.head.rotation.x=-a.snap*.5;
    ud.jaw.rotation.x=a.snap*.85;
    ud.tail.rotation.y=Math.sin(a.phase*.6)*.28;
    // 夜里生物荧光更亮（"活物"的昼夜线索）
    ud.glowM.emissiveIntensity=.30+1.55*(1-DAY.f)+(a.state==='hunt'?.75:0);
    // 扑上来时轻轻把人顶一下，有"被撞到"的实感
    if(ref&&a.snap>.6&&d<1.35){
      const push=D2R(geoAz(a.lat,a.lon,ref.lat,ref.lon));
      ref.fx+=Math.sin(push)*1.7;ref.fy+=Math.cos(push)*1.7;
    }
  }
  IX.bioCount=count;IX.bioNear=near;
}

// ---------------------------------------------------------------- Q：脉冲冲击波（多出来的一件互动）
// 给被追的人一个反制手段：一圈膨胀的球壳 + 把附近的外星动物震退。
const PULSE={cd:0,cool:5.0,r:5.2};
const PULSES=[];
function buildPulse(o){
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,22,14),
    new THREE.MeshBasicMaterial({color:0xcfe6ff,transparent:true,opacity:0,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false}));
  m.visible=false;ixMark(m);world.add(m);
  const rec={m,t:-1,o};PULSES.push(rec);return rec;
}
function firePulse(o){
  if(!o||o.mode!=='sphere'||PULSE.cd>0||!o.pulse)return false;
  PULSE.cd=PULSE.cool;
  o.pulse.t=0;
  for(const a of ANIMALS){
    const d=D2R(angDistDeg(a.lat,a.lon,o.lat,o.lon))*planetRadius;
    if(d>PULSE.r)continue;
    a.recoil=.85;a.recoilAng=geoAz(o.lat,o.lon,a.lat,a.lon);
    a.recoilSpd=7.2*(1-d/PULSE.r)+2.2;
    a.state='idle';a.t=1.5;
  }
  IX.shake=Math.max(IX.shake,.09);
  return true;
}
function updatePulses(dt){
  if(PULSE.cd>0)PULSE.cd=Math.max(0,PULSE.cd-dt);
  for(const rec of PULSES){
    if(rec.t<0)continue;
    rec.t+=dt;
    const u=rec.t/.78;
    if(u>=1){rec.t=-1;rec.m.visible=false;continue}
    const o=rec.o;
    IX_T1.copy(latLonToDir(o.lat,o.lon)).multiplyScalar(o.R+o.gnd+o.alt);
    rec.m.position.copy(IX_T1);
    rec.m.scale.setScalar(Math.max(.2,PULSE.r*Math.pow(u,.55)));
    rec.m.material.opacity=.42*(1-u)*(1-u);
    rec.m.visible=true;
  }
}

const FLAMES=[];

}
function updateFlames(dt){
  const now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  for(const F of FLAMES){
    const o=F.o,k=IX_C01(o.burn/BURN_T),on=k>0;
    F.m.visible=on||IX_C01(o.burnFlick||0)>0;
    F.light.intensity=on?1.6*(.6+.4*Math.sin(now*.02)):0;
    if(!F.m.visible)continue;
    const pos=F.pos,col=F.col;
    for(let i=0;i<F.N;i++){
      const d=F.d[i];
      d.t+=dt;
      if(d.t>d.life){
        d.t=0;d.life=.32+Math.random()*.44;
        const a=Math.random()*Math.PI*2,r=.06+Math.random()*.19;
        d.x=Math.cos(a)*r;d.z=Math.sin(a)*r;d.y=Math.random()*.30;
        d.vy=.55+Math.random()*1.0;
      }
      d.y+=d.vy*dt;d.x*=1-.9*dt;d.z*=1-.9*dt;
      const f=1-d.t/Math.max(.001,d.life);
      pos[i*3]=d.x;pos[i*3+1]=d.y;pos[i*3+2]=d.z;
      const w=f*f*(on?1:0);
      col[i*3]=1.0*w;col[i*3+1]=.42*w*w;col[i*3+2]=.08*w*w*w;
    }
    F.geo.attributes.position.needsUpdate=true;
    F.geo.attributes.color.needsUpdate=true;
  }
}

const MET_CFG={nearR:22,blastR:9.5,minGap:24,maxGap:46};
// 焦痕：一圈同心环，**逐顶点贴到真实地形上**（球面上平圆盘会沉进地里），
// 颜色写进顶点色：中心炭黑 → 暗红 → 最外一圈仍在发红的翻土边。
// 用不带光照的顶点色材质，白天被太阳照亮、夜里漆黑，都能看清这枚疤。
const MET_SCAR_RINGS=[0,.34,.60,.80,.93,1.02];
// 顶点色按"线性值→屏幕 sRGB"抬亮过，数值要压得很低，屏幕上才是黑炭
const MET_SCAR_COL=[[.004,.003,.002],[.010,.006,.004],[.030,.013,.007],
                    [.16,.055,.015],[1.0,.42,.10]];
function metScarGeo(la,lo,rad){
  const SEG=26,n=MET_SCAR_RINGS.length;
  const pos=new Float32Array(n*SEG*3),col=new Float32Array(n*SEG*3),idx=[];
  for(let r=0;r<n;r++){
    const t=MET_SCAR_RINGS[r],rr=t*rad;
    const c=MET_SCAR_COL[Math.min(r,MET_SCAR_COL.length-1)];
    for(let i=0;i<SEG;i++){
      const q=stepGeo(la,lo,i/SEG*360,rr);
      const d=latLonToDir(q[0],q[1]);
      const h=planetRadius+terrainHeight(q[0],q[1])+.075;   // 抬 0.075 防止被地形面片切进去
      const k=(r*SEG+i)*3;
      pos[k]=d.x*h;pos[k+1]=d.y*h;pos[k+2]=d.z*h;
      col[k]=c[0];col[k+1]=c[1];col[k+2]=c[2];
    }
  }
  for(let r=0;r<n-1;r++)for(let i=0;i<SEG;i++){
    const i2=(i+1)%SEG,ra=r*SEG,rb=(r+1)*SEG;
    idx.push(ra+i,ra+i2,rb+i, ra+i2,rb+i2,rb+i);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setIndex(idx);g.computeVertexNormals();
  return g;
}
function metScar(la,lo,rad){
  const mesh=new THREE.Mesh(metScarGeo(la,lo,rad),
    new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:.92,
      depthWrite:false,side:THREE.DoubleSide}));
  ixMark(mesh);world.add(mesh);           // 顶点已是 world 局部坐标 → 挂在原点即可
  const rec={g:mesh,m:mesh.material,t:0,life:26};
  MET.scars.push(rec);
  while(MET.scars.length>7){
    const old=MET.scars.shift();
    world.remove(old.g);old.m.dispose();old.g.geometry.dispose();
  }
  return rec;
}
// 一颗流星：核心 + 光晕 + 26 点尾迹 + 落地后抛射的尘埃
function spawnMeteor(o){
  let la,lo;
  if(o&&o.mode==='sphere'&&Math.random()<.68){     // 偏爱落在探险者附近，看得见才好看
    const q=stepGeo(o.lat,o.lon,Math.random()*360,3.5+Math.random()*(MET_CFG.nearR-3.5));
    la=q[0];lo=q[1];
  }else{la=(Math.random()*2-1)*78;lo=Math.random()*360-180}
  const dir=latLonToDir(la,lo);
  const to=dir.clone().multiplyScalar(planetRadius+terrainHeight(la,lo));
  const east=tangentEast(la,lo),north=tangentNorth(la,lo),a=Math.random()*Math.PI*2;
  const side=east.clone().multiplyScalar(Math.cos(a)).addScaledVector(north,Math.sin(a));
  const from=dir.clone().multiplyScalar(planetRadius+118)
    .addScaledVector(side,34+Math.random()*46).addScaledVector(east,(Math.random()-.5)*30);
  const v=to.clone().sub(from).normalize().multiplyScalar(46+Math.random()*22);
  const grp=new THREE.Group();
  grp.add(new THREE.Mesh(MET_GEO_C,MET_MAT_C));
  grp.add(new THREE.Mesh(MET_GEO_G,MET_MAT_G));
  grp.position.copy(from);grp.frustumCulled=false;
  ixMark(grp);world.add(grp);
  const tp=new Float32Array(MET_TN*3),tc=new Float32Array(MET_TN*3);
  for(let i=0;i<MET_TN;i++){
    tp[i*3]=from.x;tp[i*3+1]=from.y;tp[i*3+2]=from.z;
    const w=1-i/MET_TN;tc[i*3]=1.0*w;tc[i*3+1]=.62*w*w;tc[i*3+2]=.22*w*w*w;
  }
  const tg=new THREE.BufferGeometry();
  tg.setAttribute('position',new THREE.BufferAttribute(tp,3));
  tg.setAttribute('color',new THREE.BufferAttribute(tc,3));
  const trail=new THREE.Points(tg,new THREE.PointsMaterial({size:.30,vertexColors:true,
    transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,
    sizeAttenuation:true}));
  trail.frustumCulled=false;ixMark(trail);world.add(trail);
  const dp=new Float32Array(MET_DEB_N*3),dc=new Float32Array(MET_DEB_N*3),dd=[];
  for(let i=0;i<MET_DEB_N;i++)dd.push({x:0,y:0,z:0,vx:0,vy:0,vz:0,t:0,life:1});
  const dg=new THREE.BufferGeometry();
  dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
  dg.setAttribute('color',new THREE.BufferAttribute(dc,3));
  const deb=new THREE.Points(dg,new THREE.PointsMaterial({size:.16,vertexColors:true,
    transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false,
    sizeAttenuation:true}));
  deb.frustumCulled=false;deb.visible=false;ixMark(deb);world.add(deb);
  const rec={grp,trail,deb,from,to,v,dir,east,north,la,lo,
    tp,tg,dp,dc,dg,dd,life:0,light:null,lightT:-1,landed:false,dead:false};
  MET.list.push(rec);MET.warn=1.6;MET.count++;
  return rec;
}
function metImpact(M){
  MET.flash=1;
  const q=explorers.find(e=>e.mode==='sphere'&&e.parent===world);
  let near=1e9;
  if(q)near=D2R(angDistDeg(q.lat,q.lon,M.la,M.lo))*q.R;
  IX.shake=Math.max(IX.shake,Math.max(.12,.42*(1-near/34)));
  const light=new THREE.PointLight(0xffc070,0,30,2);
  light.position.copy(M.to);ixMark(light);world.add(light);
  M.light=light;M.lightT=.85;
  metScar(M.la,M.lo,1.15+Math.random()*.9);
  for(let i=0;i<MET_DEB_N;i++){
    const d=M.dd[i],b=Math.random()*Math.PI*2,sp=1.4+Math.random()*4.6;
    d.x=0;d.y=0;d.z=0;
    d.vx=Math.cos(b)*sp;d.vy=3.2+Math.random()*5.4;d.vz=Math.sin(b)*sp;
    d.t=0;d.life=1.5+Math.random()*1.6;
  }
  M.deb.visible=true;
  for(const o of explorers){
    if(o.mode!=='sphere'||o.parent!==world)continue;
    const d=D2R(angDistDeg(o.lat,o.lon,M.la,M.lo))*o.R;
    if(d>MET_CFG.blastR)continue;
    const k=1-d/MET_CFG.blastR;
    o.burn=Math.max(o.burn,BURN_T*Math.min(1,k*1.5));      // 太近也会被燎到
    o.burnFlick=1;
    o.air=true;o.launchV=Math.max(o.launchV,3.2+6.4*k);
    o.blast={t:.8,ang:geoAz(M.la,M.lo,o.lat,o.lon),v:3.0+3.0*k};
  }
  MET.lastLL=[M.la,M.lo];
}
function updateMeteors(dt,o){
  MET.next-=dt;
  if(MET.next<=0){
    MET.next=MET_CFG.minGap+Math.random()*(MET_CFG.maxGap-MET_CFG.minGap);
    const n=1+(Math.random()<.34?1:0)+(Math.random()<.12?1:0);
    for(let i=0;i<n;i++)ixLater(()=>spawnMeteor(activeExp),i*(.15+Math.random()*.35));
  }
  if(MET.warn>0)MET.warn=Math.max(0,MET.warn-dt);
  if(MET.flash>0)MET.flash=Math.max(0,MET.flash-dt*2.4);
  for(let i=MET.list.length-1;i>=0;i--){
    const M=MET.list[i];
    if(!M.landed){
      M.life+=dt;
      const step=M.v.length()*dt;
      M.grp.position.addScaledVector(M.v,dt);
      const rem=M.to.distanceTo(M.grp.position);
      M.landed=(rem<=step||rem>M.to.distanceTo(M.from)||M.life>7);
      const tp=M.tp;
      for(let k=MET_TN-1;k>0;k--){
        tp[k*3]=tp[(k-1)*3];tp[k*3+1]=tp[(k-1)*3+1];tp[k*3+2]=tp[(k-1)*3+2];
      }
      tp[0]=M.grp.position.x;tp[1]=M.grp.position.y;tp[2]=M.grp.position.z;
      M.tg.attributes.position.needsUpdate=true;
      if(M.landed){
        M.grp.position.copy(M.to);
        M.grp.visible=false;M.trail.visible=false;
        metImpact(M);
      }
    }
    if(M.lightT>=0){
      M.lightT-=dt;
      M.light.intensity=M.lightT>0?26*M.lightT*M.lightT:0;
      if(M.lightT<=0){world.remove(M.light);M.light=null}
    }
    if(M.deb.visible){
      let alive=0;
      for(let k=0;k<MET_DEB_N;k++){
        const d=M.dd[k];
        d.t+=dt;
        if(d.t<d.life){
          alive++;
          d.vy-=9.5*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.z+=d.vz*dt;
          if(d.y<0){d.y=0;d.vy*=-.32;d.vx*=.6;d.vz*=.6}
        }
        const f=Math.max(0,1-d.t/Math.max(.001,d.life)),w=f*f;
        const t0=M.to,e=M.east,n=M.north,u=M.dir;
        M.dp[k*3]  =t0.x+e.x*d.x+n.x*d.z+u.x*d.y;
        M.dp[k*3+1]=t0.y+e.y*d.x+n.y*d.z+u.y*d.y;
        M.dp[k*3+2]=t0.z+e.z*d.x+n.z*d.z+u.z*d.y;
        M.dc[k*3]=1.0*w;M.dc[k*3+1]=.66*w*w;M.dc[k*3+2]=.28*w*w*w;
      }
      M.dg.attributes.position.needsUpdate=true;
      M.dg.attributes.color.needsUpdate=true;
      if(!alive)M.deb.visible=false;
    }
    if(M.landed&&M.lightT<0&&!M.deb.visible){
      world.remove(M.deb);M.dg.dispose();M.tg.dispose();
      MET.list.splice(i,1);
    }
  }
  for(let i=MET.scars.length-1;i>=0;i--){
    const s=MET.scars[i];
    s.t+=dt;
    const f=Math.max(0,1-s.t/s.life);
    s.m.opacity=.92*Math.min(1,f*1.6);        // 前 60% 生命保持浓重，最后才淡掉
    if(f<=0){world.remove(s.g);s.m.dispose();s.g.geometry.dispose();MET.scars.splice(i,1)}
  }
}
// 极简"延时调用"：只在 updateInteractions 里推进，不依赖 setTimeout（无头环境更稳）
const IX_TASKS=[];
function ixLater(fn,sec){IX_TASKS.push({fn,t:sec})}
function updateTasks(dt){
  for(let i=IX_TASKS.length-1;i>=0;i--){
    const t=IX_TASKS[i];t.t-=dt;
    if(t.t<=0){IX_TASKS.splice(i,1);try{t.fn()}catch(e){}}
  }
}

// ---------------------------------------------------------------- ⑦ 沙尘暴
// 一颗会自己漂移的沙尘暴。进去之后：雾变浓、太阳被遮暗、全屏蒙一层土黄，
// 人还被切向的风推着走 —— 想走直线得顶着风。
const STORM={next:30,on:false,lat:0,lon:0,t:0,life:0,r:15,local:0,away:1e9,az:0,
  drift:6,dAz:0,gust:1,cloud:null,pts:null,st:null,N:0,bills:null,wall:0};
const FOG0=.00125;
// 柔和圆斑贴片：给"大团沙尘"用（细尘只是一粒粒亮点，远看不成形）
let STORM_TEX=null,STORM_MADE=false;
function stormPuffTex(){
  if(!STORM_MADE){
    STORM_MADE=true;STORM_TEX=null;
    try{
      const cv=document.createElement('canvas');cv.width=cv.height=64;
      const cx=cv.getContext('2d');
      if(cx&&cx.createRadialGradient){
        const rg=cx.createRadialGradient(32,32,0,32,32,32);
        rg.addColorStop(0,'rgba(255,246,228,.95)');
        rg.addColorStop(.38,'rgba(226,198,158,.55)');
        rg.addColorStop(.72,'rgba(196,166,126,.18)');
        rg.addColorStop(1,'rgba(180,150,112,0)');
        cx.fillStyle=rg;cx.fillRect(0,0,64,64);
        STORM_TEX=new THREE.CanvasTexture(cv);
      }
    }catch(e){STORM_TEX=null}
  }
  return STORM_TEX;
}
function buildStormCloud(){
  const N=200;
  const pos=new Float32Array(N*3),col=new Float32Array(N*3),st=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    st[i*3]=Math.random()*360;                       // 方位角（度）
    st[i*3+1]=Math.sqrt(Math.random());              // 半径系数
    st[i*3+2]=Math.random();                         // 高度系数
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.Points(g,new THREE.PointsMaterial({size:.42,vertexColors:true,
    transparent:true,opacity:.5,depthWrite:false,sizeAttenuation:true}));
  m.frustumCulled=false;m.visible=false;ixMark(m);world.add(m);
  STORM.cloud=m;STORM.pts=pos;STORM.st=st;STORM.N=N;
  // 「沙尘团」：3 片柔和圆斑公告板。细尘只是一粒粒亮点，远看不成形；
  // 用 Sprite（和太阳光冠同一套 canvas 径向渐变纹理）才有"那边天色发黄"的一眼。
  STORM.bills=[];
  const tx=stormPuffTex();
  for(let i=0;i<3;i++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,color:0xc9a678,
      transparent:true,opacity:0,depthWrite:false}));
    sp.visible=false;ixMark(sp);world.add(sp);
    STORM.bills.push(sp);
  }
}
function stormStart(o){
  const la=(Math.random()*2-1)*60;
  let lo=o&&o.mode==='sphere'&&Math.random()<.6?(o.lon+(Math.random()*2-1)*70)
    :(Math.random()*360-180);
  while(lo>180)lo-=360;while(lo<-180)lo+=360;
  STORM.on=true;STORM.lat=la;STORM.lon=lo;STORM.t=0;
  STORM.life=52+Math.random()*38;
  // 半径 5.5~10 局部单位（≈16°~29° 弧）。别贪大：站在地上的人，地平线只有 ~6 单位远，
  // 半径一旦超过这个数，就变成"要么在里面、要么根本看不见"，少了远远望见风眼那一眼。
  STORM.r=5.5+Math.random()*4.5;
  STORM.drift=.30+Math.random()*.55;      // 慢慢挪（一次 76 秒也就走 20~60 单位，找得到）
  STORM.dAz=Math.random()*360;            // 漂移方位（跟"玩家→风眼"方位分开，否则风暴会一直逃离玩家）
  STORM.az=STORM.dAz;
}
function updateStorm(dt,o){
  STORM.next-=dt;
  if(STORM.next<=0){
    STORM.next=64+Math.random()*46;
    if(!STORM.on)stormStart(o);
  }
  if(!STORM.on){STORM.away=1e9}
  else{
    STORM.t+=dt;
    if(STORM.t>STORM.life)STORM.on=false;
    const q=stepGeo(STORM.lat,STORM.lon,STORM.dAz,STORM.drift*dt);
    STORM.lat=Math.max(-84,Math.min(84,q[0]));
    let L=q[1];while(L>180)L-=360;while(L<-180)L+=360;STORM.lon=L;
  }
  let near=1e9;
  if(o&&o.mode==='sphere'&&o.parent===world){
    near=D2R(angDistDeg(o.lat,o.lon,STORM.lat,STORM.lon))*o.R;
    STORM.away=near;STORM.az=geoAz(o.lat,o.lon,STORM.lat,STORM.lon);
  }
  const k=STORM.on?IX_C01(1-near/STORM.r):0;
  STORM.local+=(k-STORM.local)*ease(.9,dt);
  STORM.gust=1+.45*Math.sin(STORM.t*2.3)+.22*Math.sin(STORM.t*7.1);
  scene.fog.density=FOG0*(1+7.5*STORM.local);
  DAY.dim=1-.62*STORM.local;
  if(IX_UI)IX_UI.dust.style.opacity=(STORM.local*.62).toFixed(3);
  if(o&&STORM.local>.05&&o.mode==='sphere'&&!o.locked){
    const p=1.35*STORM.local*STORM.gust;               // 绕着风眼转的切向风
    o.fx+=Math.sin(D2R(STORM.az+90))*p;
    o.fy+=Math.cos(D2R(STORM.az+90))*p;
  }
  const C=STORM.cloud;
  if(C){
    C.visible=STORM.on&&near<90;
    if(C.visible){
      const pos=STORM.pts,col=STORM.st;
      const h0=terrainHeight(STORM.lat,STORM.lon);
      for(let i=0;i<STORM.N;i++){
        const a=col[i*3]+STORM.t*(.5+1.7*STORM.local);
        const rr=col[i*3+1]*STORM.r;
        const hh=col[i*3+2]*(1.2+2.4*STORM.local)+.12;
        const p=stepGeo(STORM.lat,STORM.lon,a,rr);
        const d=latLonToDir(p[0],p[1]);
        const rr2=planetRadius+terrainHeight(p[0],p[1])+hh-h0*.4;
        pos[i*3]=d.x*rr2;pos[i*3+1]=d.y*rr2;pos[i*3+2]=d.z*rr2;
        const w=IX_C01(.35+.65*(1-col[i*3+1]));
        col[i*3]=.62*w;col[i*3+1]=.55*w;col[i*3+2]=.44*w;
      }
      C.geometry.attributes.position.needsUpdate=true;
      C.geometry.attributes.color.needsUpdate=true;
    }
  }
  // 大团沙尘：按"离风眼多远"淡入（local 只在风暴内部才涨，远看会是 0）
  const B=STORM.bills;
  STORM.wall=STORM.on?IX_C01(1-near/(STORM.r*2.6)):0;
  if(B){
    const h0=terrainHeight(STORM.lat,STORM.lon);
    for(let i=0;i<3;i++){
      const b=B[i];
      b.visible=STORM.on&&near<150&&STORM.wall>.02;
      if(!b.visible)continue;
      const p=stepGeo(STORM.lat,STORM.lon,STORM.dAz+i*120+STORM.t*5,STORM.r*(.22+.26*i));
      const d=latLonToDir(p[0],p[1]);
      const hh=(1.1+.85*i)*STORM.r*.55+.4;
      b.position.copy(d).multiplyScalar(planetRadius+terrainHeight(p[0],p[1])+hh-h0*.4);
      const s=STORM.r*(3.6+.6*i);                      // 局部单位，world 再统一放大
      b.scale.set(s,s,1);
      b.material.opacity=.30*Math.min(1,STORM.wall*1.9)*STORM.gust*(i?0.78:1);
    }
  }
}

// ---------------------------------------------------------------- ⑧ 地表喷气孔
// 死星地表裂着一些气孔，周期性地往上喷一股白气。站上去会被顶到高空 ——
// 免费的高空视野，也是从"北岭山系"那种台阶地形里上来的捷径。
const VENTS=[];
const GYS_PAL={
  spots:[[-6,44],[12,-70],[-30,12],[44,96],[-56,-110],[22,150],[-14,-30],[62,30],[-40,70],[8,-160]]
};
function buildVents(){
  const N=54;
  for(const [la,lo] of GYS_PAL.spots){
    const pos=new Float32Array(N*3),col=new Float32Array(N*3);
    const d=[];
    for(let i=0;i<N;i++)d.push({r:Math.random(),a:Math.random()*Math.PI*2,
      t:Math.random(),sp:.6+Math.random()*.9});
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.BufferAttribute(col,3));
    const m=new THREE.Points(g,new THREE.PointsMaterial({size:.22,vertexColors:true,
      transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false,
      sizeAttenuation:true}));
    m.frustumCulled=false;ixMark(m);world.add(m);
    const light=new THREE.PointLight(0xbfe2ff,0,5,2);
    light.position.copy(point(la,lo,.3));ixMark(light);world.add(light);
    VENTS.push({lat:la,lon:lo,r:1.15,period:11+Math.random()*7,phase:Math.random()*10,
      pts:pos,geo:g,col,d,N,light,act:0,on:false,t:0});
  }
}
function updateVents(dt,o){
  for(const v of VENTS){
    v.t+=dt;
    const u=((v.t+v.phase)%v.period)/v.period;
    // 前 30% 猛喷，其余时间熄灭
    const act=u<.30?Math.pow(Math.sin(u/.30*Math.PI),1.6):0;
    v.act=act;v.on=act>.05;
    v.light.intensity=act*2.2;
    const d=v.d,pos=v.pts,col=v.col;
    const h0=terrainHeight(v.lat,v.lon);
    for(let i=0;i<v.N;i++){
      const p=d[i];
      p.t+=dt*p.sp*(.6+1.8*act);
      if(p.t>1)p.t-=1;
      const h=.15+p.t*(1.1+3.4*act);
      const rr=p.r*.34*(1+p.t*1.5);
      const q=stepGeo(v.lat,v.lon,p.a*180/Math.PI,rr);
      const dir=latLonToDir(q[0],q[1]);
      const R2=planetRadius+terrainHeight(q[0],q[1])+h-h0*.5;
      pos[i*3]=dir.x*R2;pos[i*3+1]=dir.y*R2;pos[i*3+2]=dir.z*R2;
      const w=(1-p.t)*(.25+.75*act);
      col[i*3]=.70*w;col[i*3+1]=.84*w;col[i*3+2]=1.0*w;
    }
    v.geo.attributes.position.needsUpdate=true;
    v.geo.attributes.color.needsUpdate=true;
    // 站上去 → 被顶飞（不灼烧，纯白气）
    if(o&&o.mode==='sphere'&&act>.45&&o.alt<1.6&&!o.locked){
      const dd=D2R(angDistDeg(o.lat,o.lon,v.lat,v.lon))*o.R;
      if(dd<v.r){
        o.air=true;
        o.launchV=Math.max(o.launchV,5.0+4.6*act);
        IX.shake=Math.max(IX.shake,.09);
      }
    }
  }
}

// ---------------------------------------------------------------- HUD / 总入口
const IX={shake:0,bioCount:0,bioNear:1e9,ready:0,err:null};
const IX_ZONE={deadforest:'采伐迹地',industrial:'工业废墟',city:'废弃都市',
  mountain:'北岭山系',volcano:'火山群',ash:'灰黑低地'};
function updateIX_HUD(o){
  const U=IX_UI;if(!U)return;
  const onStar=!!(o&&o.mode==='sphere'&&o.parent===world);
  const zone=onStar?biomeAt(o.lat,o.lon):'';
  ixSet('zone','区域　'+(IX_ZONE[zone]||zone||'—'));
  const isDay=DAY.sun>0;
  const left=Math.acos(IX_CL(DAY.sun,-1,1))/Math.PI*60;      // 离下一次昼夜翻转还有几秒
  ixSet('time','时刻　'+(isDay?'白昼':'夜间')+'　余 '+Math.min(60,left).toFixed(0)+'s'
    +'　日照 '+Math.round(DAY.f*100)+'%'
    +(STORM.local>.04?'　能见度 '+Math.round((1-STORM.local)*100)+'%':''));
  let st='状态　正常';
  if(TRANSIT.on)st='状态　穿梭中 '+Math.max(0,TRANSIT.dur-TRANSIT.t).toFixed(1)+'s';
  else if(VENT.t>0&&VENT.o===o)st='状态　井底余压 · 被弹出 '+VENT.t.toFixed(1)+'s';
  else if(o&&o.burn>0)st='状态　灼烧中 '+o.burn.toFixed(1)+'s';
  else if(o&&o.shaftD>0)st='状态　井中　深 '+o.shaftD.toFixed(1);
  else if(o&&o.air&&o.launchV>3)st='状态　被气流顶起';
  else if(STORM.local>.30)st='状态　沙尘暴中';
  ixSet('stat',st);
  ixSet('bio',(IX.bioNear<ALIEN.lose)?('附近　'+IX.bioCount+' 只外星动物　最近 '+ixDist(IX.bioNear))
    :'附近　无生物活动');
  let nav='';
  if(onStar){
    let best=null;
    for(const sh of (o.shafts||[])){
      const d=D2R(angDistDeg(o.lat,o.lon,sh.lat,sh.lon))*o.R;
      if(!best||d<best.d)best={d,az:geoAz(o.lat,o.lon,sh.lat,sh.lon),n:'井口'};
    }
    for(const v of volcanoes){
      const d=D2R(angDistDeg(o.lat,o.lon,v.lat,v.lon))*o.R;
      if(!best||d<best.d)best={d,az:geoAz(o.lat,o.lon,v.lat,v.lon),n:'火山'};
    }
    if(best)nav='最近 '+best.n+'　'+ixArrow(best.az)+' '+ixDist(best.d);
    const g=shaftPull(o);
    // 余压弹出中 / 刚弹出这几秒，别再说"已被引力捕获"——那几秒根本没施力，自相矛盾
    if(g&&g.d<GRAV.capture&&VENT.t<=0&&GRAV.graceT<=0)nav+='　⚠ 已被引力捕获（无法挣脱）';
    if(GRAV.graceT>0)nav+='　⇗ 脱出引力场 '+GRAV.graceT.toFixed(1)+'s';
    if(VENT.t>0&&VENT.o===o)nav+='　⇗ 余压弹出中';
    else if(o&&o.shaftD>0){
      // 站在井里：把"出去的路"指出来——那圈护墙只有一个 66° 的豁口
      const sh=o.shafts&&o.shafts[o.shaftIdx];
      if(sh){
        const q=stepGeo(sh.lat,sh.lon,shaftDoor(sh),4.2);
        nav+='　⇗ 出口 '+ixArrow(geoAz(o.lat,o.lon,q[0],q[1]))+' '+
          ixDist(D2R(angDistDeg(o.lat,o.lon,q[0],q[1]))*o.R);
      }
    }
    for(const v of volcanoes)if(v.e>.35&&D2R(angDistDeg(o.lat,o.lon,v.lat,v.lon))*o.R<v.craterR*6)
      nav+='　▲ 火山喷发中';
    if(MET.warn>0)nav+='　⚠ 流星雨';
    if(STORM.on&&STORM.away<STORM.r*2.4)
      nav+='　▲ 沙尘暴 '+ixArrow(STORM.az)+' '+ixDist(STORM.away)
        +(STORM.away<STORM.r?'（身处其中）':'');
    let vent=null;
    for(const vt of VENTS){
      const d=D2R(angDistDeg(o.lat,o.lon,vt.lat,vt.lon))*o.R;
      if(vt.act>.25&&d<9&&(!vent||d<vent.d))vent={d};
    }
    if(vent)nav+='　▲ 气孔喷发 '+vent.d.toFixed(1);
  }
  ixSet('nav',nav||'—');
  ixSet('tip','Q 冲击波'+(PULSE.cd>0?'（'+PULSE.cd.toFixed(1)+'s）':'')+'　F 手电　Shift 冲刺');

function updateInteractions(dt){
  try{
    // 首帧惰性建：这一节排在"造探险者"之前，evaluating 的时候 explorers 还是空的
    if(!IX.ready){
      IX.ready=1;
      for(const e of explorers){
        if(e.mode==='sphere'&&e.parent===world)e.pulse=buildPulse(e);
        buildFlame(e);
      }
    }
    updateTasks(dt);
    if(GRAV.graceT>0)GRAV.graceT=Math.max(0,GRAV.graceT-dt);   // 刚被余压弹出：这几秒不施力
    updateDayNight(dt);
    updateVortex(dt);
    updateAnimals(dt);
    updatePulses(dt);
    updateFlames(dt);
    updateMeteors(dt,activeExp);
    updateStorm(dt,activeExp);
    updateVents(dt,activeExp);
    // 每座火山：找离它最近的地表探险者 → 决定喷不喷
    for(const v of volcanoes){
      let near=1e9;
      for(const e of explorers){
        if(e.mode!=='sphere'||e.parent!==world)continue;
        const d=D2R(angDistDeg(e.lat,e.lon,v.lat,v.lon))*planetRadius;
        if(d<near)near=d;
      }
      v.near=near;
      stepEruption(v,dt,near);
      const trig=v.craterR*2+3;
      if(near<trig)IX.shake=Math.max(IX.shake,.055*v.e*(1-near/trig));
    }
    const o=activeExp;
    const onStar=!!(o&&o.mode==='sphere'&&o.parent===world);
    // 灼烧 → 视野发亮（先复位，免得切视角后卡在亮档）
    if(o&&o.burn>0)o.burn=Math.max(0,o.burn-dt);
    o&&(o.burnFlick=Math.max(0,(o.burnFlick||0)-dt*1.2));
    const bk=(onStar&&o&&o.burn>0)?IX_C01(o.burn/BURN_T):0;
    renderer.toneMappingExposure=DAY.expo+.34*bk;
    if(IX_UI){
      const now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
      const fl=bk*(.72+.28*Math.sin(now*.017));
      IX_UI.burn.style.opacity=(fl*.95).toFixed(3);
      // 陨石落地那一下的白闪（穿梭时那个罩子自己会写，别打架）
      if(!TRANSIT.on)IX_UI.flash.style.opacity=Math.min(1,MET.flash*.92).toFixed(3);
    }
    if(!onStar){updateIX_HUD(o);return}
    // 外力①：井口引力。井底余压那几秒先关掉，否则会跟"被顶出去"对着干；
    // 弹出后的宽限期同样关掉，免得刚落地就又被吸回井里来回穿梭。
    const pull=((VENT.t>0&&VENT.o===o)||GRAV.graceT>0)?null:shaftPull(o);
    if(pull){
      const k=o.shaftD>0?GRAV.inK:1;              // 已经在井里：只留一点"漏斗"力
      let m=pull.v*k;
      // 捕获：贴到井口圈以内就叠一股只向心的硬拉。这样"按住方向键往外顶"只会
      // 在切向被抹掉，径向永远是净向内 —— 唯一结局是被拽过井口、落进竖井。
      // 衰减用二次（不是线性）：线性在 r≈2.5 处只剩 4.7，玩家踩在检修平台环上
      // 还能用冲刺顶住，人就卡在环上不出来。二次在近处更陡，一直拉到井底前才收手。
      if(pull.d<GRAV.capture&&o.gnd>-(GRAV.holdDoc)){
        const q=Math.max(0,pull.d)/GRAV.capture;
        m+=GRAV.hold*(1-q*q);
      }
      if(m>GRAV.holdMax)m=GRAV.holdMax;
      o.fx+=Math.sin(D2R(pull.ang))*m;
      o.fy+=Math.cos(D2R(pull.ang))*m;
      if(pull.lock)IX.shake=Math.max(IX.shake,.012);
    }
    // 井筒里的"吸附"：人一旦落进井筒，就按比例把人挪到井轴上（是位置吸附，不是给速度）。
    // 为什么必须这样：井底那块小平地只有 r<0.57，井筒内壁又是锥形，光给"向内速度"会在
    // 轴心两侧来回弹；而检修平台（0.72≤r≤2.50 都是 5.49 深）会把每次弹出去的 gnd 又拉高，
    // 结果 gnd 在 -12 上下反复横跳，穿梭阈值 -13.30 永远够不着 —— 人就悬在井底不上不下。
    // 位置吸附没有超调，一落到底，穿梭才会准时触发。
    if(o.shaftD>0&&!TRANSIT.on&&VENT.t<=0&&GRAV.graceT<=0&&o.shafts&&o.shafts[o.shaftIdx]){
      const sx=o.shafts[o.shaftIdx];
      const k=Math.min(1,5*dt);
      let dLon=sx.lon-o.lon;while(dLon>180)dLon-=360;while(dLon<-180)dLon+=360;
      o.lat+=(sx.lat-o.lat)*k;
      o.lon+=dLon*k;
    }
    // 外力②：火山口灼烧 / 冲走
    volcanoTouch(o,dt);
    if(o.burn>0)IX.shake=Math.max(IX.shake,.02*bk);
    // 外力③：被甩出去的一次性冲量
    if(o.blast&&o.blast.t>0){
      o.blast.t-=dt;
      o.fx+=Math.sin(D2R(o.blast.ang))*o.blast.v;
      o.fy+=Math.cos(D2R(o.blast.ang))*o.blast.v;
    }
    // 井底 → 穿梭。判据用**平滑后的实际高度 o.gnd**而不是井筒剖面：
    // 剖面是"站在这个经纬度会落到多深"，一进井口就立刻是井底深度；
    // 用剖面判定会让人刚被吸进井口就瞬间传走，那段"一路坠到井底"的过程全没了。
    if(o.shaftD>0&&o.shafts&&o.shafts[o.shaftIdx]){
      const shd=o.shafts[o.shaftIdx];
      if(o.gnd>-(shd.capD-3.0))TRANSIT.armed=true;
      if(TRANSIT.armed&&o.gnd<=-(shd.capD-0.8))startTransit(o,o.shaftIdx);
    }
    updateTransit(o,dt);
    o.tk=TRANSIT.k;
    updateVent(o,dt);                              // 外力④：井底余压（穿梭的出口）
    updateIX_HUD(o);
  }catch(e){
    IX.err=e;
    if(typeof console!=='undefined'&&console.warn)console.warn('[ix]',e);
  }
}
// 相机后处理：震屏（火山 / 灼烧 / 引力锁定 / 冲击波）

// SUN_POS（太阳方位）已经在底座 1 节里连太阳光一起定义了，这里直接复用。

function sunwardDir(frameNode,node,keep){          // 让中心视角落在受光面
  const q=frameNode.getWorldQuaternion(new THREE.Quaternion()).invert();
  const s=SUN_POS.clone().sub(node.getWorldPosition(new THREE.Vector3())).applyQuaternion(q).normalize();
  return s.multiplyScalar(.8).addScaledVector(node.position.clone().normalize().negate(),keep).normalize();
}

// ---------- 地表突起物实体化：给星球和月球各建一张"障碍栅格" ----------
// 必须在造小人之前建：否则小人的模型自己也会被当成一坨障碍物画进格子里。
// 排除区：井筒内部那一段（井壁 / 检修平台 / 井底）不算实体，人才能走进隧道里去。
// 半径取 2.9 而不是更大：井口内圈（<2.9）保持干净就够了；再往外那圈是井口的
// 护圈 / 围栏 / 导轨，它们是"地表的突起物"，必须保持实体 —— 取 4.15 时把人能穿过
// 护圈的区域也一起挖空了，人会从护圈上直接走过去（穿模）。
// 火山同理：锥体已经并进 terrainHeight（可以走上去），山体上那些装饰 ——
// 熔岩沟壑、寄生火山口 —— 就不要再当碰撞了，否则它们在山脚连成一圈 0.76 高的坎，
// 而抬脚高度只有 0.41，人还是上不去。整座山按"地貌"处理。
const _moonG=orbital.moon,_moonR=_moonG.userData.R||8;
const HOLE_EXCL=HOLES.map(h=>({dir:h.dir,r:2.9,lo:planetRadius-19,hi:planetRadius+3}));
const VOLC_EXCL=volcanoes.map(v=>({dir:latLonToDir(v.lat,v.lon),r:v.baseR*1.35,
  lo:planetRadius-1,hi:planetRadius+v.h+1.5}));
const F_EARTH=buildField({
  root:world,R:planetRadius,deg:OB.cellDeg,eps:.15,
  ground:(la,lo)=>planetRadius+terrainHeight(la,lo),
  under:.5,
  excl:HOLE_EXCL.concat(VOLC_EXCL)
});
const F_MOON=buildField({
  root:_moonG,R:_moonR,deg:OB.moonDeg,eps:.10,
  under:.5,
  ground:(la,lo)=>_moonR+(_moonG.userData.heightAt?_moonG.userData.heightAt(latLonToDir(la,lo)):0)
});

// 落点如果在某个道具里（比如正好站在树桩上、或钻进了太阳能板阵列），就近挪到空地上。
// 道具实体化以后这件事必须做：否则一出生就被自己卡在里头，往哪个方向都走不动。
function settle(o,la,lo){
  o.lat=la;o.lon=lo;o.gnd=groundRaw(o,la,lo);o.footR=o.R+o.gnd;
  if(!o.field)return;
  const at=(dla,dlo)=>{
    const p=[la+dla,lo+dlo],g=groundRaw(o,p[0],p[1]);
    return fieldBlocked(o.field,p[0],p[1],o.R+g,o.bodyH,o.bodyR)?null:p;
  };
  if(at(0,0))return;
  const k=1/Math.max(.2,Math.cos(D2R(la)));
  for(let r=1;r<=16;r++)for(let n=0;n<12;n++){
    const a=n/12*6.283,d=r*.2;
    const p=at(Math.cos(a)*d,Math.sin(a)*d*k);
    if(p){o.lat=p[0];o.lon=p[1];o.gnd=groundRaw(o,o.lat,o.lon);o.footR=o.R+o.gnd;placeExplorer(o);
      console.log('[settle] 出生点被道具占了，就近挪了 '+d.toFixed(1)+' 局部单位到 '+p[0].toFixed(2)+', '+p[1].toFixed(2));return}
  }
}

// 空间站：站在中央中枢模块的筒体顶上，沿筒体轴线往外走；脚下贴着筒面（半径 0.7）

const VIEWS=[

   dir:new THREE.Vector3(0,.14,.99).normalize(),dist:206,min:118,max:330},
  {name:'月球中心',kind:'C',frame:()=>orbital.moonPivot,focus:()=>orbital.moon,
   dir:sunwardDir(orbital.moonPivot,orbital.moon,.42),dist:38,min:14,max:130},
  {name:'空间站中心',kind:'C',frame:()=>orbital.stPivot,focus:()=>orbital.station,
   dir:sunwardDir(orbital.stPivot,orbital.station,.42),dist:34,min:12,max:120},
  {name:'地表探险者',kind:'E',exp:E_EARTH},
  {name:'月面探险者',kind:'E',exp:E_MOON},
  {name:'空间站探险者',kind:'E',exp:E_STATION}
];
VIEWS.forEach(v=>{v.cur=v.dist||0});
let viewMode=0;

const hintEl=document.getElementById('hint');
const viewBtns=document.querySelectorAll('#views button');

// ---------- 灵敏度：出厂基准 + 屏幕上的 ± 按钮 ----------
// 键盘快捷键（[ ] 水平、− = 竖直）在中文输入法下会被吃掉，所以两轴各配一组
// 可点击的 ± 按钮放在右上角，怎么着都能调。键与按钮走同一个 bumpSens。
const SX0=.1152,SY0=.0216;
const sensBox=document.getElementById('sens');
const sxOut=document.getElementById('sxv'),syOut=document.getElementById('syv');
function syncSens(){
  if(sxOut)sxOut.textContent=Math.round(LOOK.sensX/SX0*100)+'%';
  if(syOut)syOut.textContent=Math.round(LOOK.sensY/SY0*100)+'%';
}
function bumpSens(ax,fast){
  const k2=fast?1.3:.77;
  if(ax==='x')LOOK.sensX=Math.max(.010,Math.min(.90,LOOK.sensX*k2));   // 水平
  else        LOOK.sensY=Math.max(.004,Math.min(.34,LOOK.sensY*k2));   // 竖直
  syncSens();
}
if(sensBox)sensBox.addEventListener('click',e=>{
  const b=e.target&&e.target.closest?e.target.closest('button'):null;
  if(!b)return;
  bumpSens(b.getAttribute('data-ax'),b.getAttribute('data-d')==='1');
  if(hintEl){
    hintEl.textContent='灵敏度　水平 '+Math.round(LOOK.sensX/SX0*100)+'%　竖直 '
      +Math.round(LOOK.sensY/SY0*100)+'%';
  }
});
syncSens();

// ---------- 手电筒：亮度面板（与灵敏度同一套 ± 按钮）+ F 键开关 ----------
const torchBox=document.getElementById('torch');
const tbvOut=document.getElementById('tbv'),tonBtn=document.getElementById('ton');
function syncTorch(){
  if(tbvOut)tbvOut.textContent=Math.round(TORCH.bright*100)+'%';
  if(tonBtn){tonBtn.textContent=TORCH.on?'开':'关';tonBtn.className=TORCH.on?'on':'';}
}
function bumpTorch(dir){          // 1 变亮 / -1 变暗 / 0 开关
  if(dir===0)TORCH.on=!TORCH.on;
  else TORCH.bright=Math.max(.08,Math.min(2.6,TORCH.bright*(dir>0?1.25:.82)));
  syncTorch();
  if(!TORCH.on)for(const o of explorers)updateTorch(o,1);   // 关灯立刻收掉，不用等下一帧
  if(hintEl)hintEl.textContent='手电筒 '+(TORCH.on?'开':'关')+'　亮度 '+Math.round(TORCH.bright*100)+'%';
}
if(torchBox)torchBox.addEventListener('click',e=>{
  const b=e.target&&e.target.closest?e.target.closest('button'):null;
  if(!b)return;
  bumpTorch(b.id==='ton'?0:(b.getAttribute('data-t')==='1'?1:-1));
});
syncTorch();

// 提示文案随「光标是否锁住」变化。转视野一律是单指；滚轮（双指）固定给缩放。
function updateHint(){
  const v=VIEWS[viewMode];
  if(!hintEl)return;
  if(v.kind==='C'){hintEl.textContent='拖动：旋转星球 · 滚轮：缩放';return}
  hintEl.textContent=(LOOK.locked?'单指滑动：转视野（Esc 解锁）':'单指滑动：转视野')
    +' · 双指滑动 / 捏合：缩放 · Z 前进 · 空格 飞行 · A/D 侧移 · S 后退 · Shift 冲刺'
    +' · F 手电筒 · Q 冲击波 · 当心：隧道引力（坠底会被射到对面井口）· 火山喷发 · 流星雨 · 沙尘暴 · 气孔 · 外星动物';
}
LOOK.onChange=updateHint;
function setView(i){
  viewMode=(i+VIEWS.length)%VIEWS.length;
  const v=VIEWS[viewMode];
  if(v.kind==='C')v.cur=v.dist;
  camera.near=v.kind==='C'?.1:.08;
  camera.updateProjectionMatrix();
  for(let k=0;k<viewBtns.length;k++)viewBtns[k].className=(k===viewMode?'on':'');
  setActiveExplorer(v.kind==='E'?v.exp:null);      // 进出探险者视角时接管 / 交还光标
  for(const o of explorers)if(o!==activeExp)updateTorch(o,1);   // 把切走的那个人的手电筒收掉
  if(v.kind==='C')document.body.style.cursor='default';
  if(sensBox)sensBox.className='sens'+(v.kind==='E'?' on':'');   // 只有探险者视角才需要它
  if(torchBox)torchBox.className='sens'+(v.kind==='E'?' on':'');
  syncSens();syncTorch();
  updateHint();
}
for(let k=0;k<viewBtns.length;k++)viewBtns[k].addEventListener('click',()=>setView(k));

// ---------- 键盘：视角切换 + 行走 ----------
let sensTimer=0;
function setKey(e,down){
  const k=e.key;
  if(k==='Shift'){keyState.shift=down?1:0;return}
  if(k===' '||k==='Spacebar'||e.code==='Space'){keyState.space=down?1:0;e.preventDefault();return}
  const c=k.length===1?k.toLowerCase():'';
  if(c==='['||c===']'||c==='-'||c==='='){     // 键盘调档（与右上角按钮同源）
    if(!down)return;                          // 只在按下时调（否则 keyup 会多调一次）
    bumpSens((c==='['||c===']')?'x':'y',c===']'||c==='=');
    if(hintEl){
      hintEl.textContent='灵敏度　水平 '+Math.round(LOOK.sensX/SX0*100)+'%　竖直 '
        +Math.round(LOOK.sensY/SY0*100)+'%　（[ ] 调水平 · − = 调竖直）';
      clearTimeout(sensTimer);sensTimer=setTimeout(updateHint,1900);
    }
    return;
  }
  if(c==='f'){                                // F：手电筒开关（ASCII 键，输入法下也能穿透）
    if(!down)return;
    bumpTorch(0);return;
  }
  if(c==='q'){                                // Q：脉冲冲击波（震退外星动物）
    if(!down)return;
    const ok=firePulse(activeExp);
    if(hintEl)hintEl.textContent=ok?'脉冲冲击波已释放：附近的外星动物被震退'
      :(PULSE.cd>0?'冲击波冷却中 '+PULSE.cd.toFixed(1)+'s':'脉冲冲击波（只有地表探险者能用）');
    return;
  }
  if(c==='w'||c==='a'||c==='s'||c==='d'||c==='z'){keyState[c]=down?1:0;e.preventDefault();return}
  if(k==='ArrowUp'){keyState.w=down?1:0;e.preventDefault();}
  else if(k==='ArrowDown'){keyState.s=down?1:0;e.preventDefault();}
  else if(k==='ArrowLeft'){keyState.a=down?1:0;e.preventDefault();}
  else if(k==='ArrowRight'){keyState.d=down?1:0;e.preventDefault();}
}
addEventListener('keydown',e=>{
  const n=(e.key>='1'&&e.key<='6')?e.key.charCodeAt(0)-48:0;
  if(n){setView(n-1);return}
  if(e.key==='0'){setView(0);return}
  setKey(e,true);
});
addEventListener('keyup',e=>setKey(e,false));
addEventListener('blur',()=>{for(const k in keyState)keyState[k]=0});

// ---------- 鼠标：中心视角拖动转星球；探险者视角由光标驱动视线 ----------
let dragging=false,lastX=0,lastY=0;
world.rotation.set(-.08,-.25,0);
renderer.domElement.addEventListener('pointerdown',e=>{
  if(VIEWS[viewMode].kind!=='C')return;
  dragging=true;lastX=e.clientX;lastY=e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;
  world.rotation.y+=(e.clientX-lastX)*.0045;
  world.rotation.x=Math.max(-1.1,Math.min(1.1,world.rotation.x+(e.clientY-lastY)*.0035));
  lastX=e.clientX;lastY=e.clientY;
});
// ---------- 缩放：滚轮 / 双指滑动 / 双指捏合，全部走这一个入口 ----------
// 触控板上"双指缩放"其实有两种来源，浏览器给的数据完全不同：
//   ① 双指上下滑 → 普通 wheel，一次 deltaY 能有几百；
//   ② 双指捏合   → Chrome 只给 ±1~3 的 deltaY，但带 ctrlKey，且一秒能来几十次。
// 早先两者乘同一个系数，捏合就被吃掉了（1 × .006 ≈ 0，人眼看不见），
// 这就是"双指缩放没反应"的原因。现在分开给系数，并且改成**指数缩放**：
// 近处一步缩得细、远处一步跨得大，再小的 delta 也能积出看得见的位移。
function zoomBy(dy,ctrl){
  const v=VIEWS[viewMode];
  if(v.kind==='C'){
    v.dist=Math.max(v.min,Math.min(v.max,v.dist+dy*(ctrl?.60:.075)));
    return;
  }
  const o=v.exp;
  o.camDist=Math.max(o.camMin,Math.min(o.camMax,o.camDist*Math.exp(dy*(ctrl?.013:.0017))));
}
addEventListener('wheel',e=>{
  e.preventDefault();        // 顺手挡掉浏览器的"捏合缩放整个页面"
  zoomBy(e.deltaY,e.ctrlKey);
},{passive:false});
// Safari 的触控板捏合不产生 wheel，走的是 gesture 事件
let _gs=1;
addEventListener('gesturestart',e=>{e.preventDefault();_gs=e.scale||1;});
addEventListener('gesturechange',e=>{e.preventDefault();const s=e.scale||1;zoomBy((_gs-s)*160,true);_gs=s;});
addEventListener('gestureend',e=>e.preventDefault());

const _f=new THREE.Vector3(),_q=new THREE.Quaternion(),_v=new THREE.Vector3();
function updateCamera(dt){
  const v=VIEWS[viewMode];
  if(v.kind==='E'){
    updateExplorer(v.exp,dt);
    updateExplorerCam(v.exp,dt);
    return;
  }
  const fo=v.focus();
  if(fo.isObject3D)fo.getWorldPosition(_f);else _f.copy(fo);
  v.frame().getWorldQuaternion(_q);
  if(v.dist!==undefined)v.cur+=(v.dist-v.cur)*.08;
  _v.copy(v.dir).multiplyScalar(v.cur).applyQuaternion(_q).add(_f);
  camera.position.copy(_v);
  camera.up.set(0,1,0);
  camera.lookAt(_f);
}
setView(0);

const clock=new THREE.Clock();
let tAcc=0;
function animate(){
  const dt=Math.min(clock.getDelta(),.05);tAcc+=dt;
  // 互动层：引力场 / 火山 / 外星动物 / 昼夜 / 太阳。放在相机之前 ——
  // 它这帧算出来的外力（o.fx / o.fy）要交给同一帧的 updateExplorer 去消费。
  // 死星的自转（昼夜来源）也在这一层里推（见 updateDayNight）。
  updateInteractions(dt);
  space.rotation.copy(world.rotation);        // 轨道层跟随星球旋转
  orbital.pivots.forEach(p=>{p.node.rotation.y+=dt*p.speed*(p.dir||1)});
  orbital.moon.rotation.y+=dt*.006;
  orbital.station.rotation.x+=dt*.012;        // 废弃空间站在缓缓翻滚
  orbital.station.rotation.z+=dt*.009;
  orbital.debrisGroup.rotation.y+=dt*.028;
  orbital.moteMesh.rotation.y-=dt*.012;
  // 火山灰柱缓缓上升（喷发时被顶得更高）
  plumes.forEach(pl=>{
    const a=pl.points.geometry.attributes.position;
    for(let i=0;i<a.count;i++){
      let y=a.getY(i)+dt*(.2+2.6*(pl.erupt||0));
      if(y>pl.span)y=.05;
      a.setY(i,y);
    }
    a.needsUpdate=true;
  });
  // 井底的光在呼吸
  cannonGlows.forEach(l=>{l.material.opacity=.3+.32*(.5+.5*Math.sin(tAcc*1.5))});
  cannonCores.forEach((m,i)=>{m.emissiveIntensity=.45+.5*(.5+.5*Math.sin(tAcc*1.15+i*.7))});
  // 基地与空间站的灯偶尔闪一下
  twinkleLights.forEach((l,i)=>{l.material.opacity=Math.sin(tAcc*(1.05+i*.37)+i*2.1)<-.7?.1:.85});
  updateCamera(dt);
  postCamera(dt);                             // 震屏（火山 / 灼烧 / 引力锁定 / 冲击波）
  renderer.render(scene,camera);requestAnimationFrame(animate);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
// 调试钩子：__dead.setView(0..5) 切视角、__dead.renderer.info 看渲染开销
window.__dead={scene,camera,renderer,world,space,orbital,VIEWS,setView,explorers,EXPL,keyState,
  LOOK,TORCH,setActiveExplorer,applyLook,requestLook,bumpTorch,syncTorch,
  OB,TERRAIN:terrainHeight,F_EARTH,F_MOON,buildField,fieldBlocked,fieldSupport,
  makeShaft,groundRaw,groundAt,
  DAY,TRANSIT,GRAV,PULSE,VOLCANOES:volcanoes,volcanoes,ANIMALS,ALIEN,BURN_T,SUN_DIR,
  MET,STORM,VENTS,MET_CFG,spawnMeteor,metImpact,stormStart,ixLater,IX,
  VENT,startVent,updateVent,shaftDoor,
  updateMeteors,updateStorm,updateVents,
  updateInteractions,postCamera,shaftPull,firePulse,ixPlace,
  dbg:{point,place,dirToLatLon,geoAz,placeExplorer,updateExplorer,updateExplorerCam,updateTorch,stepGeo,isLand}};
})();

  </script>
</body></html>
