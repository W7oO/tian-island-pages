<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="一位学生的 AI 创作作品展：漫画全家福、西甲联赛介绍、文学改编图文故事与足球数据可视化。"><title>钢铁少年 · 图文故事</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"></head><body><nav class="nav"><a class="brand" href="works.html#story">← 返回作品展</a><div class="nav-links"><a href="#scenes">15 幅分镜</a><a href="story-book.html">完整故事</a></div></nav><main class="reader"><header class="reader-heading" id="top"><p class="eyebrow">A LITERARY EXPERIMENT / 学生改编作品</p><h1>钢铁少年</h1><p>保尔·柯察金在盖茨海德的岁月</p><p class="reader-lead">让另一种性格走进熟悉的故事，看看冲突、友谊与成长如何改变。</p><a class="primary" href="#scenes">浏览分镜 ↓</a><a class="text-link" href="story-book.html">翻开完整故事 →</a></header><section id="scenes"><div class="reader-section-title"><p class="eyebrow">STORYBOARD / 01—15</p><h2>把故事，变成画面。</h2><p>按原作顺序展示 15 幅图片与分镜说明。点击图片可放大。</p></div><figure class="scene" id="scene-1"><div class="scene-number">01 / 15</div><button class="image-button " data-zoom="assets/story/scene01-gaicihaide.webp" data-caption="来到盖茨海德" aria-label="放大：来到盖茨海德"><img src="assets/story/scene01-gaicihaide.webp" alt="来到盖茨海德" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>来到盖茨海德</h3><p>- <strong>画面</strong>：盖茨海德红房子外景，保尔站在门口，拎着小箱子，仰头看着高大的红砖宅邸。<br>- <strong>构图</strong>：俯视镜头（从二楼窗户视角往下看），突出红房子的庞大和保尔的渺小。<br>- <strong>氛围</strong>：阴沉的天色，保尔孤零零的身影。</p></figcaption></figure><figure class="scene" id="scene-2"><div class="scene-number">02 / 15</div><button class="image-button " data-zoom="assets/story/scene02-tiaoxin.webp" data-caption="第一次挑衅" aria-label="放大：第一次挑衅"><img src="assets/story/scene02-tiaoxin.webp" alt="第一次挑衅" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>第一次挑衅</h3><p>- <strong>画面</strong>：栗子树下，约翰·里德把书扔在草地上，朝保尔挑衅。<br>- <strong>构图</strong>：中景，保尔和约翰对峙，书本散落在地。<br>- <strong>氛围</strong>：夏日午后，光影斑驳，紧张的对峙气氛。</p></figcaption></figure><figure class="scene" id="scene-3"><div class="scene-number">03 / 15</div><button class="image-button " data-zoom="assets/story/scene03-punch.webp" data-caption="挥拳一击（关键特写）" aria-label="放大：挥拳一击（关键特写）"><img src="assets/story/scene03-punch.webp" alt="挥拳一击（关键特写）" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>挥拳一击（关键特写）</h3><p>- <strong>画面</strong>：保尔的拳头击中约翰的鼻子，鲜血涌出。<br>- <strong>构图</strong>：写实特写镜头，保尔攥紧的拳头、约翰的脸部侧面、飞溅的血滴。<br>- <strong>氛围</strong>：凝固的瞬间，动作感强烈。</p></figcaption></figure><figure class="scene" id="scene-4"><div class="scene-number">04 / 15</div><button class="image-button " data-zoom="assets/story/scene04-redroom.webp" data-caption="被关红房间" aria-label="放大：被关红房间"><img src="assets/story/scene04-redroom.webp" alt="被关红房间" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>被关红房间</h3><p>- <strong>画面</strong>：红房间里，保尔砸坏床头灯和椅子，窗帘被扯下一半。<br>- <strong>构图</strong>：俯视全景，地板上满是碎片，保尔跪坐在狼藉中央。<br>- <strong>氛围</strong>：昏暗的红光，压抑而狂躁。</p></figcaption></figure><figure class="scene" id="scene-5"><div class="scene-number">05 / 15</div><button class="image-button " data-zoom="assets/story/scene05-gingerbread.webp" data-caption="摔姜饼" aria-label="放大：摔姜饼"><img src="assets/story/scene05-gingerbread.webp" alt="摔姜饼" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>摔姜饼</h3><p>- <strong>画面</strong>：保尔在客厅里，把小盒姜饼狠狠摔进燃烧的壁炉。约翰和妹妹们在沙发上惊呆。<br>- <strong>构图</strong>：侧面中景，保尔的背影，壁炉里的火焰特写。<br>- <strong>氛围</strong>：愤怒爆发，火光映在保尔脸上。</p></figcaption></figure><figure class="scene" id="scene-6"><div class="scene-number">06 / 15</div><button class="image-button " data-zoom="assets/story/scene06-redroom2.webp" data-caption="再次红房间" aria-label="放大：再次红房间"><img src="assets/story/scene06-redroom2.webp" alt="再次红房间" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>再次红房间</h3><p>- <strong>画面</strong>：保尔独自坐在红房间地板上，靠着墙，看着自己磕破的指关节。<br>- <strong>构图</strong>：特写镜头，保尔的脸部侧面，表情疲惫而迷茫。<br>- <strong>氛围</strong>：清晨的灰光透过窗帘缝隙，保尔陷入沉思。</p></figcaption></figure><figure class="scene" id="scene-7"><div class="scene-number">07 / 15</div><button class="image-button " data-zoom="assets/story/scene07-leavegatehead.webp" data-caption="离开盖茨海德" aria-label="放大：离开盖茨海德"><img src="assets/story/scene07-leavegatehead.webp" alt="离开盖茨海德" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>离开盖茨海德</h3><p>- <strong>画面</strong>：保尔独自坐上马车，从盖茨海德的大门驶出，没有回头。贝茜站在门口目送。<br>- <strong>构图</strong>：远景镜头，马车渐渐远去，红房子在后景。<br>- <strong>氛围</strong>：清晨薄雾，离别的惆怅。</p></figcaption></figure><figure class="scene" id="scene-8"><div class="scene-number">08 / 15</div><button class="image-button " data-zoom="assets/story/scene08-lowood-opening.webp" data-caption="洛伍德开学" aria-label="放大：洛伍德开学"><img src="assets/story/scene08-lowood-opening.webp" alt="洛伍德开学" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>洛伍德开学</h3><p>- <strong>画面</strong>：洛伍德学校大礼堂，布洛克尔赫斯特先生站在高台上训话，下面站着一排瘦弱的新生。保尔在队伍中，攥紧拳头。<br>- <strong>构图</strong>：仰视镜头，突出布洛克尔赫斯特的威严和学生的渺小。<br>- <strong>氛围</strong>：灰暗的色调，压抑的规训感。</p></figcaption></figure><figure class="scene" id="scene-9"><div class="scene-number">09 / 15</div><button class="image-button " data-zoom="assets/story/scene09-temple.webp" data-caption="谭波儿小姐的温暖" aria-label="放大：谭波儿小姐的温暖"><img src="assets/story/scene09-temple.webp" alt="谭波儿小姐的温暖" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>谭波儿小姐的温暖</h3><p>- <strong>画面</strong>：谭波儿小姐蹲下来与保尔平视，轻声和他说话。保尔低着头，眼眶微红。<br>- <strong>构图</strong>：中景特写，谭波儿温柔的侧脸和保尔低垂的侧脸。<br>- <strong>氛围</strong>：柔和的光线，难得的温情时刻。</p></figcaption></figure><figure class="scene" id="scene-10"><div class="scene-number">10 / 15</div><button class="image-button " data-zoom="assets/story/scene10-helen-help.webp" data-caption="海伦出手相助" aria-label="放大：海伦出手相助"><img src="assets/story/scene10-helen-help.webp" alt="海伦出手相助" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>海伦出手相助</h3><p>- <strong>画面</strong>：操场上，三个大男孩围着保尔，海伦突然出现，瘦弱的身影挡在前面。<br>- <strong>构图</strong>：侧面全景，凸显海伦的瘦小与包围者的体积。<br>- <strong>氛围</strong>：紧张的对抗，海伦的勇气。</p></figcaption></figure><figure class="scene" id="scene-11"><div class="scene-number">11 / 15</div><button class="image-button " data-zoom="assets/story/scene11-silent-walk.webp" data-caption="沉默的友谊" aria-label="放大：沉默的友谊"><img src="assets/story/scene11-silent-walk.webp" alt="沉默的友谊" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>沉默的友谊</h3><p>- <strong>画面</strong>：保尔和海伦并肩走在洛伍德的回廊下，两个人都没有说话。<br>- <strong>构图</strong>：远景长镜头，两个人影被长长的走廊包围。<br>- <strong>氛围</strong>：安静的氛围，淡淡的暖意。</p></figcaption></figure><figure class="scene" id="scene-12"><div class="scene-number">12 / 15</div><button class="image-button " data-zoom="assets/story/scene12-canteen.webp" data-caption="食堂冲突" aria-label="放大：食堂冲突"><img src="assets/story/scene12-canteen.webp" alt="食堂冲突" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>食堂冲突</h3><p>- <strong>画面</strong>：食堂里，保尔把稀粥的盘子推到一边，猛地站起来。布洛克尔赫斯特先生站在他面前训斥。<br>- <strong>构图</strong>：中景对峙，保尔瞪大眼睛，攥紧拳头。<br>- <strong>氛围</strong>：紧张压抑，对抗权威。</p></figcaption></figure><figure class="scene" id="scene-13"><div class="scene-number">13 / 15</div><button class="image-button " data-zoom="assets/story/scene13-helen-sick.webp" data-caption="海伦病重（关键特写）" aria-label="放大：海伦病重（关键特写）"><img src="assets/story/scene13-helen-sick.webp" alt="海伦病重（关键特写）" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>海伦病重（关键特写）</h3><p>- <strong>画面</strong>：海伦躺在病床上，脸色苍白如纸，嘴唇发紫。保尔握着她的手。<br>- <strong>构图</strong>：写实特写，海伦苍白的脸和两人交握的手部特写。<br>- <strong>氛围</strong>：忧郁的暖光，死亡的预兆。</p></figcaption></figure><figure class="scene" id="scene-14"><div class="scene-number">14 / 15</div><button class="image-button " data-zoom="assets/story/scene14-helen-gone.webp" data-caption="海伦去世" aria-label="放大：海伦去世"><img src="assets/story/scene14-helen-gone.webp" alt="海伦去世" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>海伦去世</h3><p>- <strong>画面</strong>：保尔独自站在操场角落的枯树下，仰头看天，眼眶通红，拳头攥紧。<br>- <strong>构图</strong>：仰视特写，保尔的脸部，表情复杂压抑。<br>- <strong>氛围</strong>：阴沉的天空，压抑的哀伤。</p></figcaption></figure><figure class="scene" id="scene-15"><div class="scene-number">15 / 15</div><button class="image-button " data-zoom="assets/story/scene15-new-beginning.webp" data-caption="新生活的第一个早晨" aria-label="放大：新生活的第一个早晨"><img src="assets/story/scene15-new-beginning.webp" alt="新生活的第一个早晨" loading="lazy"><span class="zoom-hint" aria-hidden="true">↗</span></button><figcaption><h3>新生活的第一个早晨</h3><p>- <strong>画面</strong>：鞋店后院的小屋，保尔站在水盆前捧水洗脸。清晨柔和的阳光从窗户透进来，照在他的脸上。<br>- <strong>构图</strong>：中景侧拍，水盆里映出他的倒影，皮革和工具散落在桌边。<br>- <strong>氛围</strong>：柔和温暖的晨光，清新、安静、充满希望——与前面压抑的章节形成强烈对比。</p></figcaption></figure></section><section class="reader-section-title"><h2>继续阅读</h2><p><a class="primary" href="story-book.html">翻开完整故事 →</a></p></section></main><footer><a class="brand" href="#top"><span class="brand-mark">✳</span> 想象力现场</a><p>创意与修改需求来自学生，在 AI 工具协助下完成。<br>本页将四份分享中的作品整理为可浏览的展示形式。</p><a href="#top">回到顶部 ↑</a></footer><dialog id="lightbox" aria-label="作品大图"><button id="close-lightbox" aria-label="关闭大图">×</button><img id="lightbox-img" alt=""><p id="lightbox-caption"></p></dialog><script src="app.js"></script></body></html>
