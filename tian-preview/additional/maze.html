<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>暗渊迷宫 · Maze of the Abyss</title>
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #050508;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center;
    height: 100%; justify-content: center;
  }
  #hud {
    width: 1000px; max-width: 96vw;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    color: #c9b8b8; padding: 10px 14px; box-sizing: border-box;
    background: #0a0a0e; border: 1px solid #2a1215; border-radius: 10px 10px 0 0;
    font-size: 15px; letter-spacing: 1px;
  }
  #hearts { font-size: 20px; letter-spacing: 3px; }
  #lvName { color: #8a5a5f; font-weight: bold; letter-spacing: 2px; }
  #fragInfo { color: #c9a227; font-weight: bold; }
  #skillInfo { color: #a371f7; font-weight: bold; min-width: 130px; }
  #skillInfo.ready { color: #7ee787; }
  #tip { color: #6e6262; font-size: 13px; }
  canvas {
    background: #060609;
    border: 1px solid #2a1215; border-top: none;
    border-radius: 0 0 10px 10px;
    display: block;
    cursor: crosshair;
    max-width: 96vw;
    touch-action: none;
  }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(3, 2, 4, 0.9);
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    box-sizing: border-box; padding: 16px 12px; overflow-y: auto;
    overscroll-behavior: contain;
    color: #d8c8c8; z-index: 10; text-align: center;
  }
  #overlay > * { flex: none; }
  #overlay > h1:first-child { margin-top: auto; }
  #overlay > p:last-child { margin-bottom: auto; }
  #overlay.scare { background: #050101; }
  #jumpscare {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    object-fit: contain; background: #000; z-index: 20;
    animation: scare 0.12s infinite alternate;
  }
  @keyframes scare {
    from { transform: scale(1) translate(-4px, 3px) rotate(-1deg); }
    to   { transform: scale(1.08) translate(4px, -3px) rotate(1deg); }
  }
  #overlay h1 {
    font-size: 46px; margin: 0 0 12px; color: #8a0f16;
    text-shadow: 0 0 18px rgba(160, 10, 20, 0.55);
    letter-spacing: 8px;
  }
  #overlay p { color: #8a7c7c; font-size: 15px; margin: 4px 0; line-height: 1.8; }
  #overlay button {
    margin-top: 26px;
    background: #6d0f14; color: #f0dede; border: 1px solid #a01820;
    font-size: 17px; padding: 12px 44px; border-radius: 8px;
    cursor: pointer; font-family: inherit; letter-spacing: 4px;
    box-shadow: 0 0 14px rgba(140, 10, 18, 0.4);
  }
  #overlay button:hover { background: #8a1319; }
  #ovBtns { display: flex; gap: 14px; margin-top: 26px; }
  #ovBtns button.ghost {
    background: #1a1216; color: #9a8a8a; border: 1px solid #3a2226;
    box-shadow: none;
  }
  #ovBtns button.ghost:hover { background: #241a1e; color: #c8b8b8; }
  #levelGrid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
    margin-top: 22px; max-width: 920px; width: min(92vw, 920px);
  }
  .lvBtn {
    background: #150a0d; border: 1px solid #4a161c; color: #cbbbb;
    padding: 13px 6px; border-radius: 8px; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; gap: 5px; align-items: center; justify-content: flex-start;
    min-height: 96px;
  }
  .lvBtn:hover { background: #2a1014; border-color: #8a232b; }
  .lvName { font-size: 16px; color: #d8c8c8; letter-spacing: 2px; }
  .lvSub { font-size: 11px; color: #8a7c7c; line-height: 1.5; }
  .lvBest { font-size: 11px; color: #c9a227; }
  .hidden { display: none !important; }

  /* ---------- 移动端控件 ---------- */
  #touchUI { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #joyBase {
    position: absolute; width: 120px; height: 120px; border-radius: 50%;
    border: 2px solid rgba(180, 60, 60, 0.4);
    background: rgba(30, 8, 10, 0.35);
    display: none;
  }
  #joyKnob {
    position: absolute; width: 54px; height: 54px; border-radius: 50%;
    background: rgba(150, 40, 40, 0.55);
    border: 2px solid rgba(220, 90, 90, 0.5);
    left: 33px; top: 33px;
  }
  #phaseBtn {
    position: absolute; right: max(18px, env(safe-area-inset-right));
    bottom: max(22px, env(safe-area-inset-bottom));
    width: 84px; height: 84px; border-radius: 50%;
    border: 2px solid rgba(163, 113, 247, 0.55);
    background: rgba(40, 20, 60, 0.45);
    color: #d8c8ff; font-size: 15px; font-weight: bold;
    display: none; align-items: center; justify-content: center;
    pointer-events: auto; font-family: inherit; letter-spacing: 1px;
  }
  #phaseBtn:active { background: rgba(90, 50, 140, 0.6); }
  #phaseBtn.cd { opacity: 0.35; border-color: rgba(120, 90, 160, 0.3); }
  #muteBtn {
    position: absolute; top: max(10px, env(safe-area-inset-top));
    right: max(12px, env(safe-area-inset-right));
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid rgba(150, 100, 100, 0.4);
    background: rgba(20, 10, 12, 0.5);
    color: #b09a9a; font-size: 18px;
    display: none; align-items: center; justify-content: center;
    pointer-events: auto; font-family: inherit;
  }
  body.touch #phaseBtn { display: flex; }
  body.touch #muteBtn { display: flex; }

  @media (max-width: 640px) {
    #hud { font-size: 12px; gap: 4px; padding: 6px 8px; }
    #hearts { font-size: 15px; }
    #tip { display: none; }
    #overlay h1 { font-size: clamp(23px, 8vw, 34px); letter-spacing: .12em; margin-bottom: 8px; }
    #overlay p { font-size: 13px; line-height: 1.55; padding: 0 4px; }
    #levelGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; margin: 12px 0; }
    #overlay .lvBtn { min-height: 76px; margin: 0; padding: 8px 6px; letter-spacing: 0; }
    .lvName { font-size: 15px; letter-spacing: 1px; }
    #ovBtns { flex-wrap: wrap; justify-content: center; margin-top: 12px; }
    #ovBtns button { padding: 12px 22px; font-size: 15px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span id="lvName">第 一 夜</span>
    <span id="hearts">❤❤❤</span>
    <span id="fragInfo">碎片 0 / 9</span>
    <span id="skillInfo">穿墙：--</span>
    <span id="tip">鼠标引导 · 空格穿墙（耗3碎片）· 照到才见红眼</span>
  </div>
  <canvas id="game" width="1100" height="748"></canvas>
</div>

<div id="touchUI">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button id="phaseBtn">穿墙</button>
  <button id="muteBtn">🔊</button>
</div>

<script>

  'use strict';
  // ================= 常量 =================
  const COLS = 25, ROWS = 17, CELL = 44;    // 道路略微加宽（原 40）
  const W = COLS * CELL, H = ROWS * CELL;
  const PLAYER_SPEED = 3.2;                 // 主角速度
  const FRAGMENT_COUNT = 9;
  const FRAG_COST = 3;
  const MAX_HP = 3;
  const INVINCIBLE_MS = 1200;
  const PLAYER_R = 11;                      // 主角大小不变（相比怪物缩小）
  const MONSTER_R = CELL / 2;               // 怪物直径 = 道路宽度（44 → 半径 22）
  const SKILL_CD_MS = 6000;
  const PHASE_MS = 1000;
  const PORTAL_R = 18;
  const PORTAL_COOLDOWN_MS = 1000;
  const FLASH_MS = 250;                     // 开局闪图 0.25 秒（原 0.1）
  const COUNTDOWN_MS = 3000;                // 倒计时 3 秒
  const TORCH_RANGE = 250;                   // 手电筒照射距离
  const TORCH_SPREAD = 0.52;                 // 扇形半角（弧度）

  // ================= 关卡配置 =================
  // bright: 明亮环境（无黑暗遮罩）
  // speeds: 各怪物速度（下标对应怪物）
  // glowCount: 黑暗中红眼可见的怪物数（排在前面的怪物眼睛发光）
  // portalCorners: 生效的传送门（四角下标 0左上/1右上/2左下/3右下）
  // hiddenFrags: 碎片在黑暗中不可被观察（无微光指引）
  const LEVELS = [
    { name: '第 一 夜', sub: '微光初探', bright: true,
      monsterCount: 2, speeds: [1.3, 1.1], glowCount: 2,
      portalCorners: [0, 1, 2, 3], hiddenFrags: false,
      desc: '明亮迷宫 · 2 只怪物' },
    { name: '第 二 夜', sub: '深渊回响', bright: false,
      monsterCount: 3, speeds: [1.3, 1.1, 0.9], glowCount: 3,
      portalCorners: [0, 1, 2, 3], hiddenFrags: false,
      desc: '黑暗降临 · 红眼窥视 · 3 只怪物' },
    { name: '第 三 夜', sub: '群影疾行', bright: false,

      portalCorners: [0, 1, 2, 3], hiddenFrags: false,
      desc: '4 只极速怪物 · 半数无眼可寻' },
    { name: '第 四 夜', sub: '孤途绝境', bright: false,
      monsterCount: 5, speeds: [2.55, 2.4, 2.25, 2.1, 1.95], glowCount: 2,
      portalCorners: [0, 3], hiddenFrags: false,
      desc: '5 只怪物 · 仅存对角传送门' },
    { name: '第 五 夜', sub: '湮灭之光', bright: false,
      monsterCount: 4, speeds: [2.55, 2.4, 2.25, 2.1], glowCount: 2,
      portalCorners: [0, 1, 2, 3], hiddenFrags: true,
      desc: '极速围猎 · 碎片隐入黑暗' }
  ];
  let currentLevel = 0;

  // ================= DOM =================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;   // 逻辑分辨率跟随迷宫尺寸（1100×748）
  const darkCv = document.createElement('canvas');
  darkCv.width = W; darkCv.height = H;
  const dctx = darkCv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const jumpscare = document.getElementById('jumpscare');
  const ovBtn = document.getElementById('ovBtn');
  const ovBack = document.getElementById('ovBack');
  const ovBtns = document.getElementById('ovBtns');
  const levelGrid = document.getElementById('levelGrid');
  const lvNameEl = document.getElementById('lvName');
  const ovText = document.getElementById('ovText');
  const ovTitle = overlay.querySelector('h1');
  const heartsEl = document.getElementById('hearts');
  const fragEl = document.getElementById('fragInfo');
  const skillEl = document.getElementById('skillInfo');
  const tipEl = document.getElementById('tip');
  const phaseBtn = document.getElementById('phaseBtn');
  const muteBtn = document.getElementById('muteBtn');
  const joyBase = document.getElementById('joyBase');
  const joyKnob = document.getElementById('joyKnob');

  // ================= 设备识别 =================
  const isTouch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
                  ('ontouchstart' in window) ||
                  (navigator.maxTouchPoints > 0);
  if (isTouch) document.body.classList.add('touch');

  // ================= 音频系统（WebAudio 实时合成） =================
  const AudioSys = (() => {
    let ac = null, master = null, muted = false;
    let tensionGain = null, tensionOsc = null;
    let noiseBuf = null;
    let creepTimer = null;

    function makeNoise() {
      const len = ac.sampleRate * 2;
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      return buf;
    }

    function init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.85;
      master.connect(ac.destination);
      noiseBuf = makeNoise();
      startAmbient();
      setupTension();
      scheduleCreepyNotes();
    }

    // ---- 阴森环境底噪：失谐低频嗡鸣 + 呼吸的次谐音 + 地底阴风 ----
    function startAmbient() {
      // 低频失谐嗡鸣（拍频不安感）
      for (const [f, g] of [[46, 0.045], [46.6, 0.045], [92.5, 0.014]]) {
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const gn = ac.createGain(); gn.gain.value = g;
        o.connect(gn); gn.connect(master); o.start();
      }
      // 呼吸起伏的次谐音（缓慢 LFO）
      const breath = ac.createOscillator(); breath.type = 'sine'; breath.frequency.value = 0.06;
      const breathG = ac.createGain(); breathG.gain.value = 0.012;
      breath.connect(breathG);
      const o3 = ac.createOscillator(); o3.type = 'triangle'; o3.frequency.value = 69.3;
      const g3 = ac.createGain(); g3.gain.value = 0.02;
      breathG.connect(g3.gain);
      o3.connect(g3); g3.connect(master);
      breath.start(); o3.start();
      // 地底阴风：带通噪声 + 滤波器频率缓慢漂移
      const wind = ac.createBufferSource(); wind.buffer = noiseBuf; wind.loop = true;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
      bp.frequency.value = 320; bp.Q.value = 0.7;
      const wg = ac.createGain(); wg.gain.value = 0.035;
      const wLfo = ac.createOscillator(); wLfo.frequency.value = 0.08;
      const wLfoG = ac.createGain(); wLfoG.gain.value = 190;
      wLfo.connect(wLfoG); wLfoG.connect(bp.frequency);
      wind.connect(bp); bp.connect(wg); wg.connect(master);
      wind.start(); wLfo.start();
      // 极低沉的次声脉冲（心跳般的压迫感，4 秒一拍）
      const pulse = ac.createOscillator(); pulse.type = 'sine'; pulse.frequency.value = 30;
      const pg = ac.createGain(); pg.gain.value = 0;
      pulse.connect(pg); pg.connect(master); pulse.start();
      setInterval(() => {
        if (!ac || muted) return;
        const t = ac.currentTime;
        pg.gain.cancelScheduledValues(t);
        pg.gain.setValueAtTime(0, t);
        pg.gain.linearRampToValueAtTime(0.05, t + 0.25);
        pg.gain.exponentialRampToValueAtTime(0.001, t + 2.2);
      }, 4000);
    }

    // ---- 随机阴森音符：走音的八音盒（不协和音程） ----
    function scheduleCreepyNotes() {
      // 小调 + 三全音 + 小二度 的音符池（阴森）
      const pool = [311.13, 329.63, 415.3, 440.0, 466.16, 587.33, 622.25];
      const playNote = () => {
        if (!ac || muted) return;
        const t = ac.currentTime;
        const f = pool[Math.floor(Math.random() * pool.length)];
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        // 轻微走音
        o.detune.value = (Math.random() - 0.5) * 30;
        const g = ac.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.035, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 3.5);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + 3.6);
        // 30% 概率叠一个不协和伴音（小二度）
        if (Math.random() < 0.3) {
          const o2 = ac.createOscillator(); o2.type = 'sine';
          o2.frequency.value = f * 1.06;
          const g2 = ac.createGain();
          g2.gain.setValueAtTime(0, t + 0.15);
          g2.gain.linearRampToValueAtTime(0.02, t + 0.2);
          g2.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
          o2.connect(g2); g2.connect(master);
          o2.start(t + 0.15); o2.stop(t + 3);
        }
      };
      const loop = () => {
        playNote();
        creepTimer = setTimeout(loop, 3500 + Math.random() * 5000);
      };
      loop();
    }

    // ---- 怪物接近张力：锯齿波低鸣，音量随距离 ----
    function setupTension() {
      tensionOsc = ac.createOscillator(); tensionOsc.type = 'sawtooth';
      tensionOsc.frequency.value = 62;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
      tensionGain = ac.createGain(); tensionGain.gain.value = 0;
      tensionOsc.connect(lp); lp.connect(tensionGain); tensionGain.connect(master);
      tensionOsc.start();
    }
    function setTension(prox) { // prox: 0~1
      if (!tensionGain) return;
      const v = muted ? 0 : Math.min(0.09, prox * 0.09);
      tensionGain.gain.setTargetAtTime(v, ac.currentTime, 0.15);
      tensionOsc.frequency.setTargetAtTime(55 + prox * 45, ac.currentTime, 0.3);
    }

    // ---- 事件音效 ----
    function envOsc(type, f0, f1, dur, vol, delay = 0) {
      if (!ac || muted) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function noiseBurst(dur, vol, freq, delay = 0) {
      if (!ac || muted) return;
      const t = ac.currentTime + delay;
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 0.8;
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(bp); bp.connect(g); g.connect(master);
      s.start(t); s.stop(t + dur + 0.05);
    }
    return {
      init,
      setTension,
      toggleMute() {
        muted = !muted;
        if (master) master.gain.setTargetAtTime(muted ? 0 : 0.85, ac.currentTime, 0.05);
        return muted;
      },
      pickup(n) { envOsc('sine', 660 + n * 55, 990 + n * 55, 0.4, 0.06); envOsc('sine', 1320 + n * 110, 1980, 0.25, 0.025, 0.03); },
      hurt() { noiseBurst(0.25, 0.16, 240); envOsc('sawtooth', 180, 60, 0.35, 0.12); },
      die() { envOsc('sawtooth', 160, 28, 1.6, 0.16); noiseBurst(1.2, 0.1, 160, 0.1); },
      teleport() { noiseBurst(0.5, 0.1, 900); envOsc('sine', 200, 1400, 0.4, 0.05); },
      phase() { envOsc('sine', 220, 880, 0.5, 0.05); envOsc('triangle', 330, 1320, 0.5, 0.03); },
      deny() { envOsc('square', 130, 110, 0.12, 0.05); },
      win() { [130.8, 155.6, 196].forEach((f, i) => envOsc('sine', f, f, 1.8, 0.07, i * 0.12)); },
      heartbeat(fast) {
        const iv = fast ? 0.38 : 0.55;
        envOsc('sine', 58, 40, 0.14, 0.16);
        envOsc('sine', 52, 36, 0.12, 0.12, iv * 0.6);
      },
      tick() { envOsc('sine', 90, 70, 0.18, 0.1); },
      flash() { noiseBurst(0.12, 0.06, 3000); }
    };
  })();

  // ================= 工具 =================
  const cellCenter = (x, y) => ({ x: x * CELL + CELL / 2, y: y * CELL + CELL / 2 });
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const cellOf = (px, py) => ({ cx: Math.floor(px / CELL), cy: Math.floor(py / CELL) });
  const inBounds = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ================= 迷宫 =================
  let grid = [];
  let bloodDecals = [];
  let wallCracks = [];
  const spawn = { cx: Math.floor(COLS / 2), cy: Math.floor(ROWS / 2) };

  function generateMaze() {
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(1));
    const stack = [[1, 1]];
    grid[1][1] = 0;
    const dirs = () => shuffle([[2, 0], [-2, 0], [0, 2], [0, -2]]);
    while (stack.length) {
      const [cx, cy] = stack[stack.length - 1];
      let carved = false;
      for (const [dx, dy] of dirs()) {
        const nx = cx + dx, ny = cy + dy;
        if (nx > 0 && ny > 0 && nx < COLS - 1 && ny < ROWS - 1 && grid[ny][nx] === 1) {
          grid[ny][nx] = 0;
          grid[cy + dy / 2][cx + dx / 2] = 0;
          stack.push([nx, ny]);
          carved = true;
          break;
        }
      }
      if (!carved) stack.pop();
    }
    // 拆除部分墙形成环路，避免死胡同被堵死
    for (let i = 0; i < 26; i++) {
      const x = 2 + Math.floor(Math.random() * (COLS - 4));
      const y = 2 + Math.floor(Math.random() * (ROWS - 4));
      if (grid[y][x] === 1 && ((grid[y][x - 1] === 0 && grid[y][x + 1] === 0) || (grid[y - 1][x] === 0 && grid[y + 1][x] === 0)))
        grid[y][x] = 0;
    }
    // 中央重生点开阔
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++)
        grid[spawn.cy + dy][spawn.cx + dx] = 0;
    // 四角传送门空间：挖成 3×3 开阔室，四周不设内墙
    corners.forEach(([x, y]) => {
      const sx = x === 1 ? 1 : x - 2;
      const sy = y === 1 ? 1 : y - 2;
      const ex = x === 1 ? 3 : x;
      const ey = y === 1 ? 3 : y;
      for (let yy = sy; yy <= ey; yy++)
        for (let xx = sx; xx <= ex; xx++)
          if (inBounds(xx, yy)) grid[yy][xx] = 0;
    });
    // 随机血迹（只画在通路格上）
    bloodDecals = [];
    const floorCells = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (grid[y][x] === 0) floorCells.push([x, y]);
    shuffle(floorCells);
    for (let i = 0; i < 26 && i < floorCells.length; i++) {
      const c = cellCenter(floorCells[i][0], floorCells[i][1]);
      bloodDecals.push({
        x: c.x + (Math.random() - 0.5) * 14,
        y: c.y + (Math.random() - 0.5) * 14,
        r: 3 + Math.random() * 9,
        a: 0.10 + Math.random() * 0.18,
        splat: Math.random() < 0.4
      });
    }
    // 墙面裂纹种子
    wallCracks = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (grid[y][x] === 1 && Math.random() < 0.3)
          wallCracks.push({ x, y, s: Math.random() * Math.PI * 2 });
  }

  // ================= 传送门 =================
  const corners = [[1, 1], [COLS - 2, 1], [1, ROWS - 2], [COLS - 2, ROWS - 2]];
  let portals = [];
  function buildPortals() {
    const idxs = LEVELS[currentLevel].portalCorners;
    portals = idxs.map(i => {
      const [x, y] = corners[i];
      const c = cellCenter(x, y);
      return { x: c.x, y: c.y, color: ['#8438ff', '#00c2b8', '#ff3d81', '#ff8c1a'][i], rot: Math.random() * Math.PI * 2 };
    });
  }

  // ================= 实体 =================
  const player = { x: 0, y: 0, hp: MAX_HP, invincibleUntil: 0,
                   phaseUntil: 0, skillReadyAt: 0, portalImmuneUntil: 0, facing: 0 };
  let monsters = [];
  let fragments = [];
  let teleportFx = null;
  let state = 'menu'; // menu | flash | countdown | playing | dying | dead | win
  let stateTimer = 0;
  let deathCount = 0, timeStart = 0, timeWin = 0;
  let allCollected = false;
  let lastCountdownNum = -1;

  function fragInventory() { return fragments.filter(f => f.taken).length; }

  function makeFragment(x, y) {
    const c = cellCenter(x, y);
    return { x: c.x, y: c.y, taken: false, phase: Math.random() * Math.PI * 2 };
  }

  function validFragSpots(minPlayerDist) {
    const spots = [];
    for (let y = 1; y < ROWS - 1; y++)
      for (let x = 1; x < COLS - 1; x++) {
        if (grid[y][x] !== 0) continue;
        if (Math.abs(x - spawn.cx) + Math.abs(y - spawn.cy) <= 5) continue;
        if (portals.some(p => {
          const c = cellOf(p.x, p.y);
          return Math.abs(x - c.cx) <= 1 && Math.abs(y - c.cy) <= 1;
        })) continue;
        if (minPlayerDist > 0) {
          const c = cellCenter(x, y);
          if (Math.hypot(c.x - player.x, c.y - player.y) < minPlayerDist) continue;
        }
        spots.push([x, y]);
      }
    return spots;
  }

  // Fisher-Yates 洗牌 + 最远点采样，保证碎片均匀铺满全图
  function placeFragments() {
    fragments = [];
    const spots = shuffle(validFragSpots(0));
    if (!spots.length) return;
    const first = spots[Math.floor(Math.random() * spots.length)];
    fragments.push(makeFragment(first[0], first[1]));
    while (fragments.length < FRAGMENT_COUNT && fragments.length < spots.length) {
      const cand = shuffle(spots.slice()).slice(0, 40);
      let best = null, bestD = -1;
      for (const [x, y] of cand) {
        const c = cellCenter(x, y);
        if (fragments.some(f => f.x === c.x && f.y === c.y)) continue;
        let d = Infinity;
        for (const f of fragments) d = Math.min(d, Math.hypot(f.x - c.x, f.y - c.y));
        if (d > bestD) { bestD = d; best = [x, y]; }
      }
      if (!best) break;
      fragments.push(makeFragment(best[0], best[1]));
    }
    allCollected = false;
  }

  // 穿墙消耗的碎片重新散落（远离玩家，避开传送门与墙，总量守恒）
  function redropFragments(n) {
    const existing = fragments.map(f => cellOf(f.x, f.y).cx + ',' + cellOf(f.x, f.y).cy);
    const spots = shuffle(validFragSpots(CELL * 5))
      .filter(([x, y]) => !existing.includes(x + ',' + y));
    for (let i = 0; i < n && spots.length; i++) {
      const [x, y] = spots.pop();
      fragments.push(makeFragment(x, y));
    }
    allCollected = false;
    updateHUD();
  }

  function spawnMonsters() {
    const cfg = LEVELS[currentLevel];
    monsters = [];
    const spots = [];
    for (let y = 1; y < ROWS - 1; y++)
      for (let x = 1; x < COLS - 1; x++)
        if (grid[y][x] === 0 && Math.abs(x - spawn.cx) + Math.abs(y - spawn.cy) > 8)
          spots.push([x, y]);
    shuffle(spots);
    const colors = ['#ff2d2d', '#ff8c1a', '#ff3d81', '#9b59ff', '#20c9c9'];
    for (let i = 0; i < cfg.monsterCount && i < spots.length; i++) {
      const c = cellCenter(spots[i][0], spots[i][1]);
      monsters.push({
        x: c.x, y: c.y, r: MONSTER_R,
        speed: cfg.speeds[i],
        glow: i < cfg.glowCount,   // 黑暗中红眼是否可见
        wob: Math.random() * Math.PI * 2,
        color: colors[i % colors.length],
        blink: 0,
        hitFlash: 0
      });
    }
  }

  function resetRun(fullRestart) {
    generateMaze();
    buildPortals();
    const c = cellCenter(spawn.cx, spawn.cy);
    player.x = c.x; player.y = c.y;
    player.hp = MAX_HP;
    player.invincibleUntil = performance.now() + 1500;
    player.phaseUntil = 0;
    player.skillReadyAt = 0;
    player.portalImmuneUntil = 0;
    allCollected = false;
    placeFragments();
    spawnMonsters();
    if (fullRestart) { deathCount = 0; timeStart = performance.now(); }
    updateHUD();
  }

  // ================= 碰撞 =================
  function collideMove(e, dx, dy, r, ignoreWalls) {
    if (ignoreWalls) {
      e.x = Math.max(r, Math.min(W - r, e.x + dx));
      e.y = Math.max(r, Math.min(H - r, e.y + dy));
      return;
    }
    e.x += dx;
    resolveAxis(e, r, 'x');
    e.y += dy;
    resolveAxis(e, r, 'y');
  }
  function resolveAxis(e, r, axis) {
    const c0 = cellOf(e.x, e.y);
    for (let gy = c0.cy - 1; gy <= c0.cy + 1; gy++)
      for (let gx = c0.cx - 1; gx <= c0.cx + 1; gx++) {
        if (!inBounds(gx, gy) || grid[gy][gx] !== 1) continue;
        const nx = Math.max(gx * CELL, Math.min(e.x, gx * CELL + CELL));
        const ny = Math.max(gy * CELL, Math.min(e.y, gy * CELL + CELL));
        const ddx = e.x - nx, ddy = e.y - ny;
        const d2 = ddx * ddx + ddy * ddy;
        if (d2 < r * r) {
          const d = Math.sqrt(d2) || 0.001;
          const push = r - d;
          e.x += (ddx / d) * push;
          e.y += (ddy / d) * push;
        }
      }
    e.x = Math.max(r, Math.min(W - r, e.x));
    e.y = Math.max(r, Math.min(H - r, e.y));
  }
  function snapOutOfWalls() {
    const c0 = cellOf(player.x, player.y);
    if (inBounds(c0.cx, c0.cy) && grid[c0.cy][c0.cx] === 0) return;
    const q = [[c0.cx, c0.cy]];
    const seen = new Set([c0.cx + ',' + c0.cy]);
    while (q.length) {
      const [x, y] = q.shift();
      if (inBounds(x, y) && grid[y][x] === 0) {
        const c = cellCenter(x, y);
        player.x = c.x; player.y = c.y;
        return;
      }
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        const k = nx + ',' + ny;
        if (inBounds(nx, ny) && !seen.has(k)) { seen.add(k); q.push([nx, ny]); }
      }
    }
  }

  // ================= 流场寻路（BFS） =================
  let distField = null;
  function computeFlowField() {
    distField = Array.from({ length: ROWS }, () => Array(COLS).fill(Infinity));
    const pc = cellOf(player.x, player.y);
    if (!inBounds(pc.cx, pc.cy)) return;
    const q = [[pc.cx, pc.cy]];
    distField[pc.cy][pc.cx] = 0;
    let head = 0;
    while (head < q.length) {
      const [x, y] = q[head++];
      const d = distField[y][x];
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (inBounds(nx, ny) && grid[ny][nx] === 0 && distField[ny][nx] === Infinity) {
          distField[ny][nx] = d + 1;
          q.push([nx, ny]);
        }
      }
    }
  }

  // ================= 技能 =================
  function tryPhaseSkill(now) {
    if (state !== 'playing') return;
    if (now < player.skillReadyAt) { AudioSys.deny(); return; }
    if (fragInventory() < FRAG_COST) { AudioSys.deny(); return; }
    // 消耗 3 个已收集碎片并重新散落
    let need = FRAG_COST;
    for (let i = fragments.length - 1; i >= 0 && need > 0; i--) {
      if (fragments[i].taken) { fragments.splice(i, 1); need--; }
    }
    redropFragments(FRAG_COST);
    player.phaseUntil = now + PHASE_MS;
    player.skillReadyAt = now + SKILL_CD_MS;
    AudioSys.phase();
  }

  // ================= 输入 =================
  let mouse = { x: W / 2, y: H / 2 };
  function toCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (H / rect.height)
    };
  }
  canvas.addEventListener('mousemove', e => { mouse = toCanvasPos(e); });

  // 触屏虚拟摇杆
  let joy = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0, mag: 0 };
  function joyRadius() { return 50; }
  function updateKnob() {
    const k = joyRadius();
    const cl = Math.min(1, joy.mag / k);
    joyKnob.style.transform = `translate(${joy.dx * cl}px, ${joy.dy * cl}px)`;
  }
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (!joy.active && t.clientX < window.innerWidth * 0.55) {
        joy.active = true; joy.id = t.identifier;
        joy.bx = t.clientX; joy.by = t.clientY; joy.dx = 0; joy.dy = 0; joy.mag = 0;
        joyBase.style.display = 'block';
        joyBase.style.left = (t.clientX - 60) + 'px';
        joyBase.style.top = (t.clientY - 60) + 'px';
      }
    }
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (joy.active && t.identifier === joy.id) {
        let dx = t.clientX - joy.bx, dy = t.clientY - joy.by;
        const d = Math.hypot(dx, dy);
        if (d > joyRadius()) { dx = dx / d * joyRadius(); dy = dy / d * joyRadius(); }
        joy.dx = dx; joy.dy = dy; joy.mag = Math.hypot(dx, dy);
        updateKnob();
      }
    }
  }, { passive: false });
  function endTouch(e) {
    for (const t of e.changedTouches) {
      if (joy.active && t.identifier === joy.id) {
        joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0; joy.mag = 0;
        joyBase.style.display = 'none';
      }
    }
  }
  canvas.addEventListener('touchend', endTouch);
  canvas.addEventListener('touchcancel', endTouch);

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); tryPhaseSkill(performance.now()); }
    if (e.key === 'm' || e.key === 'M') { AudioSys.init(); AudioSys.toggleMute(); }
  });
  phaseBtn.addEventListener('click', () => tryPhaseSkill(performance.now()));
  muteBtn.addEventListener('click', () => { AudioSys.init(); const m = AudioSys.toggleMute(); muteBtn.textContent = m ? '🔇' : '🔊'; });

  // ================= HUD =================
  function updateHUD() {
    heartsEl.textContent = '❤'.repeat(Math.max(0, player.hp)) + '🖤'.repeat(MAX_HP - Math.max(0, player.hp));
    const inv = fragInventory();
    fragEl.textContent = `碎片 ${inv} / ${FRAGMENT_COUNT}`;
  }
  function updateSkillHUD(now) {
    if (state !== 'playing') { phaseBtn.classList.add('cd'); return; }
    if (now < player.phaseUntil) {
      skillEl.textContent = '穿墙中！';
      skillEl.className = '';
      phaseBtn.classList.remove('cd');
      phaseBtn.textContent = '穿墙中';
    } else if (now < player.skillReadyAt) {
      skillEl.textContent = `穿墙 ${((player.skillReadyAt - now) / 1000).toFixed(1)}s`;
      skillEl.className = '';
      phaseBtn.classList.add('cd');
      phaseBtn.textContent = '冷却中';
    } else if (fragInventory() >= FRAG_COST) {
      skillEl.textContent = isTouch ? '穿墙：就绪 · 耗3碎片' : '空格穿墙 · 耗3碎片';
      skillEl.className = 'ready';
      phaseBtn.classList.remove('cd');
      phaseBtn.textContent = '穿墙';
    } else {
      skillEl.textContent = '碎片不足3个';
      skillEl.className = '';
      phaseBtn.classList.add('cd');
      phaseBtn.textContent = '碎片不足';
    }
  }

  // ================= 更新 =================
  let lastFlowTime = 0;
  let nextBeatAt = 0;

  function update(now) {
    if (state !== 'playing') return;

    const phasing = now < player.phaseUntil;
    let vx = 0, vy = 0, moving = false;
    if (isTouch && joy.active && joy.mag > 10) {
      const mag = Math.min(1, joy.mag / joyRadius());
      vx = (joy.dx / (joy.mag || 1)) * PLAYER_SPEED * mag;
      vy = (joy.dy / (joy.mag || 1)) * PLAYER_SPEED * mag;
      moving = true;
      player.facing = Math.atan2(joy.dy, joy.dx);
    } else if (!isTouch) {
      const mdx = mouse.x - player.x, mdy = mouse.y - player.y;
      const md = Math.hypot(mdx, mdy);
      if (md > 14) {
        vx = (mdx / md) * PLAYER_SPEED;
        vy = (mdy / md) * PLAYER_SPEED;
        moving = true;
      }
    }
    if (moving) {
      collideMove(player, vx, vy, PLAYER_R, phasing);
      if (isTouch) player.facing = player.facing;
      else player.facing = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    }
    if (!phasing && player._wasPhasing) snapOutOfWalls();
    player._wasPhasing = phasing;

    if (now - lastFlowTime > 150) { computeFlowField(); lastFlowTime = now; }

    // 怪物
    let nearest = Infinity;
    for (const m of monsters) {
      const mc = cellOf(m.x, m.y);
      let target = null, best = Infinity;
      if (distField) {
        const here = distField[mc.cy] && distField[mc.cy][mc.cx];
        if (here !== undefined && here !== Infinity) {
          const cands = [];
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = mc.cx + dx, ny = mc.cy + dy;
            if (inBounds(nx, ny) && grid[ny][nx] === 0) {
              const nd = distField[ny][nx];
              if (nd < best) { best = nd; cands.length = 0; cands.push([nx, ny]); }
              else if (nd === best) cands.push([nx, ny]);
            }
          }
          if (cands.length) target = cands[Math.floor(Math.random() * cands.length)];
        }
      }
      const tp = target ? cellCenter(target[0], target[1]) : cellCenter(mc.cx, mc.cy);
      const tdx = tp.x - m.x, tdy = tp.y - m.y;
      const td = Math.hypot(tdx, tdy);
      if (td > 0.5) {
        m.x += (tdx / td) * m.speed;
        m.y += (tdy / td) * m.speed;
      }
      m.wob += 0.08 + m.speed * 0.07;
      if (Math.random() < 0.003) m.blink = 8;
      if (m.blink > 0) m.blink--;
      nearest = Math.min(nearest, Math.hypot(m.x - player.x, m.y - player.y));
    }
    // 怪物分离力（防扎堆）
    for (let i = 0; i < monsters.length; i++)
      for (let j = i + 1; j < monsters.length; j++) {
        const a = monsters[i], b = monsters[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const minD = (a.r + b.r) * 1.35;
        if (d < minD) {
          const push = (minD - d) * 0.5;
          const ux = dx / d, uy = dy / d;
          a.x -= ux * push; a.y -= uy * push;
          b.x += ux * push; b.y += uy * push;
        }
      }

    // 张力音效（怪物接近度）
    if (distField) AudioSys.setTension(Math.max(0, 1 - nearest / 260));

    // 碰撞玩家
    for (const m of monsters) {
      if (now > player.invincibleUntil && Math.hypot(m.x - player.x, m.y - player.y) < m.r + PLAYER_R) {
        player.hp--;
        m.hitFlash = 1;
        player.invincibleUntil = now + INVINCIBLE_MS;
        AudioSys.hurt();
        updateHUD();
        if (player.hp <= 0) {
          state = 'dying'; stateTimer = now; deathCount++;
          AudioSys.die();
          return;
        }
      }
    }

    // 残血心跳
    if (player.hp <= 2 && now >= nextBeatAt) {
      AudioSys.heartbeat(player.hp === 1);
      nextBeatAt = now + (player.hp === 1 ? 900 : 1400);
    }

    // 收集碎片
    if (!allCollected) {
      let anyLeft = false;
      for (const f of fragments) {
        if (!f.taken) {
          if (Math.hypot(f.x - player.x, f.y - player.y) < PLAYER_R + 12) {
            f.taken = true;
            AudioSys.pickup(fragInventory());
          } else anyLeft = true;
        }
      }
      if (!anyLeft) allCollected = true;
      updateHUD();
    }

    // 传送门
    if (now > player.portalImmuneUntil) {
      for (let i = 0; i < portals.length; i++) {
        const p = portals[i];
        if (Math.hypot(p.x - player.x, p.y - player.y) < PORTAL_R + PLAYER_R - 4) {
          const others = portals.filter((_, j) => j !== i);
          const dest = others[Math.floor(Math.random() * others.length)];
          teleportFx = { x: player.x, y: player.y, t: now, color: p.color };
          player.x = dest.x; player.y = dest.y;
          player.portalImmuneUntil = now + PORTAL_COOLDOWN_MS;
          AudioSys.teleport();
          computeFlowField();
          break;
        }
      }
    }

    // 胜利：集齐后回中央
    if (allCollected) {
      const c = cellCenter(spawn.cx, spawn.cy);
      if (Math.hypot(c.x - player.x, c.y - player.y) < 26) {
        state = 'win'; timeWin = now;
        AudioSys.win();
        AudioSys.setTension(0);
        showOverlay('win');
        return;
      }
    }
  }

  // ================= 绘制 =================
  function drawWalls() {
    const bright = LEVELS[currentLevel].bright;
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (grid[y][x] === 1) {
          ctx.fillStyle = bright ? '#3d2e35' : '#1c1518';
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
          ctx.fillStyle = bright ? '#524052' : '#2a1e22';
          ctx.fillRect(x * CELL, y * CELL, CELL, 3);
          ctx.strokeStyle = bright ? 'rgba(150, 30, 35, 0.3)' : 'rgba(120, 20, 25, 0.25)';
          ctx.lineWidth = 1;
          ctx.strokeRect(x * CELL + 0.5, y * CELL + 0.5, CELL - 1, CELL - 1);
        }
    // 墙面裂纹
    ctx.strokeStyle = 'rgba(140, 15, 20, 0.4)';
    ctx.lineWidth = 1.2;
    for (const w of wallCracks) {
      const px = w.x * CELL + CELL / 2, py = w.y * CELL + CELL / 2;
      ctx.beginPath();
      ctx.moveTo(px - 9, py - 7 + 3 * Math.sin(w.s));
      ctx.lineTo(px + 2 * Math.cos(w.s), py + 1);
      ctx.lineTo(px + 8, py + 8 * Math.cos(w.s));
      ctx.stroke();
    }
  }

  function drawFloor() {
    const bright = LEVELS[currentLevel].bright;
    ctx.fillStyle = bright ? '#191420' : '#0b090c';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = bright ? '#1d1723' : '#0d0a0e';
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if ((x + y) % 2 === 0 && grid[y][x] === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    // 血迹
    for (const b of bloodDecals) {
      ctx.fillStyle = `rgba(90, 8, 12, ${b.a})`;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      if (b.splat) {
        ctx.fillStyle = `rgba(110, 10, 15, ${b.a * 0.8})`;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc(b.x + Math.cos(b.r + i * 2.1) * (b.r + 4), b.y + Math.sin(b.r + i * 2.1) * (b.r + 3), 1.6, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function drawPortals(now) {
    for (const p of portals) {
      p.rot += 0.03;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = 0.85;
      for (const s of [1, 0.62]) {
        ctx.beginPath();
        ctx.ellipse(0, 0, PORTAL_R * s, PORTAL_R * 0.55 * s, p.rot * (s === 1 ? 1 : -1.4), 0, Math.PI * 2);
        ctx.stroke();
      }
      const g = ctx.createRadialGradient(0, 0, 2, 0, 0, PORTAL_R * 1.4);
      g.addColorStop(0, p.color + '55');
      g.addColorStop(1, p.color + '00');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, PORTAL_R * 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawFragments(now) {
    for (const f of fragments) {
      if (f.taken) continue;
      const pulse = 1 + Math.sin(now / 300 + f.phase) * 0.15;
      ctx.save();
      ctx.translate(f.x, f.y + Math.sin(now / 500 + f.phase) * 2.5);
      ctx.rotate(now / 900 + f.phase);
      ctx.fillStyle = '#e8c15a';
      ctx.beginPath();
      ctx.moveTo(0, -7 * pulse); ctx.lineTo(4.5, 0); ctx.lineTo(0, 7 * pulse); ctx.lineTo(-4.5, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff2c0';
      ctx.beginPath();
      ctx.moveTo(0, -3.5 * pulse); ctx.lineTo(2, 0); ctx.lineTo(0, 3.5 * pulse); ctx.lineTo(-2, 0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function drawMonster(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    // 阴影本体（近黑，仅轮廓可辨）
    const squish = 1 + Math.sin(m.wob) * 0.07;
    ctx.scale(squish, 2 - squish);
    ctx.fillStyle = m.hitFlash > 0 ? '#5a1013' : '#07030a';
    ctx.beginPath(); ctx.arc(0, 0, m.r, 0, Math.PI * 2); ctx.fill();
    // 尖刺
    ctx.fillStyle = m.hitFlash > 0 ? '#7a1518' : '#0a050d';
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2 + m.wob * 0.3;
      const len = m.r + 5 + Math.sin(m.wob * 1.4 + i) * 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.16) * m.r, Math.sin(a - 0.16) * m.r);
      ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
      ctx.lineTo(Math.cos(a + 0.16) * m.r, Math.sin(a + 0.16) * m.r);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // 判断怪物是否被手电筒光束照到（距离 + 扇形夹角）
  function isMonsterLit(m) {
    if (state === 'flash') return true; // 开局闪图时全图可见
    const dx = m.x - player.x, dy = m.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d > TORCH_RANGE + m.r) return false;
    const aim = isTouch ? player.facing : Math.atan2(mouse.y - player.y, mouse.x - player.x);
    let da = Math.atan2(dy, dx) - aim;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    // 允许怪物身体边缘（半径）擦到光束边缘也算照亮
    const margin = Math.atan2(m.r, Math.max(d, 1)) * 0.6;
    return Math.abs(da) < TORCH_SPREAD + margin;
  }

  function drawMonsterEyes(m) {
    // 血红眼睛：明亮关全可见；黑暗关只有「红眼怪」在暗中发光，
    // 其余怪物必须被手电筒照到才能看见眼睛
    const visible = LEVELS[currentLevel].bright || m.glow || isMonsterLit(m);
    if (!visible) return;
    const ang = Math.atan2(player.y - m.y, player.x - m.x);
    const squish = 1 + Math.sin(m.wob) * 0.07;
    const ey = m.y + 0, ex = m.x;
    ctx.save();
    ctx.translate(ex, ey);
    ctx.scale(squish, 2 - squish);
    if (m.blink > 3) {
      ctx.restore();
      return;
    }
    for (const side of [-1, 1]) {
      const px = Math.cos(ang + side * 0.42) * m.r * 0.45;
      const py = Math.sin(ang + side * 0.42) * m.r * 0.45;
      const g = ctx.createRadialGradient(px, py, 0, px, py, 9);
      g.addColorStop(0, '#ff2020');
      g.addColorStop(0.35, '#d00510');
      g.addColorStop(1, 'rgba(160, 0, 8, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawPlayer(now) {
    const blink = now < player.invincibleUntil && Math.floor(now / 100) % 2 === 0;
    if (blink) return;
    const ang = player.facing;
    const phasing = now < player.phaseUntil;
    ctx.save();
    ctx.translate(player.x, player.y);
    // 手电筒光晕（很淡的暖光，主体照明由黑暗遮罩的开孔呈现）
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
    g.addColorStop(0, phasing ? 'rgba(163, 113, 247, 0.5)' : 'rgba(255, 235, 190, 0.28)');
    g.addColorStop(1, 'rgba(255, 235, 190, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
    // 身体：苍白幸存者
    ctx.globalAlpha = phasing ? 0.45 + 0.3 * Math.sin(now / 60) : 1;
    ctx.fillStyle = phasing ? '#a371f7' : '#cfc4b8';
    ctx.beginPath(); ctx.arc(0, 0, PLAYER_R, 0, Math.PI * 2); ctx.fill();
    // 手持手电筒（朝向面前）
    ctx.save();
    ctx.rotate(ang);
    ctx.fillStyle = '#2a2a30';
    ctx.fillRect(PLAYER_R - 3, -2.5, 10, 5);       // 筒身
    ctx.fillStyle = '#ffe9b0';
    ctx.fillRect(PLAYER_R + 6, -3.5, 3, 7);         // 灯头
    ctx.restore();
    // 眼睛（望向前方）
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0d1117';
    for (const side of [-1, 1]) {
      const ex = Math.cos(ang + side * 0.45) * 5, ey = Math.sin(ang + side * 0.45) * 5;
      ctx.beginPath(); ctx.arc(ex, ey, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // 黑暗遮罩：手电筒扇形视野（多层锥形叠加形成软边）
  function drawDarkness(now) {
    dctx.globalCompositeOperation = 'source-over';
    dctx.clearRect(0, 0, W, H);
    dctx.fillStyle = 'rgba(2, 1, 3, 0.965)';
    dctx.fillRect(0, 0, W, H);
    dctx.globalCompositeOperation = 'destination-out';
    // 脚下微光
    const near = dctx.createRadialGradient(player.x, player.y, 4, player.x, player.y, 52);
    near.addColorStop(0, 'rgba(255,255,255,0.6)');
    near.addColorStop(1, 'rgba(255,255,255,0)');
    dctx.fillStyle = near;
    dctx.beginPath(); dctx.arc(player.x, player.y, 52, 0, Math.PI * 2); dctx.fill();
    // 手电筒锥形光束（带闪烁）
    const flicker = 1 + Math.sin(now / 47) * 0.025 + Math.sin(now / 13.7) * 0.012;
    const range = TORCH_RANGE * flicker;
    const aim = isTouch ? player.facing : Math.atan2(mouse.y - player.y, mouse.x - player.x);
    if (isTouch) {
      if (joy.active && joy.mag > 10) player.facing = Math.atan2(joy.dy, joy.dx);
    }
    for (let i = 0; i < 4; i++) {
      const hs = TORCH_SPREAD * (1 - i * 0.22);
      const alpha = 1 - i * 0.2;
      const g = dctx.createRadialGradient(player.x, player.y, 10, player.x, player.y, range);
      g.addColorStop(0, `rgba(255,255,255,${alpha})`);
      g.addColorStop(0.7, `rgba(255,255,255,${alpha * 0.6})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      dctx.fillStyle = g;
      dctx.beginPath();
      dctx.moveTo(player.x, player.y);
      dctx.arc(player.x, player.y, range, aim - hs, aim + hs);
      dctx.closePath();
      dctx.fill();
    }
    dctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(darkCv, 0, 0);
    // 暖色光束染色
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const warm = ctx.createRadialGradient(player.x, player.y, 10, player.x, player.y, range);
    warm.addColorStop(0, 'rgba(255, 240, 190, 0.10)');
    warm.addColorStop(1, 'rgba(255, 240, 190, 0)');
    ctx.fillStyle = warm;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.arc(player.x, player.y, range, aim - TORCH_SPREAD, aim + TORCH_SPREAD);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function draw(now) {
    drawFloor();
    drawWalls();
    drawPortals(now);
    drawFragments(now);
    for (const m of monsters) {
      drawMonster(m);
      if (m.hitFlash > 0) m.hitFlash -= 0.05;
    }
    if (state !== 'dead') drawPlayer(now);

    // 传送特效
    if (teleportFx && now - teleportFx.t < 500) {
      const t = (now - teleportFx.t) / 500;
      ctx.strokeStyle = teleportFx.color;
      ctx.globalAlpha = 1 - t;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(teleportFx.x, teleportFx.y, 10 + t * 42, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 黑暗遮罩（闪图阶段全图可见；第一关明亮无遮罩）
    const cfg = LEVELS[currentLevel];
    if (!cfg.bright && (state === 'playing' || state === 'dying' || state === 'countdown')) {
      drawDarkness(now);
      // 透出微光的碎片（第五关：黑暗中不可被观察）
      if (!cfg.hiddenFrags) {
        for (const f of fragments) {
          if (f.taken) continue;
          const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 9);
          g.addColorStop(0, 'rgba(232, 193, 90, 0.5)');
          g.addColorStop(1, 'rgba(232, 193, 90, 0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(f.x, f.y, 9, 0, Math.PI * 2); ctx.fill();
        }
      }
      // 传送门微光
      for (const p of portals) {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 22);
        g.addColorStop(0, p.color + '66');
        g.addColorStop(1, p.color + '00');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, 22, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 怪物红眼（仅被照亮时可见，画在最上层）
    for (const m of monsters) drawMonsterEyes(m);

    // 集齐后的中央出口指引
    if (state === 'playing' && allCollected) {
      const c = cellCenter(spawn.cx, spawn.cy);
      const g = ctx.createRadialGradient(c.x, c.y, 4, c.x, c.y, 46 + Math.sin(now / 250) * 8);
      g.addColorStop(0, 'rgba(80, 255, 140, 0.5)');
      g.addColorStop(1, 'rgba(80, 255, 140, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(c.x, c.y, 52, 0, Math.PI * 2); ctx.fill();
    }

    // 残血红脉冲
    if (state === 'playing' && player.hp === 1) {
      const pulse = (Math.sin(now / 300) + 1) / 2;
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
      g.addColorStop(0, 'rgba(140, 0, 10, 0)');
      g.addColorStop(1, `rgba(140, 0, 10, ${0.22 + pulse * 0.16})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // ---- 开局闪图：全图短暂可见 ----
    if (state === 'flash') {
      const t = (now - stateTimer) / FLASH_MS;
      ctx.fillStyle = `rgba(220, 210, 190, ${0.35 * (1 - t)})`;
      ctx.fillRect(0, 0, W, H);
      if (now - stateTimer >= FLASH_MS) {
        state = 'countdown'; stateTimer = now; lastCountdownNum = -1;
      }
    }

    // ---- 倒计时画面 ----
    if (state === 'countdown') {
      const remain = COUNTDOWN_MS - (now - stateTimer);
      const num = Math.ceil(remain / 1000);
      if (num !== lastCountdownNum && num > 0) {
        lastCountdownNum = num;
        AudioSys.tick();
      }
      const frac = (remain % 1000) / 1000;
      const scale = 1 + (1 - frac) * 0.25;
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.scale(scale, scale);
      ctx.font = 'bold 120px "Georgia", serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = `rgba(150, 10, 18, ${0.55 + frac * 0.45})`;
      ctx.shadowColor = 'rgba(160, 10, 20, 0.8)';
      ctx.shadowBlur = 32;
      ctx.fillText(String(Math.max(1, num)), 0, 0);
      ctx.restore();
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(190, 170, 170, 0.75)';
      ctx.fillText('它 们 就 要 来 了 ……', W / 2, H / 2 + 92);
      if (remain <= 0) {
        state = 'playing';
        timeStart = now;
        nextBeatAt = 0;
      }
    }

    // ---- 死亡演出 ----
    if (state === 'dying') {
      const t = Math.min(1, (now - stateTimer) / 1200);
      ctx.fillStyle = `rgba(8, 1, 2, ${t * 0.75})`;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = `rgba(190, 30, 30, ${t})`;
      ctx.font = 'bold 64px "Georgia", serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(160, 10, 20, 0.9)';
      ctx.shadowBlur = 28;
      ctx.fillText('你 死 了', W / 2, H / 2);
      ctx.shadowBlur = 0;
      if (t >= 1) {
        state = 'dead';
        AudioSys.setTension(0);
        showOverlay('dead');
      }
    }
  }

  // ================= Overlay =================
  function renderLevelGrid() {
    levelGrid.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const best = store.get('mazeBest_' + i);
      const b = document.createElement('button');
      b.className = 'lvBtn';
      b.innerHTML =
        `<span class="lvName">${lv.name}<br>${lv.sub}</span>` +
        `<span class="lvSub">${lv.desc}</span>` +
        (best ? `<span class="lvBest">最佳 ${best}s</span>` : '');
      b.onclick = () => startGame(i);
      levelGrid.appendChild(b);
    });
  }

  let scareTimer = null;
  function showOverlay(kind) {
    if (scareTimer) { clearTimeout(scareTimer); scareTimer = null; }
    jumpscare.classList.add('hidden');
    overlay.classList.remove('scare');
    ovText.style.display = '';
    overlay.classList.remove('hidden');
    if (kind === 'menu') {
      ovTitle.textContent = '暗 渊 迷 宫';
      ovTitle.style.color = '';
      ovTitle.style.textShadow = '';
      const ctl = isTouch
        ? '左侧虚拟摇杆移动 · 右下按钮穿墙（耗3碎片）<br>传送门随机传送 · 被触碰 3 次即死'
        : '鼠标引导方向 · 空格穿墙（耗 3 碎片）<br>传送门随机传送 · 被触碰 3 次即死';
      ovText.innerHTML = `收集 9 块碎片，回到中央出口逃出生天。<br>${ctl}`;
      levelGrid.classList.remove('hidden');
      ovBtns.classList.add('hidden');
      renderLevelGrid();
    } else {
      levelGrid.classList.add('hidden');
      ovBack.onclick = () => showOverlay('menu');
      if (kind === 'dead') {
        ovTitle.textContent = '';
        ovTitle.style.color = '';
        ovTitle.style.textShadow = '';
        ovText.style.display = 'none';
        ovBtns.classList.add('hidden');
        jumpscare.classList.remove('hidden');
        overlay.classList.add('scare');
        scareTimer = setTimeout(() => {
          jumpscare.classList.add('hidden');
          overlay.classList.remove('scare');
          ovText.style.display = '';
          ovTitle.textContent = '你 死 了';
          ovText.innerHTML = `黑暗吞噬了你…… 本局累计死亡 ${deathCount} 次。`;
          ovBtn.textContent = '重 来';
          ovBtn.onclick = () => startGame(currentLevel);
          ovBtns.classList.remove('hidden');
        }, 1100);
      } else if (kind === 'win') {
        ovBtns.classList.remove('hidden');
        const secs = ((timeWin - timeStart) / 1000).toFixed(1);
        const key = 'mazeBest_' + currentLevel;
        const prev = store.get(key);
        if (prev === null || +secs < +prev) store.set(key, secs);
        ovTitle.textContent = '逃 出 深 渊';
        ovTitle.style.color = '#2ea043';
        ovTitle.style.textShadow = '0 0 18px rgba(60, 220, 110, 0.5)';
        const lv = LEVELS[currentLevel];
        ovText.innerHTML = `${lv.name} · ${lv.sub}<br>用时 ${secs} 秒 · 死亡 ${deathCount} 次` +
          (currentLevel < LEVELS.length - 1 ? '<br>更深的黑暗在下一夜等待……' : '<br>你熬过了所有夜晚。');
        ovBtn.textContent = currentLevel < LEVELS.length - 1 ? '下 一 夜' : '再 来 一 局';
        ovBtn.onclick = () => startGame(currentLevel < LEVELS.length - 1 ? currentLevel + 1 : currentLevel);
      }
    }
  }

  function startGame(levelIdx) {
    if (typeof levelIdx === 'number') currentLevel = levelIdx;
    AudioSys.init();
    overlay.classList.add('hidden');
    lvNameEl.textContent = LEVELS[currentLevel].name + ' · ' + LEVELS[currentLevel].sub;
    resetRun(true);
    state = 'flash';
    stateTimer = performance.now();
    lastCountdownNum = -1;
    AudioSys.flash();
    updateHUD();
  }

  // ================= 屏幕自适应 =================
  function fitCanvas() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const hudH = document.getElementById('hud').offsetHeight || 40;
    const scale = Math.min((vw * 0.96) / W, (vh - hudH - 30) / H, 1.15);
    canvas.style.width = Math.round(W * scale) + 'px';
    canvas.style.height = Math.round(H * scale) + 'px';
    document.getElementById('hud').style.width = Math.round(W * scale) + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 150));
  if (isTouch) tipEl.textContent = '摇杆移动 · 右下按钮穿墙（耗3碎片）';

  // ================= 主循环 =================
  function loop(now) {
    update(now);
    draw(now);
    updateSkillHUD(now);
    requestAnimationFrame(loop);
  }

  // 初始化（注意：fitCanvas 必须在画布常量就绪之后调用）
  generateMaze();
  buildPortals();
  const _c0 = cellCenter(spawn.cx, spawn.cy);
  player.x = _c0.x; player.y = _c0.y;
  placeFragments();
  spawnMonsters();
  fitCanvas();
  showOverlay('menu');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
