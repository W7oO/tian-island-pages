<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>田田｜展位造型预览</title>
<style>body{margin:0;background:#e9e6db;color:#2c4c45;font:16px/1.7 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:30px}h1{font-size:26px;margin:0}p{margin:6px 0 20px}section{display:grid;grid-template-columns:1fr 1fr;gap:22px}article{background:#f4f0e5;border:1px solid #d2cbb8;border-radius:18px;overflow:hidden}canvas{display:block;width:100%;height:410px;touch-action:none}h2{font-size:20px;margin:12px 24px 0}article p{margin:5px 24px 22px}button{background:#355c57;color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;margin-top:18px}@media(max-width:700px){main{padding:18px}section{grid-template-columns:1fr}canvas{height:320px}}</style>
<script type="importmap">{"imports":{"three":"./island-preview/vendor/three/build/three.module.js","three/addons/":"./island-preview/vendor/three/examples/jsm/"}}</script>
<main><h1>田田 · 两个展位造型预览</h1><p>单指或鼠标拖动查看造型，双指或滚轮缩放。仅本地候选，尚未接入小岛。</p><section><article><canvas id="data"></canvas><h2>足球数据装置</h2><p>低矮基座、弧形半透明柱体与足球，柱体轻微起伏。</p></article><article><canvas id="desktop"></canvas><h2>桌面搭子</h2><p>圆角小电脑与像素表情，旁边放置小三角魔方和计时器。</p></article></section><button id="motion" aria-pressed="true">暂停动态</button></main>
<script type="module">
import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{dataSculpture,desktopCompanion}from'./island-preview/exhibit-proposals.js';
const setups=[],reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;let motion=!reduced;const button=document.querySelector('#motion');function sync(){button.textContent=motion?'暂停动态':'开启动态';button.setAttribute('aria-pressed',String(motion))}sync();button.onclick=()=>{motion=!motion;sync()};
for(const[id,build]of[['data',dataSculpture],['desktop',desktopCompanion]]){const canvas=document.getElementById(id),scene=new T.Scene();scene.background=new T.Color('#e4e2d5');const renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;const camera=new T.PerspectiveCamera(34,1,.1,60);camera.position.set(5,4.6,7.4);const controls=new OrbitControls(camera,canvas);controls.target.set(0,1,0);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=6;controls.maxDistance=15;controls.maxPolarAngle=1.4;scene.add(new T.HemisphereLight('#fff7df','#8fa797',2.3));const sun=new T.DirectionalLight('#ffedcb',3);sun.position.set(-4,7,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const floor=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:'#d5d8c5',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const model=build();scene.add(model.root);const resize=()=>{const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};new ResizeObserver(resize).observe(canvas);resize();setups.push({id,renderer,camera,controls,scene,model});}
function frame(t){if(!document.hidden)for(const s of setups){s.model.update(t*.001,motion);s.controls.update();s.renderer.render(s.scene,s.camera)}requestAnimationFrame(frame)}requestAnimationFrame(frame);window.proposalDebug={ready:true,stats:()=>setups.map(s=>({id:s.id,...s.model.stats(),triangles:s.renderer.info.render.triangles})),capture:id=>setups.find(s=>s.id===id).renderer.domElement.toDataURL('image/png')};
</script></html>
