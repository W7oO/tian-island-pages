</main><article id="full-story" hidden></article><script id="story-data" type="application/json">{"blocks": [{"tag": "h2", "html": "钢铁少年：保尔·柯察金在盖茨海德的岁月"}, {"tag": "h2", "html": "一、寄人篱下"}, {"tag": "p", "html": "保尔·柯察金被送到里德太太家的时候，才十岁。"}, {"tag": "p", "html": "他父亲是个锅炉工，母亲在生他之后就落下了病根，没几年就去了。父亲又续娶了，没多久也病死在工地上。亲戚们开会研究这个烫手山芋，最后决定把他送到乡下去——城里的亲戚都没那个闲钱和闲心养一个工人家的孤儿。最后是母亲的兄弟里德先生答应下来，但里德先生也在保尔到这儿不久后病死了，照顾保尔的担子就这样落到了里德太太一个人头上。"}, {"tag": "p", "html": "里德太太是个高大的女人，皮肤黝黑，身材粗壮，眉毛浓密而低垂，下唇厚厚地外翻。她看上去严厉而专横，一看就是那种在家里说了算的女人。她自己有一儿三女，加上保尔这个外来者，这栋红房子里就挤了六个孩子，但只有保尔一个是外人。"}, {"tag": "p", "html": "保尔到盖茨海德的第一天，里德太太就把他打量了个够。"}, {"tag": "p", "html": "&quot;就这个？&quot;她扭头对管家贝茜说，&quot;比我想象的还瘦。身上那一股工人家的味道，怎么洗都洗不干净。&quot;"}, {"tag": "p", "html": "保尔没说话。他不善于说话，尤其不善于和这种居高临下的女人说话。他只是站在客厅里，黑色的眼睛直直地盯着地板，两只手攥在身体两侧，像是随时准备干一架的样子。"}, {"tag": "p", "html": "他确实不习惯。在城里的时候，他和父亲住在铁路边的小房子里，邻居都是工人和码头搬运工，说话大声嚷嚷，动不动就挥拳头。保尔没上过学，但他有一身蛮力，有股不怕死的劲儿。父亲还在的时候，常常带着他去车站帮忙，给他家挣点外快。他见过的世界，是烟囱、蒸汽、机油、叫骂声和偶尔递过来的一片黑面包的世界。"}, {"tag": "p", "html": "现在他来到了这片干净得发亮的乡间宅邸，地板打蜡打得像镜子一样，墙上挂着油画，厨房里飘出烤肉的香气。每一样东西都在提醒他：你是个外人。"}, {"tag": "p", "html": "约翰·里德是这家的少爷，比保尔大四岁，是个胖墩墩的小混蛋。他很快发现保尔是个可以欺负的对象——既不是亲戚，又没爹没妈，更重要的是，保尔看起来不爱说话，而不爱说话的人在他眼里就是好欺负的人。"}, {"tag": "p", "html": "第一次冲突发生在一棵老栗子树下面。"}, {"tag": "p", "html": "那是下午放学后——保尔虽然没上过学，但里德太太请了一个家庭教师给自己的孩子上课，保尔被允许旁听。约翰·里德拿了一本书，朝保尔扔过去：&quot;工人家的崽子，给我捡起来。&quot;"}, {"tag": "p", "html": "保尔没捡。他看着约翰，眉头皱紧，下巴绷得硬邦邦的。"}, {"tag": "p", "html": "&quot;我说的话你听见没有？&quot;约翰又扔了一本。"}, {"tag": "p", "html": "保尔依旧没动。他不是简·爱那种会组织语言的人，他压根就不知道该用什么话来回应这种羞辱。他的脑子里一片空白，只有一团火在烧。"}, {"tag": "p", "html": "约翰走过来，伸手就要揪保尔的耳朵。保尔的反应不是言语上的反驳，而是本能的、来自工人区孩子的反应——他的拳头直接招呼到了约翰的鼻子上。"}, {"tag": "p", "html": "&quot;砰&quot;的一声，约翰倒在地上，鼻血涌出来，哇哇大哭。"}, {"tag": "p", "html": "里德太太冲出来的时候，看到的是倒在地上的儿子和站在原地喘着粗气的保尔。保尔的手还攥成拳头，眼睛瞪得通红，胸口剧烈起伏。"}, {"tag": "p", "html": "&quot;你这个野兽！&quot;里德太太喊道，&quot;给我关到红房间里去！&quot;"}, {"tag": "p", "html": "这就是保尔和简·爱遇到的第一个大冲突——但应对方式截然不同。简·爱会用言语顶撞，会说出&quot;你不是我的主人，我不是你花钱买的佣人&quot;这样的话，她会用语言反抗不公。但保尔不会。他不善于言辞，他的反应直接而暴烈，挥拳相向。结果呢？简·爱换来的是被关，但她的反抗有理有节，激起了里德太太的愤怒之外，还有隐隐的忌惮；而保尔换来的，是被关之外，还要背上&quot;野蛮&quot;&quot;没有教养&quot;&quot;工人家的粗鲁孩子&quot;的标签。"}, {"tag": "p", "html": "红房间是个空旷的、平时不用的卧室，窗帘厚厚地垂下，光线昏暗。简·爱在这里会感到恐惧，会想到死亡的叔父，会在黑暗中崩溃。但保尔不同。"}, {"tag": "p", "html": "他被推进去之后，先是站在原地愣了一会儿，然后他开始砸东西。"}, {"tag": "p", "html": "他把床头柜上的一盏台灯摔到墙上，把床头的一把木椅踢翻，把窗帘扯下来一块——他的力气大得惊人，怒火又给了他额外的能量。"}, {"tag": "p", "html": "他一边砸一边骂，骂的是粗野的工人区脏字，是里德太太听了一定要晕过去的那种话。他不是在反抗什么具体的不公，他只是单纯的愤怒——愤怒自己的处境，愤怒没有人喜欢他，愤怒自己连说话都不会。"}, {"tag": "p", "html": "但砸完之后，他慢慢冷静下来。"}, {"tag": "p", "html": "他坐在地板上，看着自己因为砸东西而磕破的指关节，又开始发呆。他不知道该怎么办。在工人区的时候，遇到麻烦可以回家找父亲，找邻居大叔，可以用拳头解决一切。但在这里，他一个人，四周都是敌人。"}, {"tag": "p", "html": "他开始想家——那个烟雾弥漫的小房子。父亲在世的时候，常常会摸着他的头说：&quot;保夫鲁沙，你是个男子汉，要扛得住事儿。&quot;保尔此刻多想让父亲再摸摸他的头。"}, {"tag": "p", "html": "但父亲不在了。"}, {"tag": "p", "html": "他在红房间里坐了一夜。第二天早晨，贝茜来开门的时候，看到的是满地的狼藉和一个坐在碎木片和破布中间发呆的男孩。贝茜是个心善的姑娘，她没有去报告里德太太，只是默默地收拾了现场，给保尔端来了一碗稀粥。"}, {"tag": "p", "html": "接下来的日子，是保尔和盖茨海德持续的战争。"}, {"tag": "p", "html": "约翰·里德在鼻梁上贴了一个星期的膏药，他对保尔怀恨在心，时时刻刻找机会报复。他会在家庭教师上课的时候故意用脚踢保尔的椅子，会在吃饭的时候把肉汤泼到保尔身上，会叫妹妹们不要和保尔说话。"}, {"tag": "p", "html": "简·爱会用尖锐的话语回击他，让约翰在言语上占不到便宜。但保尔不会。他每次被踢了椅子，就猛地站起来，用那双燃烧的眼睛瞪着约翰。他不会说什么&quot;你不该这样对我&quot;的话，他只会攥紧拳头，嘴唇紧抿。"}, {"tag": "p", "html": "很多时候，约翰会被他的眼神吓退——但更多时候，约翰会去报告里德太太。里德太太的处理方式永远是相似的：把保尔叫来，不问青红皂白地训斥一顿，然后威胁说要把他送到更差的学校去。"}, {"tag": "p", "html": "保尔对这种威胁又气又无奈。他不是简·爱那种能说出&quot;我知道你讨厌我，但我不在乎&quot;的人。他在乎。他想被接纳，想被当成一个平等的人对待。但他不知道怎么做。"}, {"tag": "p", "html": "有一次冲突特别严重。"}, {"tag": "p", "html": "那是圣诞节前后，盖茨海德的孩子们都在客厅里拆礼物。里德太太给约翰买了一本漂亮的画册，给伊丽莎和乔治亚娜各买了一盒糖果，给贝茜·利文也送了一份——但给保尔的，只有一小盒劣质的姜饼。"}, {"tag": "p", "html": "保尔看着自己手里那一小盒姜饼，再看看约翰手里厚厚一摞的礼物，他的脸涨得通红，脖子上的青筋都鼓了出来。"}, {"tag": "p", "html": "他没说话。他直接把那盒姜饼摔到了壁炉里。"}, {"tag": "p", "html": "里德太太尖叫起来：&quot;你这个不知好歹的孩子！&quot;"}, {"tag": "p", "html": "&quot;我不要！&quot;保尔终于爆发了，但他说出来的只有这四个字。他说不清自己为什么愤怒——为什么同样是孩子，他就要被这样对待？为什么舅舅在世的时候说过&quot;会把他当自己的孩子养&quot;，结果他得到的待遇连仆人都不如？"}, {"tag": "p", "html": "但他的爆发是无力的。简·爱如果遇到这种场景，会冷冷地说一句&quot;你不是我的亲人，也没有义务为我花钱，但既然接受了舅舅的托付，就不该这样羞辱我&quot;之类的话。保尔说不出这种话。他只会用粗暴的方式表达——摔东西，挥拳，嘶吼——然后被镇压，被关起来，被进一步边缘化。"}, {"tag": "p", "html": "那天他又被关进了红房间。这次他没有砸东西，只是呆呆地坐着，一直坐到天亮。"}, {"tag": "p", "html": "他在想一个问题——一个十岁的工人区孩子不会想的问题：&quot;我到底是谁？我为什么会在这个地方？&quot;"}, {"tag": "p", "html": "没有人能回答他。里德太太不能，贝茜不能，甚至他自己也不能。"}, {"tag": "h2", "html": "二、洛伍德学校"}, {"tag": "p", "html": "里德太太终于决定把保尔送去洛伍德学校了。这是一所专为穷人家孤女设立的寄宿学校，由布洛克尔赫斯特先生管理。但保尔不是女孩——这是故事里的一个变奏。在这个世界里，洛伍德学校是面向所有穷人家的孩子的，男女分校，但保尔去的是男校区——一个由布洛克尔赫斯特先生统一管辖的、规训森严的地方。"}, {"tag": "p", "html": "离开盖茨海德的那天早上，保尔没有像简·爱那样冷静地坐上马车，克制地告别。他穿好衣服，拎着那个装着他全部家当的小箱子，沉默地走出了红房子的大门。"}, {"tag": "p", "html": "他没回头。"}, {"tag": "p", "html": "他不是不想回头，而是他知道，如果回头，他会忍不住冲回去，冲进约翰的房间再揍他一顿。他能忍住的唯一方式就是——不回头。"}, {"tag": "p", "html": "贝茜把他送上马车，临走前塞给他一小包肉干。保尔看着她，喉咙动了动。他想说&quot;谢谢&quot;，但最终没说出口。他只是用力地点了点头。"}, {"tag": "p", "html": "马车启动的时候，他听到身后传来约翰的嘲笑声：&quot;工人家的崽子滚蛋啦！&quot;"}, {"tag": "p", "html": "保尔的拳头攥紧了，指甲嵌进肉里。他没回头。"}, {"tag": "p", "html": "洛伍德学校在荒原上，是一栋灰扑扑的建筑，比盖茨海德的红房子大得多，但气氛压抑得多。布洛克尔赫斯特先生是个高瘦的牧师，脸像刀削一样严厉，嗓音又尖又冷，像一根生锈的铁钉划在玻璃上。他第一次见到新入学的孩子们，就发表了那番著名的训话——关于简朴、驯服、赎罪的那套理论。"}, {"tag": "p", "html": "简·爱听到这套理论会感到愤怒和羞辱，会在心中默默反驳。但保尔听不懂这套理论。他的工人区生活让他对宗教一无所知，他只听出了几个词：服从，规矩，清教徒式的自我折磨。"}, {"tag": "p", "html": "他皱了皱眉，没说话。"}, {"tag": "p", "html": "但他身边的其他孩子都哭了——那些贫民窟来的孩子，原本就瘦弱，见到这种阵势早就吓坏了。保尔没有哭。他不是不害怕，而是他的害怕会用另一种方式表达——他会攥紧拳头，咬紧牙关，把恐惧压在心底，转化成一种硬邦邦的、冷漠的镇定。"}, {"tag": "p", "html": "谭波儿小姐是这所学校里为数不多的温和力量。她年轻，金发，笑容温柔，是贫民窟孩子们心中的一道光。简·爱能在她身上找到精神上的母亲，能和她建立一种近乎灵魂上的纽带。但保尔不同。"}, {"tag": "p", "html": "保尔不善言辞。"}, {"tag": "p", "html": "谭波儿小姐第一次和保尔谈话，问他在盖茨海德过得怎么样。保尔只是简短地回答：&quot;不好。&quot;没有细节，没有情感，只有这两个字。"}, {"tag": "p", "html": "谭波儿小姐很耐心，她又问：&quot;你有没有想念家乡？&quot;"}, {"tag": "p", "html": "保尔想了半天，说：&quot;有一个家。父亲死了。&quot;"}, {"tag": "p", "html": "谭波儿小姐试图引导他多说一些，但保尔说不出来。在工人区，他的周围都是不善言辞的男人——锅炉工、码头工、铁路工人——他们表达情感的方式是拍拍肩膀，是沉默地递过来一杯伏特加，是偶尔说一句&quot;小子，你真行&quot;。他没有学到过如何与一个温柔的女人交谈，更没有学过如何向一个陌生人敞开自己的内心。"}, {"tag": "p", "html": "谭波儿小姐看出了他的困境。她没有勉强他，只是轻轻摸了摸他的头，说：&quot;你可以慢慢来。这里没人会逼你说话。&quot;"}, {"tag": "p", "html": "保尔的眼眶忽然就红了。"}, {"tag": "p", "html": "他不知道为什么会这样。在盖茨海德那么多年，他挨过打，挨过饿，被关过红房间，他都没有哭过。但谭波儿小姐这一句简简单单的话，让他突然感到——有人在乎他。"}, {"tag": "p", "html": "但他依旧没有说话。他只是猛地转过身去，假装在整理自己的行李箱。"}, {"tag": "p", "html": "海伦·彭斯是保尔在洛伍德认识的第一个朋友。"}, {"tag": "p", "html": "海伦和保尔一样，也是穷人家的孩子，但她比保尔更瘦弱，更苍白，一看就是那种体弱多病的孩子。她的眼睛里有一种超越年龄的平静，说话轻柔，举止得体。她在盖茨海德没有遇到过的那些事——被舅母欺负，被表兄侮辱——她靠的是另一种方式来应对：她把一切交给上帝，相信来世会有公正。"}, {"tag": "p", "html": "简·爱和海伦的友谊是精神上的相互扶持——简·爱从海伦身上学会了忍耐和信念，海伦从简·爱身上学会了反抗的勇气。她们之间有真正的灵魂交流。"}, {"tag": "p", "html": "但保尔和海伦的友谊是另一种形态。"}, {"tag": "p", "html": "保尔不善言辞，他不会和海伦谈什么精神世界，谈什么信念，谈什么对上帝的信仰。他和海伦之间的连接，是沉默。"}, {"tag": "p", "html": "海伦第一次主动和保尔说话，是在他被高个子男孩欺负之后。"}, {"tag": "p", "html": "洛伍德学校里有几个年龄大一些的男孩，他们形成了一个小团体，专门欺负新来的、瘦小的孩子。保尔虽然不是最瘦小的，但他不爱说话、不善言辞，再加上工人家的身份，很快就成了被针对的对象。"}, {"tag": "p", "html": "那天，三个男孩把保尔堵在了操场角落。"}, {"tag": "p", "html": "&quot;听说你是从蒸汽火车上来的？&quot;领头的那个叫亨利的男孩讥讽道，&quot;你爸是不是个锅炉工？身上是不是一辈子都有煤烟味？&quot;"}, {"tag": "p", "html": "保尔的拳头攥紧了。但他没有挥出去——他知道打不过三个人。"}, {"tag": "p", "html": "他只是盯着亨利，一言不发。"}, {"tag": "p", "html": "亨利的伙伴开始推搡他，把他的书包扔到了泥里。保尔的眼睛充血，嘴唇咬得发白，但他还是没有动。他不是不想反抗，他是想起了父亲的话：&quot;保夫鲁沙，男子汉不是匹夫之勇。要打得赢。&quot;"}, {"tag": "p", "html": "就在他们要动手打保尔的时候，海伦出现了。"}, {"tag": "p", "html": "她不知道是从哪里冒出来的，她瘦弱的身体站在几个大男孩面前，柔声说：&quot;先生们，谭波儿小姐过来了。&quot;"}, {"tag": "p", "html": "亨利几个回头一看，果然远处有个身影走过来。他们骂骂咧咧地散开了。"}, {"tag": "p", "html": "保尔抬起头，看着海伦。他想说&quot;谢谢&quot;，但他说不出来。"}, {"tag": "p", "html": "海伦也没说什么。她只是弯下腰，帮他捡起书包，拍了拍上面的泥。"}, {"tag": "p", "html": "从那以后，他们就成了朋友。"}, {"tag": "p", "html": "但他们的友谊是奇怪的——两个都不爱说话的人，凑在一起，能做什么呢？他们一起在操场上散步，但大多数时候都是沉默的。海伦有时候会轻声问一句&quot;你今天怎么样&quot;，保尔就回答&quot;还行&quot;，然后又是长久的沉默。"}, {"tag": "p", "html": "简·爱和海伦会一起讨论书籍，讨论布道，讨论信仰。但保尔和海伦不会。他们之间的连接点是——都曾经被欺负过，都曾经被抛弃过，都在这个世界上感到格格不入。这种同病相怜不需要语言来确认。"}, {"tag": "p", "html": "有一次，保尔忍不住问海伦：&quot;你为什么不反抗他们？&quot;"}, {"tag": "p", "html": "海伦愣了一下，思考了很长时间，然后说：&quot;因为反抗会带来更多的痛苦。我宁愿把希望寄托在来世。&quot;"}, {"tag": "p", "html": "保尔沉默了。他不同意这种看法，但他也反驳不了——他找不到合适的词来反驳。在工人区，反抗就是挥拳头，就是拼命，没有第三条路。海伦的方式让他觉得陌生，但又隐隐有些敬畏。"}, {"tag": "p", "html": "&quot;你呢？&quot;海伦问他，&quot;你为什么不反抗？&quot;"}, {"tag": "p", "html": "保尔想了好一会儿，说：&quot;打不过。&quot;"}, {"tag": "p", "html": "他不会说什么&quot;虽然我拳头硬，但我也不想成为暴力的奴隶&quot;之类的话。他只有最简单的、最真实的想法——打不过就不打。但他没说出来的是：他其实也在思考，反抗的真正意义是什么。"}, {"tag": "h2", "html": "三、海伦与崩塌"}, {"tag": "p", "html": "洛伍德学校的日子是苦的。伙食差得离谱——简·爱时代的女校里，伙食已经够糟糕了，但男校更糟糕。早餐是稀得能照见人影的燕麦粥，午餐是煮得发灰的土豆，晚餐是发硬的黑面包。保尔是从工人区来的孩子，他本来以为自己对饥饿有一定的耐受力，但洛伍德学校的饥饿是一种新的体验——不是吃不饱，而是吃的东西让你不想吃。"}, {"tag": "p", "html": "保尔的急躁性格在这里遇到了麻烦。"}, {"tag": "p", "html": "他不是那种能忍耐的人。当食堂里端上来的粥稀得跟水一样的时候，他会直接皱眉头，把勺子扔到桌上。他不会像简·爱那样默默忍受，也不会像其他孩子那样低声抱怨，他会直接用行动表达不满——比如把整个盘子推到一边，站起来就走。"}, {"tag": "p", "html": "这种行为给他招来了很多麻烦。"}, {"tag": "p", "html": "布洛克尔赫斯特先生是个眼睛里揉不得沙子的人。他很快就注意到了这个工人区来的&quot;刺头&quot;。他当众训斥保尔，说他&quot;贪图口腹之欲&quot;&quot;缺乏对主的敬畏&quot;&quot;工人家的粗鄙习气未除&quot;。"}, {"tag": "p", "html": "简·爱遇到这种羞辱会感到屈辱，会在心里默默反抗，会用眼神传达她不屈的意志。但保尔不会掩饰。他会直接瞪回去。"}, {"tag": "p", "html": "他瞪着布洛克尔赫斯特先生，下巴扬起来，嘴唇紧抿，眼睛里几乎要喷出火来。"}, {"tag": "p", "html": "布洛克尔赫斯特先生气得脸发青。他当着全校师生的面宣布：&quot;这个孩子没有教养，缺乏对神的敬畏。我会写信给他的监护人。&quot;"}, {"tag": "p", "html": "保尔听到&quot;监护人&quot;三个字，心里咯噔一下——里德太太。如果她接到这封信，又会怎么样？她会来把他领回去吗？她会把他送到更低贱的地方去吗？"}, {"tag": "p", "html": "他不知道该怎么办。他从来不善于应对这种复杂的、涉及大人之间关系的事情。在工人区，大人之间的矛盾用拳头解决，但这里的大人——尤其是布洛克尔赫斯特先生——他不相信拳头能解决。"}, {"tag": "p", "html": "那天晚上，他躺在床上很久没睡着。他在想一个问题——一个工人区孩子不会想的问题：&quot;我是不是真的太粗野了？是不是我就不该来到这种地方？&quot;"}, {"tag": "p", "html": "但他随即又否定了这个想法。他想：是他们不让我吃饭，是他们欺负我，是他们把我当牲畜——凭什么我还不能生气？"}, {"tag": "p", "html": "他的性格就是这样——刚烈，急躁，不会转弯。在工人区，这种性格是优点，是能在街上活下来的资本；但在这里，在这个讲究&quot;驯服&quot;的伪善环境里，这种性格让他四处碰壁。"}, {"tag": "p", "html": "真正改变一切的，是海伦的病。"}, {"tag": "p", "html": "那是初春的时候，冰雪刚开始融化，操场上还有最后几块没化净的冰。海伦那天没有来吃早饭，午饭也没来吃。下午的时候，保尔去找她，发现她躺在宿舍的床上，脸色苍白得像纸，嘴唇却红得发紫。"}, {"tag": "p", "html": "&quot;海伦？&quot;保尔站在床边，不知道该怎么办。"}, {"tag": "p", "html": "海伦的眼睛睁着，但眼神涣散。她看见保尔，嘴唇动了动，想笑，但笑不出来。"}, {"tag": "p", "html": "&quot;我没事，&quot;她说，&quot;就是有点累。&quot;"}, {"tag": "p", "html": "保尔蹲下来，仔细看着她。他不知道该说什么。他想说&quot;你会好起来的&quot;，但他不确定；他想问&quot;你哪里疼&quot;，但他不知道怎么问；他想说&quot;我陪着你&quot;，但他开不了口。"}, {"tag": "p", "html": "他只是默默地坐在她的床边，握着她的手。"}, {"tag": "p", "html": "他的手很大，很粗糙，上面有干活磨出来的茧子。海伦的手很小，很凉，像一片正在融化的雪。"}, {"tag": "p", "html": "&quot;保尔，&quot;海伦轻声说，&quot;你以后要好好的。&quot;"}, {"tag": "p", "html": "&quot;你在说什么，&quot;保尔皱眉，&quot;你只是感冒了。&quot;"}, {"tag": "p", "html": "海伦笑了。那个笑容很淡，像是一阵风。&quot;保尔，你是好人。你只是不会表达。&quot;"}, {"tag": "p", "html": "保尔不知道该说什么。他想说&quot;你也是好人&quot;，但他说不出口。"}, {"tag": "p", "html": "海伦又咳嗽了几声，闭上眼睛。保尔就那样握着，一直握着。"}, {"tag": "p", "html": "第二天，海伦被送到了洛伍德学校旁边的小医院——其实就是个小诊所，由斯凯契德小姐和她的几个助手管理。保尔不能去看她，因为男校和女校隔着一条走廊加一道门，他没有理由过去。"}, {"tag": "p", "html": "他只能在操场上远远地望着女校的方向，心里七上八下。"}, {"tag": "p", "html": "他不知道海伦得的是什么病。他不知道病能不能好。他唯一知道的是——海伦是他在这里唯一的朋友，如果他失去了她，他就又是孤零零的一个人了。"}, {"tag": "p", "html": "这种恐惧比在盖茨海德被关红房间还要可怕。"}, {"tag": "p", "html": "一周后，噩耗传来。"}, {"tag": "p", "html": "海伦死了。"}, {"tag": "p", "html": "谭波儿小姐在女生宿舍里告诉了大家这个消息。据说海伦临死前很平静，没有挣扎，就像睡着了一样。斯凯契德小姐说她是个天使，去了天堂。"}, {"tag": "p", "html": "保尔是从其他男生那里听说这个消息的。"}, {"tag": "p", "html": "他正在食堂吃午饭——那碗永远稀得能照见人影的粥——听到有人低声说：&quot;彭斯家的小姑娘死了。&quot;"}, {"tag": "p", "html": "保尔的勺子&quot;当&quot;的一声掉进了碗里。"}, {"tag": "p", "html": "他没有哭。他只是愣在那里，愣了很久，然后慢慢站起来，走出了食堂。"}, {"tag": "p", "html": "没有人追问他。他走到了操场后面，一个没人去的角落，那里有一棵半死不活的枯树。他站在树下，仰头看着天空。"}, {"tag": "p", "html": "他想哭。但他的眼泪好像被什么东西堵住了，怎么都流不出来。"}, {"tag": "p", "html": "简·爱听到海伦去世的消息时，是默默流泪，是坐在那里把头埋进膝盖里无声地哭泣。但保尔不会这样。他不会那种柔软的、内敛的哀悼方式。他只是站在那里，像一块石头一样。"}, {"tag": "p", "html": "他的脑海里反复出现海伦最后跟他说的话——&quot;保尔，你是好人。你只是不会表达。&quot;"}, {"tag": "p", "html": "他到现在才明白这句话的意思。海伦知道他不善言辞，海伦知道他的急躁和沉默，但海伦从来没有嫌弃过他。海伦是用另一种方式爱他——一种不需要语言的方式。"}, {"tag": "p", "html": "而他呢？他甚至都没对海伦说过一句&quot;谢谢&quot;，没说&quot;我想和你做朋友&quot;，没说&quot;你对我很重要&quot;。"}, {"tag": "p", "html": "他越想越愤怒。但他的愤怒不知道该指向谁——指向夺走海伦生命的病魔？指向糟糕的伙食和恶劣的居住条件让海伦的身体越来越弱？指向那个伪善的布洛克尔赫斯特管理体系？指向这个不公的、把人分成三六九等的世界？"}, {"tag": "p", "html": "他不知道。他只知道，他必须离开这里。"}, {"tag": "h2", "html": "四、决定离开"}, {"tag": "p", "html": "那天晚上，保尔没有回宿舍。他躲在操场的角落里，一整夜没睡。"}, {"tag": "p", "html": "他在想海伦，想盖茨海德，想那个死去的父亲，想工人区的街坊。他想为什么穷人家的孩子就该被这样对待——吃不饱，穿不暖，被当成牲畜一样管教，稍微反抗一下就被打上&quot;野蛮人&quot;的标签。他想为什么海伦这样一个好姑娘会病死，而不是好好地活下去。他想为什么他自己连句&quot;谢谢&quot;都说不出口。"}, {"tag": "p", "html": "他不是简·爱那种会自我分析的人——简·爱会在心里对自己说&quot;我现在很悲伤，因为我失去了一个朋友&quot;，能把复杂的情感一层一层剖析清楚。保尔不会。他只有一团乱麻一样的情绪，纠结在他胸口，让他喘不过气来。"}, {"tag": "p", "html": "第二天早晨，他找到了谭波儿小姐。"}, {"tag": "p", "html": "谭波儿小姐看到他很惊讶。她已经听说了海伦去世的消息，也知道保尔和海伦关系不错。她让保尔坐下，给他倒了一杯水。"}, {"tag": "p", "html": "&quot;保尔，&quot;她轻声说，&quot;你来是想说海伦的事吗？&quot;"}, {"tag": "p", "html": "保尔摇摇头。他低着头，盯着地面。他不知道该怎么开口。"}, {"tag": "p", "html": "谭波儿小姐很有耐心。她等着。"}, {"tag": "p", "html": "过了很久，保尔终于说：&quot;我要离开这里。&quot;"}, {"tag": "p", "html": "谭波儿小姐愣了一下。&quot;离开？为什么？&quot;"}, {"tag": "p", "html": "保尔又沉默了。"}, {"tag": "p", "html": "谭波儿小姐没有催促。她只是静静地看着他，等待。"}, {"tag": "p", "html": "过了大约一分钟，保尔开口了。但他说出来的不是简·爱那种流畅的、有逻辑的句子，而是断断续续的、带着工人区口音的短句："}, {"tag": "p", "html": "&quot;我不想……不想再待在这种地方。这里让我想起海伦。我受不了。&quot;"}, {"tag": "p", "html": "谭波儿小姐听出了他话里的意思——他不是不爱这里，他是害怕再次失去，害怕再次无力。"}, {"tag": "p", "html": "&quot;保尔，&quot;她温和地说，&quot;你现在还小，离开学校，你能去哪里呢？&quot;"}, {"tag": "p", "html": "保尔抬起头。他不知道。他真的不知道。"}, {"tag": "p", "html": "他不像简·爱那样有一个明确的目标——简·爱离开洛伍德是为了寻找新生活，是为了自由和爱，是有方向的。保尔的目标是模糊的。他只是想要逃离，逃离这个让他想起海伦的地方，逃离这种压抑的、伪善的环境。但逃到哪里去，他不知道。"}, {"tag": "p", "html": "&quot;我可以做工，&quot;保尔说，&quot;像我爸那样。&quot;"}, {"tag": "p", "html": "谭波儿小姐的眼神暗了一下。她想说&quot;你还是个孩子&quot;，但她忍住了。她知道这个孩子已经受了太多苦，已经不能再用&quot;孩子&quot;的标准来要求他了。"}, {"tag": "p", "html": "&quot;保尔，&quot;她说，&quot;你有没有想过，如果你离开学校，你要去哪里？里德太太会来接你吗？&quot;"}, {"tag": "p", "html": "保尔的身体僵了一下。里德太太。他差点忘了这个人。"}, {"tag": "p", "html": "&quot;不会，&quot;他说，&quot;她不会来接我。&quot;"}, {"tag": "p", "html": "&quot;那你怎么打算？&quot;"}, {"tag": "p", "html": "保尔又沉默了。他没有打算。他只是凭着一股冲动——这恰恰是他性格中最危险的部分——做出决定。他不会像简·爱那样规划好未来，他只是要离开。"}, {"tag": "p", "html": "谭波儿小姐叹了口气。她理解这个孩子，但她的能力有限。"}, {"tag": "p", "html": "&quot;保尔，&quot;她说，&quot;我帮你写封信给里德太太，问问她的意思。你先别走，等我消息，好吗？&quot;"}, {"tag": "p", "html": "保尔没有回答。他不知道该不该答应。"}, {"tag": "p", "html": "他想了想，说：&quot;好。&quot;"}, {"tag": "p", "html": "这是他难得一次的让步。在工人区，他从来不向任何人让步——邻居欺负他，他就打回去；老板克扣工钱，他就当面质问。但今天，他向谭波儿小姐让步了。"}, {"tag": "p", "html": "不是因为他害怕谭波儿小姐，而是因为——她让他想起了海伦。她们都是温柔的、不会伤害他的人。"}, {"tag": "p", "html": "谭波儿小姐给里德太太写了信。一个星期后，回信来了。"}, {"tag": "p", "html": "里德太太的回信简短而冷淡。她说，她已经尽到了责任，如果保尔想离开，就让他离开，她不会再来管他。她建议把保尔送到一家店铺去做学徒，或者干脆送他回工人区，让他自谋生路。"}, {"tag": "p", "html": "谭波儿小姐读完信，很久没说话。她没想到里德太太会这么绝情。"}, {"tag": "p", "html": "她把信的内容告诉了保尔。保尔听完，只是点了点头。"}, {"tag": "p", "html": "他早就猜到了。从他被关进红房间的那一天起，他就知道——里德太太从来没把他当成家人。"}, {"tag": "p", "html": "&quot;那我就去做学徒，&quot;他说。"}, {"tag": "p", "html": "谭波儿小姐看着这个男孩。她想说很多话——想说&quot;我会帮你找一家好一点的店&quot;，想说&quot;你要小心&quot;，想说&quot;你以后要常常写信给我&quot;——但她看到保尔的眼睛，看到那双眼睛里的疲惫和倔强，她最终只说了一句：&quot;保尔，你要做个好人。&quot;"}, {"tag": "p", "html": "保尔点了点头。"}, {"tag": "p", "html": "这是他和谭波儿小姐最后的对话。"}, {"tag": "h2", "html": "五、新的路"}, {"tag": "p", "html": "离开洛伍德的那天早上，下着小雨。"}, {"tag": "p", "html": "简·爱离开洛伍德的时候是个晴天，她坐在马车上回望学校，心里充满了复杂的情感——既有对过去的告别，也有对未来的期待。但保尔离开洛伍德的时候是个雨天，雨点打在脸上，冷冰冰的，他心里只有一团乱麻。"}, {"tag": "p", "html": "他没有坐马车——里德太太没有派马车来接他。谭波儿小姐给了他一些钱，让他搭公共马车去镇上的那家鞋店报到。他独自一人拎着箱子，淋着雨，走出了洛伍德的大门。"}, {"tag": "p", "html": "他没有回头。"}, {"tag": "p", "html": "他不知道前方等待他的是什么。简·爱离开洛伍德的时候知道——她要去找新生活，她要自立，她要成为一个独立的女人。保尔不知道。他只知道——他不能再待在这里了，这里有海伦的影子，有他无法面对的过去。"}, {"tag": "p", "html": "公共马车在洛伍德外面的路口等着，赶车的是个沉默寡言的中年人，看了一眼保尔的车票，什么都没问，就指了指后面的座位。"}, {"tag": "p", "html": "保尔跳上车，找了个靠边的角落坐下。车子启动的时候，洛伍德学校的轮廓在后视镜里一点点缩小，最后消失在一片雨雾里。"}, {"tag": "p", "html": "他一边走一边想。海伦的脸在他脑海里反复出现——那张苍白的脸，那双温柔的眼睛，那句&quot;你是好人，你只是不会表达&quot;。"}, {"tag": "p", "html": "他想：海伦说我不会表达。也许她说得对。也许我这辈子都学不会怎么说话。但我会做。我会用行动证明。"}, {"tag": "p", "html": "他想：海伦说让我好好的。我会的。我会好好的。我会成为一个像父亲那样的人——能扛得住事儿的人。"}, {"tag": "p", "html": "他想：可是，父亲最后也死了。我会不会也像父亲一样？"}, {"tag": "p", "html": "他不知道。"}, {"tag": "p", "html": "他只知道，他必须走下去。"}, {"tag": "p", "html": "雨打在马车的帆布顶上，沙沙作响。车里还坐着几个赶集的农妇和一个小商人，没人注意到角落里这个拎着小箱子、浑身湿透的孩子。保尔缩在座位上，盯着自己的脚尖，听着车轮碾过泥泞路面的声音。"}, {"tag": "p", "html": "他第一次感到一种奇怪的平静。"}, {"tag": "p", "html": "不是快乐的平静，而是一种——什么呢？——他找不到合适的词来形容。在工人区，在盖茨海德，在洛伍德，他的心一直是绷紧的，每一刻都像上紧了发条的钟表，随时准备应对下一场冲突。但现在，他坐在一辆陌生的马车里，去一个他完全不知道的地方，没有人认识他，没有人要求他做任何事。"}, {"tag": "p", "html": "他的手指慢慢松开。"}, {"tag": "p", "html": "他第一次发现，原来放松是这种感觉。"}, {"tag": "p", "html": "\u003cstrong>\\u2026\u003c/strong>"}, {"tag": "p", "html": "马车走了三个多小时，终于在一个灰扑扑的小镇停下来。"}, {"tag": "p", "html": "镇子不大，主街两旁是几栋砖木结构的房子，有一家铁匠铺、一家杂货店、一个邮局、两家酒馆。保尔跳下车，拎着箱子，站在路边。"}, {"tag": "p", "html": "雨小了一些，但还在下。他的衣服早就湿透了，贴在身上，又冷又沉。"}, {"tag": "p", "html": "&quot;鞋店？&quot;赶车的指了指街尾，&quot;那边，挂着个鞋楦招牌的就是。&quot;"}, {"tag": "p", "html": "保尔点头，付了钱——谭波儿小姐多塞了一些，他口袋里的零钱足够——拎着箱子朝街尾走去。"}, {"tag": "p", "html": "鞋店的名字叫&quot;老威尔金斯皮靴店&quot;，门口果然挂着一个木头鞋楦，被雨水打得发亮。门很窄，要侧身才能进去。里面弥漫着一股皮革和桐油混合的气味。"}, {"tag": "p", "html": "老板是个驼背的老头，叫威尔金斯先生，手指粗短，指甲缝里嵌着永远洗不掉的黑油。他抬头看了一眼保尔，又看了一眼谭波儿小姐写的介绍信。"}, {"tag": "p", "html": "&quot;工人家的孩子？&quot;他问。"}, {"tag": "p", "html": "&quot;是。&quot;保尔说。"}, {"tag": "p", "html": "&quot;会干活吗？&quot;"}, {"tag": "p", "html": "&quot;会。&quot;"}, {"tag": "p", "html": "威尔金斯先生没再多问。他指了指后院：&quot;住那儿。今晚先歇着，明天跟我学。&quot;"}, {"tag": "p", "html": "保尔被领进了后院的一间小屋子——以前大概是仓房，现在勉强能住人，里面只有一张木板床、一张破桌子、一个水盆。墙角堆着一些做鞋剩下来的皮革边角料。"}, {"tag": "p", "html": "但保尔没有抱怨。"}, {"tag": "p", "html": "他放下箱子，坐在木板床上，双手撑着床沿。"}, {"tag": "p", "html": "这是他第一次有了属于自己的房间。"}, {"tag": "p", "html": "在盖茨海德，他住的是仆人房，没有窗户；在洛伍德，他住的是八人宿舍，连翻身都要小心撞到邻铺。但这里，这间不到四平米的小屋，是他的。"}, {"tag": "p", "html": "他看着窗外。雨已经停了，灰蒙蒙的天边透出一丝微弱的亮光。"}, {"tag": "p", "html": "他想起父亲。"}, {"tag": "p", "html": "父亲在世的时候，最爱说的一句话是&quot;保夫鲁沙，人活着要像棵橡树——根扎得深，枝长得硬，风来了不弯腰，雨来了不低头&quot;。保尔那时候不懂，他只觉得这话说得太老套了。但现在，他坐在陌生的异乡的小屋里，他忽然懂了。"}, {"tag": "p", "html": "父亲不是要他变成一棵橡树。父亲是告诉他——无论风怎么吹，雨怎么下，你都得站着。"}, {"tag": "p", "html": "他躺下来，望着低矮的天花板。"}, {"tag": "p", "html": "他不知道未来会怎样。他不知道自己会不会永远在这家鞋店里做学徒，会不会有一天也像父亲那样死在工地上，会不会像海伦那样年纪轻轻就走了。"}, {"tag": "p", "html": "但他知道一件事——"}, {"tag": "p", "html": "他不会低头。"}, {"tag": "p", "html": "他闭上眼。窗外那片灰蒙蒙的天，渐渐透进了屋来。"}, {"tag": "p", "html": "\u003cstrong>\\u2026\u003c/strong>"}, {"tag": "p", "html": "第二天早上，保尔是被一阵鸟叫声吵醒的。"}, {"tag": "p", "html": "他睁开眼，看到从那扇小窗户透进来的光——这是他好久没有见过的、清清爽爽的、带着早晨气息的光。不是盖茨海德那沉重的晨雾，不是洛伍德那死气沉沉的灰光，而是普普通通的、安安静静的、属于一个新地方的光。"}, {"tag": "p", "html": "他穿好衣服，拎着箱子里的工具，推开门。"}, {"tag": "p", "html": "鞋店还没开门，威尔金斯先生在后院劈柴，看到他出来，只是点了点头。"}, {"tag": "p", "html": "&quot;起得挺早。&quot;老头说。"}, {"tag": "p", "html": "保尔&quot;嗯&quot;了一声。"}, {"tag": "p", "html": "他走到水盆边，捧起一把凉水洗了脸。水很凉，激得他打了个激灵，但他没皱眉头。"}, {"tag": "p", "html": "他看着水盆里自己的倒影——一个瘦削的、黑黑的孩子，下巴绷得紧紧的，眼睛里有股还没熄灭的火。"}, {"tag": "p", "html": "这不就是一个普通的、崭新的开始吗？"}, {"tag": "p", "html": "没有人会叫他&quot;工人家的崽子&quot;。"}, {"tag": "p", "html": "没有人会让他吃不饱穿不暖。"}, {"tag": "p", "html": "没有人会用《圣经》和皮鞭告诉他必须驯服。"}, {"tag": "p", "html": "他可以成为他自己。"}, {"tag": "p", "html": "他攥紧拳头，又松开。"}, {"tag": "p", "html": "然后他走到威尔金斯先生面前，低声但清楚地说了一句："}, {"tag": "p", "html": "&quot;先生，我准备好了。&quot;"}, {"tag": "p", "html": "这是他离开洛伍德后说的第一句完整的话。"}, {"tag": "p", "html": "也是他第一次觉得——话从嘴里出来，不是为了回击，不是为了反抗，而是为了开始。"}, {"tag": "p", "html": "威尔金斯先生看了他一眼，破天荒地笑了笑。"}, {"tag": "p", "html": "&quot;行，跟我来吧。&quot;"}, {"tag": "p", "html": "保尔跟在老头身后，走进了充满皮革气味的鞋店。"}, {"tag": "p", "html": "外面的天，已经开始放晴了。"}, {"tag": "p", "html": "\u003cstrong>【完】\u003c/strong>"}], "illustrations": [{"title": "来到盖茨海德", "src": "assets/story/scene01-gaicihaide.webp", "anchor": 2}, {"title": "第一次挑衅", "src": "assets/story/scene02-tiaoxin.webp", "anchor": 11}, {"title": "挥拳一击（关键特写）", "src": "assets/story/scene03-punch.webp", "anchor": 16}, {"title": "被关红房间", "src": "assets/story/scene04-redroom.webp", "anchor": 21}, {"title": "摔姜饼", "src": "assets/story/scene05-gingerbread.webp", "anchor": 35}, {"title": "再次红房间", "src": "assets/story/scene06-redroom2.webp", "anchor": 42}, {"title": "离开盖茨海德", "src": "assets/story/scene07-leavegatehead.webp", "anchor": 47}, {"title": "洛伍德开学", "src": "assets/story/scene08-lowood-opening.webp", "anchor": 53}, {"title": "谭波儿小姐的温暖", "src": "assets/story/scene09-temple.webp", "anchor": 57}, {"title": "海伦出手相助", "src": "assets/story/scene10-helen-help.webp", "anchor": 72}, {"title": "沉默的友谊", "src": "assets/story/scene11-silent-walk.webp", "anchor": 84}, {"title": "食堂冲突", "src": "assets/story/scene12-canteen.webp", "anchor": 94}, {"title": "海伦病重（关键特写）", "src": "assets/story/scene13-helen-sick.webp", "anchor": 107}, {"title": "海伦去世", "src": "assets/story/scene14-helen-gone.webp", "anchor": 124}, {"title": "新生活的第一个早晨", "src": "assets/story/scene15-new-beginning.webp", "anchor": 227}]}</script><script src="story-book.js?rev=reading"></script></body></html>
